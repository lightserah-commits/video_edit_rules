  - id: P16
    name: 代弁（誰かになりきって言う）
    kind: 感情の強調（演出）
    # 2026-09-26 ユーザー確認。根拠：完成版8場面・2本目11場面。今までは判断の手順に入口が無く、一度も使われていなかった
    spot: |
      話者が自分以外の誰か（視聴者・部下・上司・AI・世の中の人）のセリフや心の声を、その人になりきって言う所。
      目印：「〜ってなる」「〜って言う」「〜って思う」の中身、口調や声色が変わる、会話を1人で演じる
    kinds:
      アホなふり:
        spot: わざと分かっていない人・大げさな人を演じて笑いにする（「お前もう職人とかせんでええけん」「え？これめちゃくちゃすごくない？」「あれ今私は何をやってたの」）
        screen: 調整レイヤーに黒帯（E003：クロップ 上12%・下14%）を、なりきっている間ずっと（中央値 3.4秒、0.4〜16秒）
        flip: 会話の相手役に切り替わる所は、左右反転つきの黒帯（E004）に替えて役ごとに交互にする（19場面中8場面）
        telop: なりきったセリフは通常字幕を外し、白い明朝（シュール T009、大きさは06の「シュールテロップ/P16」）を下の黒帯の中に1セリフ1枚
      常識を引っ張る:
        spot: 世の中の人・よくいる人が言いそうなセリフを代わりに言って、みんなの常識を引き出す（「田舎の方でAIで資料作れますよ」「先輩どうすればいいっすか」）
        screen: 黒帯は使わない
        telop: 白背景のセリフの札（T200）を並べる（並べ方は P11 の問いかけと同じ）。誰の役かを出す時は、左下に役名ラベル（T202「経理担当」など）
        illustration: 役の絵を添える。素材/イラスト/イラスト一覧.yaml から「役×気持ち」で選ぶ（無ければ許可をもらって足す）。テロップに埋め込まず、静止画として置く
    se: 場面の中では鳴らさない（オチの一言だけ SE_SUZU_SHAN など）
    bgm: 流したまま（2026-09-26 ユーザー指示。2本目に合わせる。完成版は長い場面で止めていたが採用しない）
    zoom: かけない
    observed: "完成版 05:02〜05:50・06:45〜07:13（アホなふり）／2本目 05:45〜05:53（アホなふり）・12:14〜12:25（経理担当）・18:38〜18:54（先輩と後輩）"

