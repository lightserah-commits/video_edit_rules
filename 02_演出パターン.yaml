# 演出パターン表（工程5で使う装飾の本体。工程8でどの段に置くかも、ここの output_tracks）
#
# 発話の「性質」から、テロップの型・SE・ズーム・BGM を1セットで決める表。
#   判断の手順は 01、SE の中身は 03、ズーム・BGM・テンポの数字は 04、動きは 05、文字の大きさは 06、図解は 09。
#   意味の強調／感情の強調は、パターンではなく中身で決める（01 の「大前提」）。パターンは型（温度）を選ぶ目安。
# type は標準の型ID（2026-09-26 ユーザー確認）。実物は 見本/型一覧.md、複製は tools/reproduce.py（見本/README.md）。
# zoom の scale は完成版の観測の幅。実際に置く倍率と、ズームしない所（聞き手の字幕・画面の間）は 04 の zoom。
# スタイル名・ID（S01〜S21）は ~/Desktop/担当2/03_編集ルール定義/演出図鑑 と同じ。SE の id は 03。
# 観測の件数・時刻つきの例は 実例/根拠と実例.md の「02」と 実例/みかみCH0726/events.csv（全279件）。変えた記録は 変更履歴.md。

version: 0.2
status: 確定（パターンの中身は 2026-09-26〜28 のユーザー確認。数字は1本目の完成版の観測。2026-10-02 に2本目で答え合わせ済み＝実例/AI時代に消える仕事残る仕事_冒頭/答え合わせ.md）
source: みかみさんCH0726_最終.prproj / AI使いこなす習慣7選（P11・P16 は2本目の完成版も。2本目＝AI時代に消える仕事残る仕事／冒頭）

# 通常字幕（装飾しない基本の字幕）。全字幕の約9割はこのまま。
base_subtitles:
  styles:
    - {speaker: メイン話者（みかみさん）, style: みかみテロップ, atlas: S19, type: T001}
    - {speaker: 聞き手, style: 質問者テロップ, atlas: S09, type: T003}
  rule: 話者の色は話者で決める。強調の種類で話者の色を変えない（字幕の決まりは 08 の captions）

# どの段に置くか（工程8。上司の方法セット 91_タイムラインの棚配置 ルール2 に、このチャンネルで V11 から上を足した）
output_tracks:
  rule: 新しく組み立てる時は、この段に置く。案件で変えた時は 00_案件メモ.md に書く。見本集や完成版の観測での段（observed）とは違うことがある
  V1: メイン映像（カメラ）
  V2: サブ映像（2カメ・画面録画）。画面共有の動画では、画面の録画を全部置いて映す所だけ有効にする（カメラ V1 も全部置く。07 の both_tracks）
  V3: 差し込み画像・図解の土台（ぼかし E016・黒い板 E020／E021。ぼかし＋黒い板の時は、ぼかし V3・黒い板 V4）
  V4: 画面に付く演出（矢印・赤枠・ぼかし）
  V5: 仮想カメラ（ズームの調整レイヤー。V1〜V4 にだけ効き、V6 から上のテロップ・タイトルは拡大されない）
  V6: 通常テロップ（話者はスタイルで区別）
  V7: 強調テロップ（P01〜P08、P16 のセリフ）
  V8: テーマ・タイトル（右上のシリーズ名・話題タイトル、章の番号見出し）
  V9: 補足テロップ（※注釈・用語）
  V10: ボード・CTA（P09 ポイントボード、P10 項目名カード、P14）
  V11: 画面共有の間のワイプ（07 の wipe）
  V12〜: 図解の部品（1つの部品に1本ずつ、出る順に下から。09）
  A1: 会話（話者にかかわらず）
  A2: 別収録のサブ音声
  A3: BGM
  A4: SE
  A5: SE（A4と重なるときだけ）
  why: 上司の91。V2 に画面をいつも置く・V11 をワイプ・V12 から図解の部品は 2026-09-28〜29 小川さん（V1〜V10 の決まりは崩さない）

# 右上のシリーズ名・話題タイトル
titles:
  rule: 右上に、1段目がシリーズ名（T002）、2段目が話題タイトル（T005）。右端をそろえる（文字の長さに合わせて横の位置をずらす）。大きさは見本の 70%
  switch: 今話している問い・テーマ（例「習慣って本当に必要？」「①タスクファースト」）。章や話題が変わる時だけ切り替える（章の入りは P10）
  switch_demo: 実演の動画では、話題が細かく変わるたびに替える（実演のお手本は30秒〜2分ごと）。問いの形の話題がよい（「AI初心者はどう学んでいくべきか」「Claudeとは何か？」）。実演の手順は、右上ではなく実演の札 T203 に番号を付けて出す（07 の demo_label。実演のお手本は右上の3段目に手順を出すが、見本集に3段の型が無い）。2026-10-02 実演のお手本2本（01 の手順3）
  not_shown:   # 出さない所（終わったらすぐ戻す）
    - 冒頭。動画のテーマ（例 NotebookLM）が初めて出る所から出す。最初の1回だけ 0.5秒のクロスディゾルブで出す
    - 画面共有の間（右上のワイプと重なる。左上の実演の札とも重ならない）
    - 寄り・引きのズームの間（ユーザー指示「画面が拡大・縮小される時は右上の2つを消す」）
    - 画像・図解を出している間（図解は 16場面すべてで消していた）
    - 章見出しの間（話題タイトルだけ）
  topic_length: 話題タイトルは11文字くらいまで（長いと話者の頭にかかる）
  series_name: 動画ごとに決める（依頼が「おまかせ」なら候補を出して選んでもらう）
  check: 工程10 で、最初に出る所（ディゾルブの途中と後）、寄り・引き・画像・図解の間に消えているか、70% の大きさかを画像で見る
  why: 2026-09-26 完成版の画像とユーザー指示（大きさは「大きすぎる」）。型一覧の旧表記「左上」は誤りで、完成版は右上

patterns:

  - id: P01
    name: 決め・断言
    spot: 言い切り・結論・宣言・「〜が1番」「絶対〜する」「これ！」。短く、声が強く、話の着地になる一言（「全然違う」「そいつらが金持ちになる」「絶対自動化する」）
    style: {name: 強調赤黄, atlas: S11, font: Ruika-09}
    type: T147     # 出方：落ちて2回弾む（0.37秒）
    se:
      default: SE_HYOSHIGI_KI      # 拍子木キッ：短い言い切り・行動の宣言
      choose_by_nuance:
        SE_TAIKO_DON: 重い結論。お金・リスク・人生の話、締めの呼びかけ（「ぜひ習得してください」）
        SE_TAIKO_DODON: 大きな宣言・テーマ提示・「これ！！！」「24時間労働」
        SE_TAIKO_KAKA: 勢い・ノリの良い一言（「簡単やん！」「適応しないと！！！」）
        SE_HYOSHIGI_KIKI: 二段の言い切り・未来の断言（「物事を理解する人間になんなきゃいけない」）
    zoom: {kind: 寄り, scale: "120〜145%", strongest_line: "150〜157%"}
    bgm: 継続

  - id: P02
    name: 成果・ポジティブ
    spot: 良い結果・できること・メリット・おすすめ・「完了」「OK」。聞いていて得をする一言（「AIは必ずわかってくれる」「マジで根本から変わる」）
    style: {name: ゴージャス金, atlas: S05, font: Ruika-09}
    type: T184     # 出方：横に膨らむ＋色のフラッシュ
    se:
      default: SE_KIRA_KIRAN       # キランッ：短いポジティブ・気づき・完了
      choose_by_nuance:
        SE_KIRA_PIRARIN: 大きな変化・おすすめ・「マジで根本から変わる」
        SE_KIRA_SHARAAN: 世界が変わる級の大きな話・冒頭タイトル
        SE_KIRA_KIRAA: 解決策の提示「〜するだけでOK」
        SE_KIRA_KIRA: 控えめな肯定（キランッより軽く）
        SE_TAIKO_DODON / SE_TAIKO_KAKA: 勢いのある成果（「万全の体制」「どんだけ順応するか」）
      one_video: 1本の中ではキラッ系の音を1〜2種にそろえる（P03 も同じ）。1本目はキランッ中心、2本目はシャラーン 7/10 でキランッは0回（2026-10-02 小川さん OK）
    zoom: {kind: 寄り, scale: "120〜145%"}
    bgm: 継続

  - id: P03
    name: 名言・格のある主張・肯定のリアクション
    spot: 格言・原理・「その通り!」「いい質問だね」のような相手を認める一言。重みを出したい一言（「その環境に最も適応したものだ」）
    style: {name: ゴージャス青, atlas: S12, font: NotoSerifJP-Black}
    type: T175     # 出方：横に膨らむ
    se:
      default: SE_KIRA_KIRAN
      choose_by_nuance:
        SE_KIRA_PIRARIN: 名言の余韻（「その環境に最も適応したものだ」）
        SE_KIRA_SHARAAN: 大きな結論（「そしたら世界が変わる」）
        SE_HYOSHIGI_KIKI: 勝負の格言（「そこに最初に飛びついたやつは勝つ」）
    zoom: {kind: 寄り, scale: "132〜137%（カメラ直接）/ 120%（調整レイヤー）"}
    bgm: 継続

  - id: P04
    name: 本音・皮肉・シュール・残念
    spot: 冷めた本音、皮肉、身もふたもない現実、残念な結末、低いテンションの断言、誰かの口まね（「AIに弾道計算させてるやつが多すぎる」「工場で働かされるだけ」）。皮肉の前振りもシュールにしてよい（「初心者はだいたいダメなのばっかり取り上げるから」）
    style: {name: シュールテロップ, atlas: S03, font: HiraMinProN-W6（明朝）}
    type: T010     # 出方：動きなし
    se:
      default: SE_SUZU_SHAN        # しゃん：皮肉・冷めた本音
      choose_by_nuance:
        SE_SUZU_SHAAN: 重めの本音・予言・場の空気を変える一言（「ガチですごいのが今後絶対に出る」）
        SE_PIANO: 冷静なツッコミ・気まずい間（「本当にここからだと思ってないよね」「お前いらなくね？」）
        SE_CHIIN: 残念な結末・終わってる（「これやってないやつは使いこなせてない」「工場で働かされるだけ」）
        SE_PIKON: 抜けている・うっかり（「つながってないだけ」「指示を忘れちゃう」）
      when_no_se: 口まねの連続（P16）は SE なし。同じネタが続く時は 01 の「1ネタ1発」
    set: 既定は「引き（カメラ直接 75〜80%）＋BGM停止＋SE（しゃん・チーン・ポカン・グキッなど）」の3つをセットで付ける。外すのは、冷めた一言が続く時の着地以外の1枚（01 の「1ネタ1発」）と口まねの連続（P16）だけ
    zoom: {kind: 引き, scale: "75〜80%（カメラ直接。調整レイヤーの E002 は使わない＝04 の zoom.use）", observed: "70%（調整レイヤー）/ 71〜85%（カメラ直接）", note: 下に何も敷かず黒フチのまま}
    bgm: 停止（既定。シュールの一言はオチとして止める。止め方は 04 の bgm.stop）
    why_set: "2本目は21件中18件がセット（引き18・BGM停止18・SE は全件：チーン6・しゃん5・ポカン4・グキッ3）。1本目は45件中 BGM停止29・SEなし25。2026-10-02 小川さん「セットを既定にする」"

  - id: P05
    name: 笑い・呆れ・軽い驚き
    spot: 「w」が付くような笑い、呆れ、ボケ、繰り返しのギャグ（「慣れ慣れ慣れ慣れ」）、軽いツッコミ（「これは結構ガチャｗ」「全部じゃんw」）
    style: {name: ヒラギノ白シャドウ, atlas: S13, font: HiraKakuStdN-W8}
    type: T020     # 出方：動きなし
    se:
      default: SE_POKAN            # ポカン：呆れ・笑い
      choose_by_nuance:
        SE_SUZU_SHAN: 冷めた笑い（「全部じゃんw」「どう足掻いても無理」）
    zoom: {kind: "寄り または 引き", scale: "寄り120%／引き75〜80%（カメラ直接）"}
    bgm: 呆れ・冷めた笑いのオチなら停止の候補（04 の bgm.stop）
    also: 同じスタイルを※の注釈にも使う（→ P13。SE は決定音）。AI への声の頼み（旧「※音声入力中」）は P17

  - id: P06
    name: 強いツッコミ・ダメ出し
    spot: 否定・ダメ出し・「〜ないですか？」の鋭い指摘・「罪」「バカか」「いやー！」（「なんもわかっとらんやん」）
    style: {name: ツッコミ, atlas: S07, font: ReggaeOne-Regular}
    type: T086     # 出方：定位置で揺れる
    se:
      default: SE_DOSU             # ドスッ：否定・ダメ・鋭い指摘
      choose_by_nuance:
        SE_GUKI: 痛いところを突く・罪・「なんもわかっとらんやん」「いやー！」
    zoom: {kind: "寄り120% が基本。強く否定する一言だけ強い寄り 150%", note: "観測：1本目 7件＝強い寄り4・寄り139% 2・なし1、2本目 8件＝寄り120% 6・強い寄り（150・160%）2。2026-10-02 小川さん OK"}
    bgm: オチになっている時だけ停止の候補（04 の bgm.stop）
    partial: 文の一語だけツッコミにする部分強調もある（「これやってないと ダメ」の「ダメ」だけ ReggaeOne → ドスッ）

  - id: P07
    name: 短い反応・素朴な一言
    spot: 1〜数語の反応。困惑（「くろーどこーど…？」）、聞き手の本音（「視聴者ついていけてないです…」）、軽い同意。編集者のツッコミ（話していない一言）もこれ
    style: {name: 白テキ, atlas: S06, font: Ruika-09}
    type: T023     # 出方：動きなし
    se:
      default: 反応の感情で選ぶ
      choose_by_nuance:
        SE_POKAN: 困惑・ぽかん
        SE_SUZU_SHAAN: 場を止める一言
        SE_DOSU: ツッコミ気味
        SE_PIKON: 抜けた一言
    zoom: {kind: "強い寄り（驚き・困惑）またはなし", scale: "171〜266%"}
    bgm: 困惑・間のオチなら停止の候補（04 の bgm.stop）

  - id: P08
    name: 要点の一文（赤）
    spot: 覚えてほしい原則・判断基準。ボードにするほどではないが、字幕の位置で目立たせたい一文（「これは絶対に習慣にすべき」「パソコンは閉じちゃダメ」）
    style: {name: 基本テロップ赤, atlas: S04, font: WanpakuRuika-08}
    type: T153     # 出方：右からスライド＋ブレ
    se:
      default: SE_PIPI             # ピピ（-9.8dB）：軽い注意
      choose_by_nuance:
        SE_CURSOR: 列挙の1項目として出すとき
        SE_KETTEI: 実演・仕組みの決め（「構造だけ覚えとけば変にはならん」）
    zoom: {kind: なし}
    bgm: 継続

  - id: P09
    name: ポイントボード（まとめ）
    spot: 話者が要点を言い切った直後に、その要約を「ポイント」ボードで出す（「ポイント / AIが頭が良いからといって使い方次第では逆に非効率になる」）
    style: {name: "テキストスタイル（S21）＋ポイント枠", atlas: S21}
    type: T028     # 出方：右からスライド
    se:
      default: SE_KIIN             # キーン（-5.6dB）。1ボードに SE は1回
      alt: SE_PIPI（-7.0dB。小さめのボード・補足的なまとめ）
    zoom: {kind: なし}
    bgm: 継続
    captions: ボードを出している間は通常字幕を外す（ボードの本文が話の要約になる）
    position: 帯の幅は文字に合わせて変わるので、横の中央にそろえる

  - id: P10
    name: 章の入り（習慣①〜⑦など）
    spot: 「習慣の1つ目なんだけど」のように、番号付きの新しい項目に入る瞬間
    type: T015＋T093   # 番号見出し＋項目名カード
    sequence:
      - step: 番号を言った瞬間
        telop: 番号見出し（例「AIを使いこなす習慣① / 7つの習慣」, PA1GothicStd-Bold）
        se: SE_PIPI（-9.8dB）
        zoom: 寄り120%（調整レイヤー）をこの章の導入の間（約4〜10秒）
      - step: 項目名を言った瞬間（約1.5秒後）
        telop: 項目名カード（対談用_質問者テロップ S14、HiraKakuStdN-W8。例「タスクファーストを習慣にする」）
        se: SE_KIIN（-5.6dB）
      - step: 同時に
        telop: 右上の話題タイトル（V8）を新しい章名に切り替える（例「①タスクファースト」）
    captions: 章見出しの白い帯を出している間は通常字幕を外す（帯が字幕の位置を覆う）。帯は字幕の区切りまで（4秒以上）
    why: 完成版の7章すべてこの形

  - id: P11
    name: 並べる座布団（列挙・並列・対比）と、聞き手の問い（背景つきの札）
    spot: |
      同じ階層のもの（2〜5個）を順に挙げる所（問いの形の言葉を並べる所も）、2つを対比する所。
      （「AIがAmazonの配達してくれる」「AIが椅子を作ってくれる」／「頑張ってるつもり」と「正しく頑張る」／「今どんな状況なのか」「あなたはどういう状況なのか」）
      加えて、聞き手が話を正しい方向へ誘導する「問い」1つ（下の kinds.問い）
    kinds:
      並列:
        what: 同じ階層のもの（2〜5個）を順に挙げる所。問いの形の言葉を項目として並べる所もこれ（問いそのものではなく、文の一部として並べている。「今どんな状況なのか／あなたはどういう状況なのか／何をしていったらいいのか」＋「によって変わる」）
        color: 青背景（全部同じ色）
        types: [T030, T031, T172, T173, T174]
        example: "①ヒアリングスキル ②比較検討スキル ③フィードバックスキル"
        not_this: 聞き手の「問い」（下）とは別物。どちらかは前後の文脈（その後に文が続くか）で分ける
        why: 問いの形の並列は、2本目の完成版では白（T200）だったが、2026-09-29 小川さん「これと並列の概念」「青でいいかな」で並列にまとめて青（白の「問いかけ」という区分は無くした）
      対比: {color: "前者＝青背景、後者＝赤背景（悪い↔良い、つもり↔正しく、守り↔攻め、古い↔新しい）", types: [T030, T199]}
      問い:
        what: |
          聞き手が、話を正しい方向へ誘導する（コントロールする）ために投げる問い（1つ）。話が横にそれかけた時や大事な説明の前に、視聴者が知りたいことを代わりに聞いて本題へ戻すもの
          （「これ見る人は初心者も多いと思うんですけど、モデルの違いを説明してもらえますか」→「Q:初心者も多いので ChatGPTのモデルの違いを／説明してもらえますか？」、「Q:そもそもスキルって何ですか？」）。答えで話が次へ進み、右上の話題が変わることが多い
        color: 青背景・白文字（1枚）
        types: [T030]      # 左からシュッと滑り込む（0.5秒）
        text: |
          要約しない。聞き手が言った問いから、フィラー・言い直しだけを削り、条件（〜なら・〜したら）と主語を残した1文にする。前の話を受けている時は、その話を条件に入れる。
          先頭に「Q:」を付ける（2行の時は1行目の頭だけ）。続けて2〜3個問う時は、1つの問いにまとめる（条件と主語は残す。08 の captions.long_question）。
          例「Q:三上さんが使ってみて／Astraの何がすごいと思いますか？」（「Astraの何がすごい？」にしない）
        lines: |
          2行に収めて、札は1枚（2枚に分けない・時間で切り替えない・3行にしない）。
          1行が画面の90%を超える時は、軽い順に：①改行の位置を文節で変えて、長い方の行を短くする ②文字を基本の大きさの85%まで小さくする ③それでも入らない時は、2行のまま入るまで小さくする。②③をした所は報告の一覧で知らせる
        position: 左右の中央。高さは通常字幕と同じ（1行なら1行の字幕の高さ。2行なら、下の行が1行の字幕の高さ・上の行が2行の字幕の1行目の高さ）
        with: その問いの字幕の代わりに出す（札の間は同じ字幕を出さない）。問いの間だけ出し、問いが終わったら消す（答えの字幕の上には残さない）
        se: SE_PIPI（ワークの完全解説で小川さんが問いに付けていた音）
        pair_with: 答えが要点になる時だけ、答えの核（出口）を P09 のポイントボードで受けて「問い → 答え → ポイント」を見せる（全部の問いには付けない）
        not_this: 短い確認（「それCodex？」「マジで？」）・相づちは字幕のまま
        why: |
          2026-09-28 小川さん「話者が〜って何ですかって聞く時、それが話の展開を作っているので青の座布団で。青の座布団が今は並列にしか使われていない」「コントロールしようとしている。正しい方向に誘導している時にその質問を投げている」
          「青にしましょう」（2本目の完成版は白 T200＋ピピだったが、この案件からは青）「問いは問い。問いが終わったら消える」。pair_with は「決まりにしておいて。見本を見た上で最終決定」→ 完成版で確かめて決定（根拠の時刻は 実例/根拠と実例.md）。
          2〜3個続く問いを1つにまとめるのは 2026-09-29 小川さん。
          要約しない（条件と主語を残す）・高さは字幕と同じ（案A）は 2026-09-29 小川さん「質問を要約しないで」「こういう場合こうなんですかという質問になっているはず」。お手本1本目の問いも条件と主語を残した1文。
          2行でも1枚は 2026-10-01 小川さん「2つに分けず1つに」。先頭の Q:・2行に収める・はみ出す時の順番は 2026-10-02 小川さん「要約はしないが、Qはつけてほしい」「基本は一枚」「問は2行で収めて」（実演のお手本は「Q:」の札）。
          astra v006 の25か所に Q: を足すと7か所が画面の90%を超えるが、一番長いものでも93%に縮めれば入る
    text: 字幕そのままでなく短い名詞句に要約する。順番があるなら①②③を付ける
    layout: |
      並列：左寄せで縦に積む。1段の間隔は画面の高さの約13.5%（約145px。3つ並び T172〜T174 のモーションの位置 y＝-0.102・0.033・0.170、2つ並び T030・T031 のグループの位置 y＝0.355・0.489）。
      2つなら下の字幕のすぐ上から、3つ以上は左上から下へ積む。x は項目どうしでそろえる（T172〜T174 は 0.039）。
      対比：下の字幕の上に、左に青（前者）・右に赤（後者）を横に並べる（2本目）。
      大きさは見本のまま（06 の by_style の対象外）。長い項目で画面の90%を超える時だけ縮める。
      前の項目は消さずに残し、新しい項目は1つ上のトラックに置く
    timing: |
      各項目は、その項目を言い始めたフレームで出す（項目の間隔の中央値 1.6秒）。
      全部を同じフレームで一斉に消す（21例中20例）。消すのは締めの一言が終わる所か、話が次に移る所（1つ目から中央値 4.1秒、3.2〜19秒）
      消える時の動きは P13 の image_exit（0.5秒のクロスディゾルブ。並べる間の寄りと一緒に出て一緒に消える時は付けない）。問いの札も同じ
    motion: 左から滑り込む 0.5秒（05 の SLIDE_LEFT。T030・T031）か、動きなし（T172〜T174）。赤 T199 は見本の動きのまま
    se:
      default: SE_CURSOR           # 項目ごとに同じ音を繰り返してよい（2本目はピピ）
      alt: SE_PIPI（図の段階表示「成果→ボトルネック→タスク」を1段ずつ出すとき）
      finish: 最後に締めの一言を強調（強調赤黄・ツッコミ）で上に重ねる時は、その強調の音（「日常的なチェック」＝拍子木、「全然違う」＝ドスッ）
    zoom: {kind: 寄り, scale: "120%", rule: "並べる間（1つ目が出てから一斉に消えるまで）は、寄り120%（04 の調整レイヤー）を1本で通す。続けて並べない1枚だけの時（問いの札など）はかけない", why: "2本目は並べる場面の約11場面すべてで寄り120%（1場面だけ130%）を1本で通していた（例 09:33・08:45・11:57）。1本目の青背景は 15件中12件がなし。2026-10-02 小川さん OK"}
    with: 並べている間も通常字幕は下に出す（問いは除く）。右上のタイトルは出したまま（完成版）。画面共有の間も青の座布団で出す（2026-09-26 ユーザー指示）
    not_this: イラストと組み合わせた対比（「つもり↔正しく」に人物の絵とツッコミを重ねるもの）や、見出し＋番号つきの青は図解（09）
    why: 2026-09-26 ユーザー確認。完成版4例・2本目17例（~/Movies/video_edit_cases/gamen_kyoyu_20260926/analysis/ルール調査/。tools/plates_roleplay.py）

  - id: P12
    name: 画面操作・実演
    spot: 「設定を開く」「オンにして」「追加ってやったら」など、画面を操作している瞬間
    se:
      SE_CURSOR: 画面上の項目を開く・選ぶ
      SE_CLICK: クリック操作、画像を連続でポン出しするとき（小さめ -8.8dB）
      SE_KETTEI: 実演の開始・決定・送信
    zoom: 画面録画側でキーフレームのズーム（操作位置へ寄る）を使うことがある。顔カメラの強調ズームとは別物（画面の拡大は 07 の zoom）

  - id: P13
    name: 画像・ロゴ・注釈の挿入
    rule: |
      画像は真ん中にドンと置く。白い縁と影を付け、横幅は画面の6割ほど。字幕は隠さない。出している間は右上のタイトルを出さない。
      使い分け：話の途中で「これ」とちらっと見せるなら P13、画像について数秒以上説明する（下に説明の札を付ける）なら 09 の型1（ぼかしを敷く）
    net_images: ネットから画像を持ってくる時は、置く前にファイル名・出どころ・大きさを伝えて許可をもらい、見せる（著作物かどうかも伝える）。よく出る公式のロゴは 素材/ロゴ/ のものを使う（許可は要らない。出どころは 素材/ロゴ/出どころ.md）
    generated: |
      合う写真が無い時は、絵を作ってよい：AI がコードで描く（SVG・HTML）か、画像生成のサービスで作る。名札に「（イメージ）」と付け、報告の画像の表に「作った絵」と書く。
      有料のサービスは使わない。ChatGPT が要る時は、小川さんのアカウントを連携してもらって使う（AI が自分でアカウントを作ったり課金したりしない）
    why_generated: 2026-10-04 小川さん「必要であればAIとかで生成してやってみるといい」、2026-10-05「画像生成のサービス使っていいんですよ。GPTとか外のものを使ってきていい」「有料のサービスは使わないでください。ChatGPTが必要であれば、僕のアカウントなので連携させられます」
    facts: 話の中の情報が正確か怪しい所（料金・プラン・数字）は、公式の情報で確かめて図解にする。出典と確認日を入れ、会話の誤りは注釈で直す（例 画面解説 v005 のプランの図解）。事実が確かめられない時は止まって聞く
    se:
      SE_PIPI: 画像・ロゴを出す（-9.8dB）
      SE_CLICK: 画像を連続で出す（1枚ごと）
      SE_KETTEI: ※の注釈（AI への声の頼みの「※AI指示中」は P17 で、効果音なし）
      SE_POKAN / SE_PIKON: 笑いを誘う画像（「くろーどこーど…？」の画像など）
    note_exit: ※の注釈（用語の説明・事実の補足）は、消える時に 0.5秒（15コマ）のクロスディゾルブ。出る時はそのまま。make で tools/native_prproj.py の add_dissolve（at_end=True）を使う（QE の addTransition は使わない）
    image_exit: |
      画像（写真・ロゴの札・ロゴのカード。案件の zukai の I*・L* も）と座布団（P11 の並べる座布団・問いの札）は、消える時に必ず 0.5秒（15コマ）のクロスディゾルブで消す。出る時は今のまま（画像はポン、座布団は見本の動き）。
      例外：画像・座布団が画角の変化（寄り・引き・画面⇄カメラの切り替え）と同じコマで出て、その画角の変化が終わるコマで一緒に消える時は、ディゾルブを付けずにそのコマで切る（画角と一緒に戻す）。
      並べる座布団は、並べる間の寄り120%（P11 の zoom）と一緒に出て一緒に消えることが多く、その時はこの例外（ディゾルブなし）。寄りの無い並べる座布団・問いの札はディゾルブ。
      make で tools/native_prproj.py の add_dissolve（at_end=True）をクリップの終わりに付ける（※の注釈と同じ。QE の addTransition は使わない。一斉に消す座布団は全部のクリップに付ける）
    why: 2026-09-26 ユーザー指示。使い分けは 2026-09-29 小川さん。注釈のディゾルブは 2026-10-03 小川さん「消える時に全部ディゾルブで消えるように」。画像と座布団の消え方（image_exit）は 2026-10-04 小川さん「画像を出す時は必ずディゾルブで消すようにしてください。例外があって、画角変化と一緒に画像が出てて、画角変化の終わりと一緒に画像が消える場合はディゾルブはかけない」（環境設定 v004 の後。長さは指示が無いので ※の注釈と同じ 0.5秒）、続けて「座布団も一緒で、画像と一緒の消し方のルールにしてほしい」

  - id: P14
    name: CTA（概要欄・LINE・1on1の案内）
    type: T147＋T189
    sequence:
      - CTA枠が出る瞬間 → SE_KIIN
      - 誘導の言い切り（強調赤黄 T147）→ SE_KETTEI（決定音）
      - 受け取り方の説明ボード（T189「〇〇の受け取り方／「キーワード」と概要欄の公式LINEに送ってください」）→ SE_PIPI（-7.0dB）
    rule: CTA は打楽器（太鼓ドドン・カカッ）で盛らず、決定音・キーンで案内する。矢印（T021・T026）は元の概要欄の画像とセットの部品なので使わない。CTA はカットしない（08 の keep）
    why: 完成版で CTA 内の太鼓は編集者が無効化していた。矢印は 2026-09-26 ユーザー確認

  - id: P15
    name: 冒頭ハイライト（オープニングではない）
    rule: |
      冒頭はとても離脱される所なので、1秒目から本題の一番つかむ所で始める。タイトルを丁寧に見せる時間は作らない（小川さん「オープニングではなくハイライト」）。
      切り抜き動画のように、本人のセリフを細かくカットしてつなぎ（言いよどみ・間は切る。声の途中では切らない。08 の no_chop）、激しい文字グラフィックを乗せる。
      セリフは、並べると1つの主張・引きになるように選んで並べる（お手本2本目「この考え方を持てさえすれば…あなたは生き残る／なくなるのは守りの仕事…ぼーっとしてる人が一番危ない」）。
      問い・驚きの一言（「え？」と思わせる所）で止め、その答え・理由・中身は見せない（ネタバレしない）。強い一言だけで引きになるなら、説明の続きは付けない。
      文字はセリフの書き起こしのしすぎにしない。引きを作る短い要約とつなぎの言葉で、前後がつながる1本の流れにする（実演のお手本「Claudeの性能を1段上げる!?」→「2週間に1回30分だけ喋る」→「200万円を貰う」→「多くの仕事がAIで代替される」→「覚醒Claude」、「人がやったら1〜2日掛かる」→「30分で経理作業終わり」→「このスピードで 企業の業務を自動化」→「エグい格差が広がる」）
    sequence:
      - "0:00〜約10〜20秒 ハイライト（お手本 13.7秒・14.3秒、実演のお手本 約9〜11秒）：ダイジェスト用BGM"
      - "切り替え（お手本は指鳴らし、astra v007 はホワイトアウト）→ タイトルコール（2.6〜3.3秒。例「年商25億AI社長の Astra天才的活用法5選」）"
      - "名前と肩書き（実演のお手本は札「三上 功太／アドネス株式会社 社長…」。見本集に型が無いので、今は会社ロゴ画像）→ ホワイトアウト（お手本は0.8秒前後）→ 挨拶：ここからメインBGM。挨拶（名前・会社名）は段取りではないので切らず、言ったとおり字幕にする（文字起こしのヒントに同じ言葉を入れると空耳と区別できないので、ヒント無しで起こして確かめる）"
      - "本題の前に、誰に向けた動画か（実演のお手本「今までの視聴者がついてこれない」「そういう方にも向けたい」）か、「〇〇とは」の板（01 の手順3）"
    when: 毎回作る（動画の土台.md の5）。ただし、依頼で冒頭のハイライトは要らないと言われた案件では作らない（上司の10「ダイジェストは依頼条件。不要と言われた案件では冒頭への抜粋・未来の結論先出しを生成しない」。2026-10-02 小川さん）
    example: astra v007（edit/v007/hl/。作り方は その案件の 00_案件メモ.md の「v007 冒頭ハイライトの作り方」）
    note: 【確認待ち】長さと、タイトルコールの前の切り替え（指鳴らしかホワイトアウトか）は、astra v007 を見てもらってから決める。導入（〜7分台）は本編よりズーム・装飾が多い（01 の手順7）
    why: |
      2026-09-30〜10-01 小川さん「PV っぽく。その先を見たくなる形に」「オープニングではなくハイライト」「切り抜きに激しい文字グラフィック」「20秒ぐらい、ホワイトアウト→タイトルコール→ホワイトアウト」「文字起こししすぎ。引きを作るように要約、前後が繋がる形に」。
      答えを見せないのは 2026-10-04 小川さん（環境設定 v002 の冒頭への Loom の指示）「ハイライトの中でネタバレしちゃってる。え?っていう興味付けだから ここの答えまでは見せない方がいい」（「ただのメモ」「腐るのよ」「環境構築だけ」を外した）。
      挨拶を切らないのは、dots v005・環境設定 v002 で本編の頭の挨拶「どうも アドネス株式会社の三上です」を落とした・空耳と取り違えた直し（2026-10-04・10-05 小川さん OK）。
      お手本2本と実演のお手本2本の冒頭（実例/根拠と実例.md）

  - id: P16
    name: 代弁（誰かになりきって言う）
    spot: |
      話者が自分以外の誰か（視聴者・部下・上司・AI・世の中の人）のセリフや心の声を、その人になりきって言う所。
      目印：「〜ってなる」「〜って言う」「〜って思う」の中身、口調や声色が変わる、会話を1人で演じる
    kinds:
      アホなふり:
        spot: わざと分かっていない人・大げさな人を演じて笑いにする（「お前もう職人とかせんでええけん」「え？これめちゃくちゃすごくない？」「あれ今私は何をやってたの」）
        type: T009＋E003（相手役は E004）
        screen: 調整レイヤーに黒帯（E003：クロップ 上12%・下14%）を、なりきっている間ずっと（中央値 3.4秒、0.4〜16秒）
        flip: 会話の相手役に切り替わる所は、左右反転つきの黒帯（E004）に替えて役ごとに交互にする
        telop: なりきったセリフは通常字幕を外し、白い明朝（シュール T009）を下の黒帯の中に収めて1セリフ1枚（大きさは 06 の「シュールテロップ/P16」の114。組み立てでは pattern="P16"）。途中で切れたセリフでよい
      常識を引っ張る:
        spot: 世の中の人・よくいる人が言いそうなセリフを代わりに言って、みんなの常識を引き出す（「田舎の方でAIで資料作れますよ」「先輩どうすればいいっすか」）
        type: T200＋T202
        screen: 黒帯は使わない
        telop: 白背景のセリフの札（T200）を並べる（並べ方は P11 の並列の layout・timing と同じ。色だけ白）。誰の役かを出す時は、左下に役名ラベル（T202「経理担当」など）
        illustration: 役の絵を添える。素材/イラスト/イラスト一覧.yaml から「役×気持ち」で選ぶ（無ければ許可をもらって足す）。テロップに埋め込まず、静止画として Premiere で置く
    se: 場面の中では鳴らさない（オチの一言だけ SE_SUZU_SHAN など）
    bgm: 流したまま（完成版は長い場面で止めていたが採用しない）
    zoom: アホなふり（黒帯）はかけない。常識を引っ張る（白い札を並べる）は P11 と同じく、並べる間は寄り120%を1本で通す（2本目 11:35・16:48 など。2026-10-02 小川さん OK）
    motion: 黒帯・左右反転・白い明朝は動きなし。常識を引っ張るの札・役名は見本の動きのまま（05）
    why: 2026-09-26 ユーザー確認（BGM は「2本目に合わせる」）。完成版8場面・2本目11場面（例の時刻は 実例/根拠と実例.md）

  - id: P17
    name: AI への指示（声で頼む・読み上げながら打ち込む）
    spot: |
      話す人が AI（Claude アプリ・Claude Code など）に声で頼んでいる間と、打ち込みながら読み上げている間。
      目印：画面に音声入力の窓（Aqua Voice など）が出る・入力欄や送った吹き出しに話した言葉が出る、言葉が AI への頼み（「〜作って」「追加でよろしく」）、ノートPCの方を向いて話している。
      実演の札（07 の demo_label）に「頼む・指示」とある所とも突き合わせ、P17 にしない時は理由を書く
    telop: その間の話す人の字幕は、白い座布団に黒い文字（T200）。大きさは 06 の auto、文字の中心は通常の字幕と同じ高さ。聞き手の字幕はふつうのまま
    note: |
      左下（※の注釈と同じ位置。左端 60px）に「※AI指示中」（T132 の書式）を、区間の間ずっと、ゆっくり出たり消えたりさせる（1.8秒出して 0.2秒空ける。出る時・消える時に 0.6秒のクロスディゾルブ）。
      区間の最後に 1.2秒（ディゾルブ2つ分）より短く残る点灯は置かず、1つ前の消えるディゾルブで終える
    span: 頼みの最初の言葉から最後の言葉まで（見る人に向き直った所で終える）。動く図解の間は付けない
    se: 付けない
    cut: 頼みは段取りではなく実演の中身なので残す（08 の remove「撮影・構成の段取りの会話」の例外）。ただし頼みの言いかけ・締めの言葉だけを字幕に残さない（残すなら頼みごと残す）
    replaces: これまでの「※音声入力中」（P05 のスタイル＋決定音。完成版 T132・T157）は使わず、この形にそろえる
    example: 環境設定 v004 の5区間（4:10.7〜・6:30.4〜・6:44.9〜・17:24.4〜・31:08.3〜）。作り方は tools へ写した案件の make（G5）
    why: |
      2026-10-04 小川さん（環境設定 v003 を見て）「AIに三上さんが指示している瞬間っていうのを結構明確に装飾を分けたくて…米印でAI指示中っていうので…点滅するようなものを注釈で入れつつ、テロップはなんか白ベースの座布団に黒い文字」「指示の間ずっと点滅してる方がいい。効果音はいらない」「点滅が激しすぎる。じわじわってディゾルブで消える・現れるぐらい。すごくゆっくりで大丈夫」。
      2026-10-05 小川さん「AIに話しかけてる時の見た目は今回ので継続。ずっとあれになるような形に」。数字（1.8秒・0.2秒・0.6秒）と最後の短い点灯を置かないことは v004 で AI が決めた形。
      頼みの締めの言葉だけを残さないのは、v004 の 9:48 で小川さんが「ちょっとこれもね もうちょっとアップデートしてもらって」を切った直し（2026-10-05 OK）

  - id: P18
    name: 言葉なしの表現（顔・手で演じる）
    spot: 話の途中で声を出さずに、顔（顔まね・表情のボケ）や手（身振りで形・動きを見せる）で何かを表現している所。残すかどうかは 08 の pauses.keep_face
    zoom: 顔で表現している時は顔に強く寄る（環境設定 v004 は 151%。位置は顔が真ん中に来る所を絵で見て合わせる）。手で表現している時は、手と顔が入る所まで寄る
    telop: その間は字幕・右上タイトルを外す（字幕は表現の前の言葉で終える）。表現の後の言葉からは元どおり
    se: 頭に SE_POKAN（ボケ・呆れ）。意味で選ぶ時は P05・P07 の choose_by_nuance
    bgm: 表現の間だけ止める（04 の bgm.stop）
    why: |
      2026-10-04 小川さんが Premiere で直した形（環境設定 v004 の 16:36「多分Obsidianの開発者は」の後の無言の顔まね 56コマに、寄り151%・字幕と右上タイトルなし・BGM なし・ポカン）。
      2026-10-05 小川さん「顔アップだからそうですね」「顔で何かを表現している時とか、手で表現しているみたいな時もある」で、手も同じ考えに

