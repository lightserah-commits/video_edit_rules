# 演出パターン表（装飾ルールの本体）
#
# 発話の「性質」から、テロップの保存スタイル・SE・ズーム・BGMを1セットで決めるための表。
# 根拠: みかみさんCH0726_最終.prproj 本編「AI使いこなす習慣7選」(33分) の有効クリップ。
#       observed の数字はこの1本の実配置から数えた事実。rule はそれを一般化した暫定ルール。
# 使い方: 01_判断フロー.md の手順で、1つの字幕ごとに patterns の id を1つ選ぶ（または NONE）。
# スタイル名・ID は ~/Desktop/担当2/03_編集ルール定義/演出図鑑 の S01〜S21 と同じ。SE の id は 03_SEカタログ.yaml を参照。
# 時刻（例の mm:ss.ff）はシーケンス上の位置。実例/みかみCH0726/events.csv に全件ある。
# 各パターンの「実物」（見た目＋アニメーションの完全な見本）は 見本/型一覧.md の系統ごとの型ID（T###）。
# 新しい動画では tools/reproduce.py で型IDを指定して複製する（見本/README.md）。

version: 0.1
status: 暫定（1本分の観測から作成。2本目以降で検証して更新する）
source: みかみさんCH0726_最終.prproj / AI使いこなす習慣7選

# 通常字幕（装飾しない基本の字幕）。全字幕の約9割はこのまま。
base_subtitles:
  styles:
    - {speaker: メイン話者（みかみさん）, style: みかみテロップ, atlas: S19, observed_track: V8}
    - {speaker: 聞き手, style: 質問者テロップ, atlas: S09, observed_track: V9}
  note: 話者の色は話者で決める。強調の種類で話者の色を変えない。

# 出力するときのトラック（上司の方法セット 91_タイムラインの棚配置 ルール2 に従う）
# このファイルの observed_track や例の V番号は、参考プロジェクトでの実際の置き場所（観測値）。新しく作るXMLでは下の棚に置く。
output_tracks:
  V1: メイン映像
  V2: サブ映像（2カメ・画面録画）。画面共有の動画では、カメラ（V1）と画面（V2）を両方いつも置き、使わない方を無効にする（07 の tracks.both。顔のワイプは画面より上の段）
  V3: 差し込み画像・図解
  V4: 画面に付く演出（矢印・枠・モザイク）
  V5: 仮想カメラ（ズーム用の調整レイヤー。V1〜V4にだけ効く）
  V6: 通常テロップ（話者はスタイルで区別）
  V7: 強調テロップ（P01〜P08、P16 のセリフ）
  V8: テーマ・タイトル（右上のシリーズ名・話題タイトル、章の番号見出し）
  V9: 補足テロップ（※注釈・用語）
  V10: ボード・CTA（P09 ポイントボード、P10 項目名カード、P14）
  A1: 会話（話者にかかわらず）
  A2: 別収録のサブ音声
  A3: BGM
  A4: SE
  A5: SE（A4と重なるときだけ）

# 強調には2種類ある。どちらも正当な理由。
emphasis_kinds:
  意味の強調:
    what: 内容の核（結論・断言・原則・成果・名言）を残すための強調
    patterns: [P01, P02, P03, P08]
    observed_share: 装飾テロップ（強調系）125件中53件（42%）
  感情の強調:
    what: 話の温度を変えて飽きさせないための強調（ツッコミ・皮肉・本音・呆れ・笑い・驚き・褒め・短い反応）
    patterns: [P04, P05, P06, P07]
    observed_share: 125件中72件（58%）
    note: 「大事な内容ではないが、感情が動いた一言」は強調してよい（中身で数えると強調の約3分の1。2026-09-27 に数え直した）。
  note_2026_09_27: >-
    意味／感情はパターンIDではなく中身で決める（お手本2本の強調191件は意味126・感情65。
    ゴージャス青は褒め・肯定の感情にも、シュールは冷めた言い方の意味にも使う）。
    上の patterns はよく使う組み合わせの目安。型は温度で選び、文言は種類で作る（01 の「強調テロップの文言」）

# 右上のシリーズ名・話題タイトル（2026-09-26 完成版の画像とユーザー指示から）
titles:
  where: 右上。1段目がシリーズ名（T002）、2段目が話題タイトル（T005）。右端をそろえる（文字の長さに合わせて横の位置をずらす）
  size: 見本の 70%（ユーザー指示「大きすぎる」）
  not_shown:
    - 冒頭。動画のテーマ（例 NotebookLM）が初めて出る所から出す。最初の1回だけ 0.5秒のクロスディゾルブで出す
    - 画面共有の間（右上のワイプと重なる）
    - 寄り・引きのズームの間（ユーザー指示「画面が拡大・縮小される時は右上の2つを消す」）
    - 画像・図解を真ん中に出している間
    - 章見出しの間（話題タイトルだけ）
  topic_length: 話題タイトルは11文字くらいまで（長いと話者の頭にかかる）
  series_name: 動画ごとに決める（依頼が「おまかせ」なら候補を出して選んでもらう）

patterns:

  - id: P01
    name: 決め・断言
    kind: 意味の強調が多い（叫び・ノリの「これ！！！」「簡単やん！」は感情。種類は中身で決める）
    spot: 言い切り・結論・宣言・「〜が1番」「絶対〜する」「これ！」。短く、声が強く、話の着地になる一言。
    style: {name: 強調赤黄, atlas: S11, font: Ruika-09}
    se:
      default: SE_HYOSHIGI_KI      # 拍子木キッ：短い言い切り・行動の宣言
      choose_by_nuance:
        SE_TAIKO_DON: 重い結論。お金・リスク・人生の話、締めの呼びかけ（「ぜひ習得してください」）
        SE_TAIKO_DODON: 大きな宣言・テーマ提示・「これ！！！」「24時間労働」
        SE_TAIKO_KAKA: 勢い・ノリの良い一言（「簡単やん！」「適応しないと！！！」）
        SE_HYOSHIGI_KIKI: 二段の言い切り・未来の断言（「物事を理解する人間になんなきゃいけない」）
    zoom: {kind: 寄り, scale: "120〜145%", strongest_line: "150〜157%"}
    bgm: 継続
    observed: {件数: 24, SEあり: 23, ズーム: "寄り19・強い寄り5", BGM停止: 2}
    examples:
      - "00:47.01 全然違う → 拍子木キッ・寄り142%"
      - "05:55.45 そいつらが金持ちになる → 太鼓ドン・強い寄り150%"
      - "01:51.71 これ！！！ → 太鼓ドドン・強い寄り157%"
      - "02:21.78 簡単やん！ → 太鼓カカッ・寄り141%"
      - "17:39.76 絶対自動化する → 拍子木キッ・寄り120%"

  - id: P02
    name: 成果・ポジティブ
    kind: 意味の強調が多い（「タスク化完了」のような喜び・完了は感情。種類は中身で決める）
    spot: 良い結果・できること・メリット・おすすめ・「完了」「OK」。聞いていて得をする一言。
    style: {name: ゴージャス金, atlas: S05, font: Ruika-09}
    se:
      default: SE_KIRA_KIRAN       # キランッ：短いポジティブ・気づき・完了
      choose_by_nuance:
        SE_KIRA_PIRARIN: 大きな変化・おすすめ・「マジで根本から変わる」
        SE_KIRA_SHARAAN: 世界が変わる級の大きな話・冒頭タイトル
        SE_KIRA_KIRAA: 解決策の提示「〜するだけでOK」
        SE_KIRA_KIRA: 控えめな肯定（キランッより軽く）
        SE_TAIKO_DODON / SE_TAIKO_KAKA: 勢いのある成果（「万全の体制」「どんだけ順応するか」）
    zoom: {kind: 寄り, scale: "120〜145%"}
    bgm: 継続
    observed: {件数: 16, SEあり: 16, ズーム: "寄り13・強い寄り2・なし1", BGM停止: 0}
    examples:
      - "13:12.33 AIは必ずわかってくれる → キランッ・寄り120%"
      - "16:56.62 全部完全にやる → キランッ・寄り120%"
      - "29:32.97 マジで根本から変わる → ピラリーン・寄り140%"
      - "15:58.26 AIがアクセスできるようにするだけでOK → キラーー・寄り120%"

  - id: P03
    name: 名言・格のある主張・肯定のリアクション
    kind: 意味の強調も感情の強調もある（原則・名言は意味、「いい質問だね」「その通り!」は感情。お手本で意味12・感情6。種類は中身で決める）
    spot: 格言・原理・「その通り!」「いい質問だね」のような相手を認める一言。重みを出したい一言。
    style: {name: ゴージャス青, atlas: S12, font: NotoSerifJP-Black}
    se:
      default: SE_KIRA_KIRAN
      choose_by_nuance:
        SE_KIRA_PIRARIN: 名言の余韻（「その環境に最も適応したものだ」）
        SE_KIRA_SHARAAN: 大きな結論（「そしたら世界が変わる」）
        SE_HYOSHIGI_KIKI: 勝負の格言（「そこに最初に飛びついたやつは勝つ」）
    zoom: {kind: 寄り, scale: "132〜137%（カメラ直接）/ 120%（調整レイヤー）"}
    bgm: 継続
    observed: {件数: 13, SEあり: 13, ズーム: "寄り9・強い寄り1・なし3", BGM停止: 0}
    examples:
      - "22:04.99 その通り! → キランッ"
      - "28:01.95 いい質問だね → キランッ（ズームなし）"
      - "07:32.15 その環境に最も適応したものだ → ピラリーン・寄り133%"

  - id: P04
    name: 本音・皮肉・シュール・残念
    kind: 感情の強調も意味の強調もある（本音・皮肉は感情、「工場で働かされるだけ」のような冷めた言い方の結論は意味。お手本で感情23・意味20。種類は中身で決める）
    spot: 冷めた本音、皮肉、身もふたもない現実、残念な結末、低いテンションの断言、誰かの口まね。
    style: {name: シュールテロップ, atlas: S03, font: HiraMinProN-W6（明朝）}
    se:
      default: SE_SUZU_SHAN        # しゃん：皮肉・冷めた本音
      choose_by_nuance:
        SE_SUZU_SHAAN: 重めの本音・予言・場の空気を変える一言（「ガチですごいのが今後絶対に出る」）
        SE_PIANO: 冷静なツッコミ・気まずい間（「本当にここからだと思ってないよね」「お前いらなくね？」）
        SE_CHIIN: 残念な結末・終わってる（「これやってないやつは使いこなせてない」「工場で働かされるだけ」）
        SE_PIKON: 抜けている・うっかり（「つながってないだけ」「指示を忘れちゃう」）
      when_no_se: 同じネタが字幕数枚に続くときは、オチの1枚だけに鳴らす。口まねの連続（P16）はSEなし。
    zoom: {kind: 引き, scale: "70%（調整レイヤー）/ 71〜85%（カメラ直接）", note: 下に何も敷かず黒フチのまま}
    bgm: 停止（そのテロップの表示中だけ）
    observed: {件数: 45, SEあり: 20, ズーム: "引き18・なし22・寄り3・強い寄り2", BGM停止: "29（再現シーンの連続字幕を含む）"}
    examples:
      - "02:01.12 AIに弾道計算させてるやつが多すぎる → しゃん・引き74%・BGM停止"
      - "04:30.97 本当にここからだと思ってないよね → ピアノの単音・引き71%・BGM停止"
      - "00:28.76 これやってないやつは使いこなせてない → チーン・引き70%・BGM停止"
      - "13:17.96 明らかにコンテキストが悪い → しゃん・引き70%・BGM停止"

  - id: P05
    name: 笑い・呆れ・軽い驚き
    kind: 感情の強調が多い（「これが成り立つのは最初だけ」のような軽い言い方の要点は意味。種類は中身で決める）
    spot: 「w」が付くような笑い、呆れ、ボケ、繰り返しのギャグ（「慣れ慣れ慣れ慣れ」）、軽いツッコミ。
    style: {name: ヒラギノ白シャドウ, atlas: S13, font: HiraKakuStdN-W8}
    se:
      default: SE_POKAN            # ポカン：呆れ・笑い
      choose_by_nuance:
        SE_SUZU_SHAN: 冷めた笑い（「全部じゃんw」「どう足掻いても無理」）
    zoom: {kind: "寄り または 引き", scale: "寄り120%／引き70%"}
    bgm: 呆れ・冷めた笑いのときは停止
    observed: {件数: 13, SEあり: 12, ズーム: "寄り4・強い寄り1・引き3・なし5", BGM停止: 2}
    examples:
      - "18:39.38 これは結構ガチャｗ → ポカン・引き・BGM停止"
      - "15:48.15 慣れ慣れ慣れ慣れ → ポカン"
      - "14:36.34 全部じゃんw → しゃん・寄り"
    also: 同じスタイルを「※音声入力中」のような注釈にも使っている（→ P13。SEは決定音）。

  - id: P06
    name: 強いツッコミ・ダメ出し
    kind: 感情の強調が多い（種類は中身で決める）
    spot: 否定・ダメ出し・「〜ないですか？」の鋭い指摘・「罪」「バカか」「いやー！」。
    style: {name: ツッコミ, atlas: S07, font: ReggaeOne-Regular}
    se:
      default: SE_DOSU             # ドスッ：否定・ダメ・鋭い指摘
      choose_by_nuance:
        SE_GUKI: 痛いところを突く・罪・「なんもわかっとらんやん」「いやー！」
    zoom: {kind: 強い寄り, scale: "150〜171%（弱めなら139%）"}
    bgm: ときどき停止（オチになっているとき）
    observed: {件数: 7, SEあり: 7, ズーム: "強い寄り4・寄り2・なし1", BGM停止: 1}
    examples:
      - "07:02.66 バカかって言うもん → ドスッ・寄り139%"
      - "06:21.48 なんもわかっとらんやん → グキッ・寄り139%"
      - "10:15.35 自分で見つけれる人の方が珍しくないですか？（聞き手） → ドスッ"
    partial: 文の一語だけツッコミにする部分強調もある（00:28.39「これやってないと ダメ」の「ダメ」だけ ReggaeOne → ドスッ）。

  - id: P07
    name: 短い反応・素朴な一言
    kind: 感情の強調が多い（種類は中身で決める）
    spot: 1〜数語の反応。困惑（「くろーどこーど…？」）、聞き手の本音（「視聴者ついていけてないです…」）、軽い同意。
    style: {name: 白テキ, atlas: S06, font: Ruika-09}
    se:
      default: 反応の感情で選ぶ
      choose_by_nuance:
        SE_POKAN: 困惑・ぽかん
        SE_SUZU_SHAAN: 場を止める一言
        SE_DOSU: ツッコミ気味
        SE_PIKON: 抜けた一言
    zoom: {kind: "強い寄り（驚き・困惑）またはなし", scale: "171〜266%"}
    bgm: 困惑・間のときは停止
    observed: {件数: 7, SEあり: 5, ズーム: "強い寄り2・引き1・なし4", BGM停止: 3}
    examples:
      - "03:33.21 視聴者ついていけてないです… → シャーン・強い寄り266%・BGM停止"
      - "05:14.55 そうなっちゃうよ → ドスッ・強い寄り171%"

  - id: P08
    name: 要点の一文（赤）
    kind: 意味の強調
    spot: 覚えてほしい原則・判断基準。ボードにするほどではないが、字幕の位置で目立たせたい一文。
    style: {name: 基本テロップ赤, atlas: S04, font: WanpakuRuika-08}
    se:
      default: SE_PIPI             # ピピ（-9.8dB）：軽い注意
      choose_by_nuance:
        SE_CURSOR: 列挙の1項目として出すとき
        SE_KETTEI: 実演・仕組みの決め（「構造だけ覚えとけば変にはならん」）
    zoom: {kind: なし, note: 13件中10件はズームなし}
    bgm: 継続
    observed: {件数: 13, SEあり: 12, ズーム: "なし10・寄り3", BGM停止: 0}
    examples:
      - "02:40.16 1〜2年後に世界がガチでAIを使えるようになるのは → ピピ"
      - "08:27.51 これは絶対に習慣にすべき → cursor1"

  - id: P09
    name: ポイントボード（まとめ）
    kind: 構造
    spot: 話者が要点を言ったとき、その要約を「ポイント」ボードで出す。1ボードにSEは1回。
    style: {name: "テキストスタイル（S21）＋ポイント枠", atlas: S21}
    se:
      default: SE_KIIN             # キーン（-5.6dB）
      alt: SE_PIPI（-7.0dB。小さめのボード・補足的なまとめ）
    zoom: {kind: なし}
    bgm: 継続
    captions: ボードを出している間は通常字幕を外す（完成版と同じ。ボードの本文が話の要約になる）
    position: 帯の幅は文字に合わせて変わるので、横の中央にそろえる
    observed: {件数: "14（スタイル付き）＋スタイルなしのボード多数", SE: "キーン約20・ピピ約8"}
    examples:
      - "01:53.78 ポイント / AIが頭が良いからといって使い方次第では逆に非効率になる → キーン"
      - "11:06.40 ポイント / 特定の領域でコンテキストをたくさん貯める → キーン"

  - id: P10
    name: 章の入り（習慣①〜⑦など）
    kind: 構造
    spot: 「習慣の1つ目なんだけど」のように、番号付きの新しい項目に入る瞬間。
    sequence:
      - step: 番号を言った瞬間
        telop: 番号見出し（例「AIを使いこなす習慣① / 7つの習慣」, PA1GothicStd-Bold）
        se: SE_PIPI（-9.8dB）
        zoom: 寄り120%（調整レイヤー）をこの章の導入の間（約4〜10秒）
      - step: 項目名を言った瞬間（約1.5秒後）
        telop: 項目名カード（対談用_質問者テロップ S14、HiraKakuStdN-W8。例「タスクファーストを習慣にする」）
        se: SE_KIIN（-5.6dB）
      - step: 同時に
        telop: 右上の話題タイトル（出力ではV8。参考プロジェクトではV5）を新しい章名に切り替える（例「①タスクファースト」）
    observed: 7章すべてこの形（ピピ7回・キーン7回・寄り120%）
    captions: 章見出しの白い帯を出している間は通常字幕を外す（帯が字幕の位置を覆う）。帯は字幕の区切りまで（4秒以上）

  - id: P11
    name: 列挙・並列・対比・問いの座布団（背景つきのラベルを並べる。聞き手の問い1つも青で出す）
    kind: 構造
    # 2026-09-26 ユーザー確認。根拠：完成版4例・2本目17例（work/gamen_kyoyu_20260926/analysis/ルール調査/）
    spot: |
      同じ階層のもの（2〜5個）を順に挙げる所、2つを対比する所、問いかけを並べる所。
      （「AIがAmazonの配達してくれる」「AIが椅子を作ってくれる」／「頑張ってるつもり」と「正しく頑張る」／「今どんな状況なのか」「あなたはどういう状況なのか」）
    kinds:
      並列: {color: 青背景（全部同じ色）, types: [T030, T031, T172, T173, T174], example: "①ヒアリングスキル ②比較検討スキル ③フィードバックスキル"}
      対比: {color: "前者＝青背景、後者＝赤背景（悪い↔良い、つもり↔正しく、守り↔攻め、古い↔新しい）", types: [T030, T199]}
      問いかけ: {color: 白背景・黒文字, types: [T200], example: "今どんな状況なのか／あなたはどういう状況なのか／何をしていったらいいのか"}
      問い:   # 2026-09-28 ユーザー指示「話者が〜って何ですかって聞く時、それが話の展開を作っているので青の座布団で。青の座布団が今は並列にしか使われていない」
        what: |
          聞き手が、話を正しい方向へ誘導する（コントロールする）ために投げる問い（1つ）。2026-09-28 ユーザー「コントロールしようとしている。正しい方向に誘導している時にその質問を投げている」。
          話が横にそれかけた時や大事な説明の前に、視聴者が知りたいことを代わりに聞いて本題へ戻すもの
          （「これ見る人は初心者も多いと思うんですけど、モデルの違いを説明してもらえますか」→「ChatGPTのモデルの違いは？」、
          「そもそもスキルって何？」「ワークとCodexは何のために分かれてる？」）。答えで話が次へ進み、話題の見出し（右上）が変わることが多い
        pair_with: |
          P09 のポイントボード（2026-09-28 ユーザー「決まりにしておいて。見本を見た上で最終決定」→ 完成版で確かめて決定）：
          問い（入口）を座布団、答えの核（出口）をポイントで受けて「問い → 答え → ポイント」を見せる。答えが要点になる時だけ（全部の問いには付けない）。
          根拠：2本目 13:55「そもそもこれを経費計上してる状況がおかしくない?」→ 14:53 ポイント、09:37〜09:41 の問い3つ → 10:52 ポイント。1本目 16:56「AIと融合させていくんですか？」→ 17:01 ポイント
        color: 青背景・白文字（1枚）。2026-09-28 ユーザー決定「青にしましょう」（2本目の完成版は白背景 T200＋ピピだったが、この案件からは青）
        types: [T030]      # 左からシュッと滑り込む（0.5秒）。2026-09-28 ユーザー決定
        position: 普通の字幕の位置の真上に、すき間なくそのまま乗せる（札の下の端＝字幕の上の端。見本の T030 は少し浮いているので位置を直して置く）。2026-09-28 ユーザー指示
        text: 08 の captions「聞き手の長い質問」と同じく短い問いにする（「〜は？」「〜って何？」）
        with: その問いの字幕の代わりに出す（同じ言葉が札と字幕に2回並ばないよう、札の間は字幕を出さない。2026-09-28 ユーザー OK）。問いの間だけ出し、問いが終わったら消す（答えの字幕の上には残さない。2026-09-28 ユーザー「問いは問い。問いが終わったら消える」）
        se: SE_PIPI（ワークの完全解説で小川さんが問いに付けていた音）
        not_this: 短い確認（「それCodex？」「マジで？」）・相づちは字幕のまま
    text: 字幕そのままでなく短い名詞句に要約する。順番があるなら①②③を付ける
    layout: |
      並列・問いかけ：左寄せで縦に積む。1段の間隔は画面の高さの約13.5%（約145px。完成版の実測 0.134〜0.137）。
      2つなら下の字幕のすぐ上から、3つ以上は左上から下へ積む。
      対比：下の字幕の上に、左に青・右に赤を横に並べる。
      前の項目は消さずに残し、新しい項目は1つ上のトラックに置く
    timing: |
      各項目は、その項目を言い始めたフレームで出す（項目の間隔の中央値 1.6秒）。
      全部を同じフレームで一斉に消す（21例中20例）。消すのは締めの一言が終わる所か、話が次に移る所（1つ目から中央値 4.1秒、3.2〜19秒）
    motion: 左から滑り込む 0.5秒（05 の SLIDE_LEFT。T030・T031）か、動きなし（T172〜T174）
    se:
      default: SE_CURSOR           # 項目ごとに同じ音を繰り返す（2本目はピピ）
      alt: SE_PIPI（図の段階表示「成果→ボトルネック→タスク」を1段ずつ出すとき）
      finish: 最後に締めの一言を強調（強調赤黄・ツッコミ）で上に重ねる時は、その強調の音（「日常的なチェック」＝拍子木、「全然違う」＝ドスッ）
    zoom: {kind: なし}
    with: 並べている間も通常字幕は下に出す。右上のタイトルは出したまま（完成版）。画面共有の間も青の座布団で出す（2026-09-26 ユーザー指示）
    not_this: イラストと組み合わせた対比（「つもり↔正しく」に人物の絵とツッコミを重ねるもの）や、見出し＋番号つきの青は図解（09_図解.md）
    observed: {cursor1: 32回（青背景8・通常字幕16など）, 並べ方: 21例（完成版4・2本目17）}

  - id: P12
    name: 画面操作・実演
    kind: 構造
    spot: 「設定を開く」「オンにして」「追加ってやったら」など、画面を操作している瞬間。
    se:
      SE_CURSOR: 画面上の項目を開く・選ぶ
      SE_CLICK: クリック操作、画像を連続でポン出しするとき（小さめ -8.8dB）
      SE_KETTEI: 実演の開始・決定・送信
    zoom: 画面録画側でキーフレームのズーム（操作位置へ寄る）を使うことがある。顔カメラの強調ズームとは別物。

  - id: P13
    name: 画像・ロゴ・注釈の挿入
    kind: 構造
    how: |
      （2026-09-26 ユーザー指示）真ん中にドンと置く。白い縁と影を付け、横幅は画面の6割ほど。字幕は隠さない。出している間は右上のタイトルを出さない。
      ネットから画像を持ってくる時は、ファイル名・出どころ・大きさを伝えて許可をもらい、置く前に見せる（著作物かどうかも伝える）。
      話の中の情報が正確か怪しい所（料金・プラン・数字）は、公式の情報で確かめて図解にする。出典と確認日を入れ、会話の誤りは注釈で直す。
    se:
      SE_PIPI: 画像・ロゴを出す（-9.8dB）
      SE_CLICK: 画像を連続で出す（1枚ごと）
      SE_KETTEI: 「※音声入力中」などの注釈
      SE_POKAN / SE_PIKON: 笑いを誘う画像（「くろーどこーど…？」の画像など）

  - id: P14
    name: CTA（概要欄・LINE・1on1の案内）
    kind: 構造
    sequence:
      - CTA枠が出る瞬間 → SE_KIIN
      - 誘導の言い切り（強調赤黄）→ SE_KETTEI（決定音）
      - 受け取り方の説明ボード → SE_PIPI（-7.0dB）
    note: CTA内の太鼓（ドドン・カカッ）は一度置かれた後、編集者が無効化していた。CTAは打楽器で盛らず、決定音・キーンで案内する。
    types: 誘導の言い切り＝強調赤黄（T147）＋決定音、受け取り方＝T189 のボード（「〇〇の受け取り方／「キーワード」と概要欄の公式LINEに送ってください」）＋ピピ(-7.0dB)。矢印（T021・T026）は元の概要欄の画像とセットの部品なので使わない（2026-09-26 ユーザー確認）
    examples:
