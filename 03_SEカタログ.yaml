# SEカタログ（工程5・8。このチャンネルで固定で使うSE 26種と、SE の置き方）
#
# どのパターンにどの SE かは 02 の各パターンの se。ここは SE の置き方（rules）と、音ごとの中身（se）。
# file        … このフォルダの 素材/SE/ にあるファイル（元のファイル名のまま）。見本集では S001〜S027（見本/型一覧.md）
# atlas_id    … ~/Desktop/担当2/03_編集ルール定義/演出図鑑/音源 の番号（同じ音）
# gain_db     … 完成プロジェクトで設定されていたクリップゲイン。この値で置けば同じ音量感になる
# duration_s  … ファイルの長さ / lead_s … ファイル先頭の無音（ほぼ0なので、置いた位置＝鳴る位置）
# peak_dbtp   … ファイル自体のトゥルーピーク
# uses        … 完成動画（33分）で実際に鳴っていた回数（無効化クリップを除く）
# 重複ファイル: ピピ_001.mp3 = ピピ.mp3、キーン（ポイント）_001/_002.wav = キーン（ポイント）.wav（中身が同一）。1つにまとめた。

version: 0.2
status: 確定（音の中身と回数は1本目の完成版の観測。置き方はユーザー指示つき。2026-10-02 2本目で答え合わせ：19種の gain_db はすべて同じ値（例外はキーン_001 の 0dB が6回・ピロリロ中 0dB）、BGM を止めない系統も同じ（キーン 1/39 だけ例外）。実例/AI時代に消える仕事残る仕事_冒頭/答え合わせ.md）
source: みかみさんCH0726_最終.prproj / AI使いこなす習慣7選

rules:   # SE の置き方
  timing:
    rule: SE は、そのSEが担当するテロップの開始フレームに置く。テロップを動かしたら SE も一緒に動かす。強調をやめたら SE も消す
    how: テロップの開始＝その一言の発声開始（同期済みの字幕の開始フレーム）なので、結果的に語頭に合う。SE 素材の先頭の無音はほぼ0（ピロリロ中の0.11秒以外は最大0.05秒）なので補正しない
    check: tools/check_deco.py で SE の開始とテロップの開始が一致しているか（工程9）
    why: 完成動画ではほぼ全件、ずれ0フレーム
  overlap:
    rule: 同じ瞬間に2つの SE が重なる時は1つにする。強調・章・ボードの SE を優先し、画面の赤枠の小さい音は鳴らさない
    why: 2026-09-26 画面解説の案件で分かったこと
  read_frame_click:
    rule: 画面の赤枠（07 の read_frame）の音は、クリック（-8.83dB）をさらに 4dB 下げる
    why: 2026-09-26 ユーザー指示「うるさくないもの」
  volume: gain_db は完成版の「声のクリップに +17dB」を掛けた声に対する値。声の大きさが完成版と違う時は、SE も BGM と同じだけ動かす（決まりは 04 の bgm.balance）

families:
  打楽器（決め）: [SE_HYOSHIGI_KI, SE_HYOSHIGI_KIKI, SE_TAIKO_DON, SE_TAIKO_DODON, SE_TAIKO_KAKA]
  キラッ（ポジティブ）: [SE_KIRA_KIRAN, SE_KIRA_KIRA, SE_KIRA_PIRARIN, SE_KIRA_SHARAAN, SE_KIRA_KIRAA]
  シュール・本音: [SE_SUZU_SHAN, SE_SUZU_SHAAN, SE_PIANO, SE_CHIIN, SE_NAMIDA]
  間抜け・ツッコミ: [SE_POKAN, SE_PIKON, SE_DOSU, SE_GUKI]
  情報・構造: [SE_PIPI, SE_CURSOR, SE_CLICK, SE_KETTEI, SE_KIIN]
  オープニング用: [SE_PIRORIRO, SE_PACHIN]
# 上司の方法セット（60_SE・一言動画編集/config/se_nuance_dictionary.json）の「SEの意味名」11種と、このチャンネルの実際の音の対応。
# 上司版は意味名だけ決まっていて実音は未割当（unassigned_until_audition）だった。ここで完成動画の実配置から割り当てる。
intent_map:
  SE_INTENT_KEY_INSIGHT:    {name: 要点・理解,     se: [SE_KIIN, SE_PIPI], note: ポイントボード＝キーン、字幕の中の要点＝ピピ}
  SE_INTENT_BENEFIT:        {name: 成果・好意,     se: [SE_KIRA_KIRAN, SE_KIRA_PIRARIN, SE_KIRA_KIRA, SE_KIRA_KIRAA, SE_KIRA_SHARAAN]}
  SE_INTENT_CAUTION:        {name: 注意・引き締め, se: [SE_HYOSHIGI_KI], note: 観測は少ない。「〜しない」「絶対〜する」の引き締めに拍子木が使われていた}
  SE_INTENT_SURPRISE:       {name: 意外性・驚き,   se: [SE_SUZU_SHAAN, SE_TAIKO_DODON], note: 困惑・場が止まる驚き＝シャーン、良い意味の驚き・答えの提示＝ドドン}
  SE_INTENT_PLAYFUL_RETORT: {name: 軽いツッコミ,   se: [SE_POKAN, SE_PIKON, SE_DOSU, SE_GUKI, SE_PIANO], note: 呆れ＝ポカン、抜け＝ピコンッ、否定＝ドスッ、痛い指摘＝グキッ、冷静＝ピアノ}
  SE_INTENT_RELIEF:         {name: 安心・納得,     se: [SE_KIRA_KIRA], note: 観測なし。候補として控えめなキラ}
  SE_INTENT_ITEM_BEAT:      {name: 項目追加・進行, se: [SE_CURSOR, SE_PIPI, SE_CLICK], note: 列挙＝cursor1、段階表示＝ピピ、画像の連続＝クリック}
  SE_INTENT_CONTRAST:       {name: 対比・転換,     se: [], note: この動画では専用の音は使われていない。必要なら SE_NONE か要相談}
  SE_INTENT_SECTION:        {name: 話題導入,       se: [SE_PIPI, SE_KIIN], note: 章の番号見出し＝ピピ、項目名カード＝キーン（P10）}
  SE_INTENT_ACTION:         {name: 行動案内,       se: [SE_KETTEI, SE_KIIN], note: CTA枠＝キーン、誘導の言い切り＝決定音（P14）}
  SE_NONE:                  {name: 音を足さない,   se: [], note: 通常字幕の約9割}
  # 上司版の11種に無く、このチャンネルで多用されている意味
  決め・断言（このチャンネル独自）:   {se: [SE_HYOSHIGI_KI, SE_HYOSHIGI_KIKI, SE_TAIKO_DON, SE_TAIKO_DODON, SE_TAIKO_KAKA], note: P01}
  本音・皮肉・残念（このチャンネル独自）: {se: [SE_SUZU_SHAN, SE_SUZU_SHAAN, SE_PIANO, SE_CHIIN, SE_NAMIDA], note: P04。BGM停止とセット}

family_bgm_rule:   # BGM を止めるかの観測（止め方の決まりは 04 の bgm.stop）
  BGMを止めることがある: [シュール・本音, 間抜け・ツッコミ]   # 観測: 鈴8/15・間抜け4/10・ピアノ3/3・ツッコミ2/10・チーン1/2
  BGMを止めない: [打楽器（決め）, キラッ（ポジティブ）, 情報・構造]   # 観測: キラッ0/27・拍子木0/14・ピピ0/53・キーン0/33・cursor0/32（太鼓は「これ！！！」の1回だけ）

