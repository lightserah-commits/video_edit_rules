# ズーム・BGM・テンポの数値基準
# 根拠: みかみさんCH0726_最終.prproj / AI使いこなす習慣7選（33分）。数字は無効化クリップを除いた実配置。
# 「目安」はレビューのきっかけ。数字を満たすために演出を足すことはしない（01_判断フロー.md 手順6）。

version: 0.1

zoom:
  principle: ズームはテロップとセットの「画角の強調」。テロップが出ている間だけ固定倍率にして、終わったら元に戻す。動かすアニメーション（キーフレーム）は付けない。
  levels:
    寄り:
      scale: "120%（本編の標準）／130〜144%（導入や盛り上がり）"
      use_for: [P01 決め・断言, P02 成果, P03 名言, P10 章の入り, P05 笑いの一部]
      observed: "70回。120%が最多（41回）"
      duration: "テロップと同じ長さ（中央値2.3秒）。章の入りは4〜10秒"
    強い寄り:
      scale: "150〜171%（まれに183〜266%）"
      use_for: [P06 強いツッコミ, P07 驚き・困惑の反応, P01 の最大の山場]
      observed: "17回（150%が9回）"
      duration: "短く（中央値1.2秒）"
    引き:
      scale: "70%（調整レイヤー）／71〜85%（カメラ直接）"
      use_for: [P04 本音・皮肉・シュール, P05 呆れ]
      observed: "19回。縮小した周りは黒フチのまま（下に何も敷かない）"
      duration: "中央値1.9秒"
      note: 引きはBGM停止とセットになりやすい（冷めた間を作る）
  method:
    observed:
      - "主に導入（〜7:46）とラスト数分: 顔カメラのクリップをテロップの区間で切り、モーションのスケールを変更（約40回）"
      - "主に本編（7:46〜）: 調整レイヤー＋トランスフォーム（スケール120/130/150/70%、約67回）"
    recommended_for_automation: |
      Premiereで直接作るなら：調整レイヤー＋トランスフォーム（縦横比固定のスケール）を、テロップの開始〜終了の長さで置く。
      置く段は上司の棚配置どおり V5（仮想カメラ）。V1〜V4だけが拡大され、V6以上のテロップ・タイトルは拡大されない。
      （完成版では右上の話題タイトルが調整レイヤーより下の段にあり一緒に拡大されていた。ズーム中にタイトルを非表示にした箇所が約3割ある）
      2026-09-26 ユーザー指示：寄り・引きのズームの間は、右上のシリーズ名・話題タイトルを両方とも出さない（02 の titles）
    in_xml: |
      XML（Final Cut Pro 7形式）で作るときは、カメラのクリップ（V1/V2）をテロップの開始・終了で切り、
      その区間のクリップに Basic Motion のスケール（例 120）を入れる。これはPremiereに確実に読み込める。
      調整レイヤーがXML経由で再現できるかは未検証。Premiereで試して確認できたら、V5の調整レイヤー方式に切り替える。
    position: "基本は中央。顔が画面外に出る場合は、顔が中央に来るよう位置を調整（カメラ直接の例: 0.46, 0.59）"
  not_this: 画面録画の操作説明で使う「操作箇所へ寄るキーフレームのズーム」は別物（P12）。顔カメラの強調ズームに混ぜない。
  frequency: "3.2回/分（導入4.5回/分・本編2.6回/分）。間隔の中央値14秒"

bgm:
  balance:   # 2026-09-26 ユーザー指示「BGM が大きすぎる。元のプロジェクトとの音のバランスを見て調整」
    reference: "完成版は、声の素材 -40.0 LUFS に声クリップの +17.02dB を掛けて約 -23 LUFS。BGM は 0dB（素材 -42.1 LUFS）。声と BGM の差は約 19 LU"
    how: |
      新しい動画では、声の素材の大きさ（ffmpeg の ebur128 で測る）を測って、声と BGM の差が約 19 LU になるようにする。
      声を上げられる（ピークに余裕がある）なら完成版と同じく声を上げる。上げられないなら BGM を下げ、SE も同じだけ下げる（03）。
    example: "画面解説：声 -34.9 LUFS・ピーク +2.5dBFS → BGM -12dB・SE -12dB"
  tracks:
    main:
      file: 素材/BGM/0.【メインテーマ】audiostock_900412.mp3
      where: 挨拶（0:16）から最後まで、この1曲をループ（素材は3分17秒）
      gain_db: 0
      note: 素材自体が-42LUFSと小さく作ってあり、そのまま声の下で鳴る。ダッキング用のキーフレームは使っていない
    digest:
      file: 素材/BGM/ダイジェスト用BGM.mp3
      where: 冒頭ダイジェスト（0:00〜0:13.7）のみ
      gain_db: -3.0
      then: "指鳴らし→タイトルコールの約2.6秒はBGMなし → 挨拶と同時にメインBGM開始"
  stop_rule:
    when:
      - "P04 本音・皮肉・シュール、P05 呆れ・笑い、P06/P07 のうち「オチ」になっている一言"
      - "特大の決め（「これ！！！」）で1回だけ、音を抜いて際立たせた例がある"
    never:
      - "キラッ系・拍子木・キーン・ピピ・cursor1 の場面（観測でBGM停止0回）"
      - "代弁（P16）。2026-09-26 ユーザー指示で流したままにする（2本目に合わせる。完成版は5秒以上の3場面で止めていたが採用しない）"
    how: |
      BGMクリップを、そのテロップの開始と終了でカットし、間のクリップを無効化する（フェードなし）。
      曲はカットした分だけ先へ進んだ位置から戻る（頭出ししない）。
    length: "テロップの表示時間と同じ（多くは1〜4秒）"
    observed: "23回（33分で）。SE系統別の停止率: 鈴8/15・ピアノの単音3/3・間抜け4/10・ツッコミ2/10・チーン1/2・キラッ0/27・拍子木0/14"

tempo:
  observed:
    cut: "話し声クリップ967個、長さの中央値1.5秒（ジャンプカット）"
    subtitle: "通常字幕の表示中央値2.1秒・文字数中央値15字・90%が26字以内"
    se: "6.9回/分。間隔の中央値6.3秒・90%が18.2秒以内・95%が22.8秒以内・最長46.5秒"
    decorated_telop: "5.8回/分（導入8.8回/分・本編4.7回/分）。間隔の中央値6.0秒"
    zoom: "3.2回/分。間隔の中央値14.3秒"
    any_event: "SE・装飾テロップ・ズームのどれか: 15.9回/分。間隔の中央値0.9秒・90%が12秒以内・95%が15.6秒以内・最長46.5秒"
    emphasis_mix: "強調テロップ125件のうち、意味の強調53件（42%）・感情の強調72件（58%）（型で数えた古い数。2026-09-27 に中身で数え直すと、お手本2本の191件中 意味126・感情65）"
    sections:
      導入 0:00〜7:46: "装飾テロップ8.8回/分・ズーム4.5回/分。離脱を防ぐため一番濃い"
      本編 7:46〜29:20: "SE7.7回/分・装飾テロップ4.7回/分・ズーム2.6回/分。章ごとに「章の入り」パターン"
      まとめ 29:20〜: "SE5.1回/分。説明が続くので薄め"
  guide:
    - "15秒以上、SE・装飾テロップ・ズームのどれも起きていない区間は見直す（観測の95%はこれより短い）"
    - "見直すときは、その区間の中から感情が動いた一言・列挙・画面操作・要点を探し、一番軽い演出から当てる（ピピだけ → 感情の強調 → 要点の赤 → 画像・図）"
    - "候補が本当に無い（淡々とした説明が続く）なら足さない。観測でも最長46秒の区間がある"
    - "同じSEの連続は、列挙など意味が同じときだけ。山場用（シャラーン・ピラリーン・太鼓ドドン）は1本で数回まで"
    - "導入は濃く、本編は章の入りで山を作り、説明中は薄く"
