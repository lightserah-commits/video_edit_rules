# ズーム・BGM・テンポ（工程5 ズーム・工程7 BGM・テンポの数字）
#
# 根拠: みかみさんCH0726_最終.prproj / AI使いこなす習慣7選（33分）。observed の数字は無効化クリップを除いた実配置。
# 2本目（AI時代に消える仕事残る仕事／冒頭 28.6分）でも答え合わせ済み（2026-10-02。observed_2 と 実例/AI時代に消える仕事残る仕事_冒頭/答え合わせ.md）。
# 書き方：rule＝すること／how＝やり方／check＝確かめ方／why＝根拠。テンポの見直し方（15秒・一番軽い演出から）は 01 の手順7。
# 「目安」はレビューのきっかけ。数字を満たすために演出を足すことはしない（01 の手順7）。

version: 0.2
status: 確定（2026-09-29 小川さん：AI が決めて使っていたズームの決まりも確定）

zoom:
  rule: |
    ズームはテロップとセットの「画角の強調」。テロップが出ている間だけ固定倍率にして、終わったら元の画角に戻す。動かすアニメーション（キーフレーム）は付けない。
    寄り・引きはカメラの間だけ（画面を映している間はしない。07 の zoom）。聞き手が話している字幕では、強調してもズームしない
  how: |
    聞き手の字幕：カメラに映っているのはみかみさんなので、寄っても話し手に寄らない。ツッコミ（P06）のように、みかみさんの反応を見せたい時だけ強い寄りにする。
    並んだ字幕でズームの倍率が行ったり来たりしないよう、続く2枚の片方はズームしない。
    寄り・引きの間は右上のタイトルを出さない（02 の titles）。図解の間は外す（09）
    画角が変わるコマ（寄り・引きの入りと出、カメラと画面の切り替え）では、前のテロップ（字幕・強調・説明・右上のタイトル）を1コマも残さず、先にも出さない。
    テロップの出入りを画角の変わるコマにそろえる（ズームはカメラのクリップごとにかかるので、強調を声の聞こえ始めまで遅らせると、その数コマだけ前の字幕が寄り・引きの絵に残る。
    ズームが付く強調は遅らせず、画角が変わるコマから出す）。並べる座布団（P11）は寄りの上に重ねる作りなので、またいでよい
  gakaku_check: 画角が変わるコマの前後15コマ以内に、テロップの頭・終わりがずれて無いこと・字幕と強調と説明がまたいでいないこと（tools/check_gakaku.py。元は環境設定 v004 の _work/check_gakaku.py。工程9）
  gakaku_why: 2026-10-04 小川さん（環境設定 v002 の 1:31）「縮小入る瞬間に若干このテロップが残ってる。気持ち悪いから、基本、画角変化が入る時はテロップ消すようにしてください」→ ルールに足すのは同日 OK
  use:   # 使う倍率（02 の各パターンの scale は完成版の観測の幅。実際に置く時はこの値）
    寄り: 120〜135%（言い切りが強いほど大きく。本編の標準と章の入りは120%）
    強い寄り: 150%（頭が切れないよう少し下げる：位置の縦 0.55）
    引き: 75〜80%（カメラ直接。調整レイヤーの E002 は使わない（2026-10-02：見本集の E002＝調整レイヤーの70% を複製すると、縮んだ映像の周りに元のカメラが透けて二重に写る。小川さん「調整レイヤーは編集者都合なので、それで大丈夫」））
  levels:   # 完成版の観測（どのパターンでどれくらいか）
    寄り:
      scale: "120%（本編の標準）／130〜144%（導入や盛り上がり）"
      use_for: [P01 決め・断言, P02 成果, P03 名言, P10 章の入り, P05 笑いの一部, P06 ツッコミ（基本）, P11 並べる座布団の間]
      duration: "テロップと同じ長さ（中央値2.3秒／2本目3.2秒）。章の入りと並べる座布団の間は4〜12秒"
      observed: "70回。120%が最多（41回）"
      observed_2: "2本目 66回。120%が最多（59回）、ほかは130%"
    強い寄り:
      scale: "150〜171%（まれに183〜266%）"
      use_for: [P06 強く否定する一言, P07 驚き・困惑の反応, P01 の最大の山場]
      duration: "短く（中央値1.2秒）"
      observed: "17回（150%が9回）"
      observed_2: "2本目 6回（150%5・160%1）。1本目より少ない"
    引き:
      scale: "70%（調整レイヤー）／71〜85%（カメラ直接）"
      use_for: [P04 本音・皮肉・シュール, P05 呆れ]
      duration: "中央値1.9秒"
      note: 縮小した周りは黒フチのまま（下に何も敷かない）。引きは BGM 停止とセットになりやすい（冷めた間を作る）
      observed: "19回"
      observed_2: "2本目 26回（全部70%・調整レイヤー）。シュール（P04）21件中18件が引き"
  method:   # 置き方（工程8）
    adjustment_layer: |
      寄り・強い寄りは、見本集の画面効果（E###。寄り120%・強い寄り150% など）を Library.add_effect で、テロップの開始〜終了の長さで V5（仮想カメラ）に置く。
      V1〜V4 だけが拡大され、V6 から上のテロップ・タイトルは拡大されない
    camera_direct: 引きは必ずこちら（周りは黒いふち）。寄りでも倍率や位置を変えたい時は、カメラのクリップをテロップの区間で切り、モーションの部品を複製して付けてスケールを変える（tools/native_prproj.py。例 make_v006.py の add_motion）
    position: "基本は中央。顔が画面外に出る場合は、顔が中央に来るよう位置を調整（カメラ直接の例: 0.46, 0.59）"
    observed_2: 2本目はズーム98回すべて調整レイヤー（カメラ直接は0）
    observed: 完成版は、導入（〜7:46）とラスト数分はカメラのクリップを切ってスケール（約40回）、本編は調整レイヤー＋トランスフォーム（約67回）。完成版では右上の話題タイトルが調整レイヤーより下の段にあり一緒に拡大されていた（ズーム中にタイトルを消した所が約3割）
  not_this: 画面録画の操作説明で使う「操作箇所へ寄るキーフレームのズーム」は別物（P12・07 の zoom）。顔カメラの強調ズームに混ぜない
  frequency: "3.2回/分（導入4.5回/分・本編2.6回/分）。間隔の中央値14秒。2本目は3.4回/分・12.4秒"
  why: 完成版の観測。聞き手の字幕・倍率・続く2枚は、画面解説の案件（v004〜v006）で AI が決めて使い、2026-09-29 小川さんが決まりにした。右上タイトルは 2026-09-26 ユーザー指示

bgm:   # 工程7
  tracks:
    main:
      file: 素材/BGM/0.【メインテーマ】audiostock_900412.mp3
      rule: A3 に、挨拶（0:16）から最後まで、この1曲を曲の頭から続けて流す（素材は3分17秒なのでループ）。途中で曲が飛ばないようにする
      gain_db: 0
      note: 素材自体が -42LUFS と小さく作ってあり、そのまま声の下で鳴る。ダッキング用のキーフレームは使っていない
      why: 完成版。曲が飛ばないようにするのは、画面共有装飾 v002 で直した所
    digest:
      file: 素材/BGM/ダイジェスト用BGM.mp3
      rule: 冒頭ダイジェスト（0:00〜0:13.7）だけ、-3dB。指鳴らし→タイトルコールの約2.6秒は BGM なし → 挨拶と同時にメイン BGM 開始（02 の P15）
  balance:   # 音量
    rule: 声と BGM の差が約 19 LU になるようにする
    how: |
      声の素材の大きさを ffmpeg の ebur128 で測る。声を上げられる（ピークに余裕がある）なら完成版と同じく声を上げる。
      上げられないなら BGM を下げ、SE も同じだけ下げる（03 の gain_db はこの差で置いた値）
    example: "画面解説：声 -34.9 LUFS・ピーク +2.5dBFS → BGM -12dB・SE -12dB"
    check: 耳での確認はユーザー（AI は音を出さない）。報告に「聴いてほしい時刻」を入れる
    why: 2026-09-26 ユーザー指示「BGM が大きすぎる。元のプロジェクトとの音のバランスを見て調整」。完成版は、声の素材 -40.0 LUFS に声クリップの +17.02dB を掛けて約 -23 LUFS、BGM は 0dB（素材 -42.1 LUFS）で、差は約 19 LU
  stop:   # BGM を止める
    rule: BGM を止めるのは「オチ」の一言だけ。工程5で decoration_plan.csv の BGM停止列に書いた候補から、強調と図解が決まった後に選ぶ。シュール（P04）の一言はオチとして扱い、既定で止める（引き＋SE とセット。02 の P04 の set）
    when:
      - "P04 シュールの一言（既定で止める。2026-10-02 小川さん。2本目は21件中18件で停止）"
      - "P04 本音・皮肉・シュール、P05 呆れ・笑い、P06/P07 のうち「オチ」になっている一言"
      - "特大の決め（「これ！！！」）で1回だけ、音を抜いて際立たせた例がある"
    never:
      - "キラッ系・拍子木・キーン・ピピ・cursor1 の場面（観測で BGM 停止0回。03 の family_bgm_rule）"
      - "代弁（P16）。流したままにする（完成版は5秒以上の3場面で止めていたが採用しない）"
      - "図解だからという理由では止めない（09）"
    how: |
      BGM クリップを、そのテロップの開始と終了でカットし、間のクリップを無効化する（フェードなし）。長さはテロップの表示時間と同じ（多くは1〜4秒）。
      曲はカットした分だけ先へ進んだ位置から戻る（頭出ししない）
    from_middle: 途中の版から始めた時は、ユーザーが止めていた所は残す
    check: tools/check_deco.py などで BGM 停止の区間を確かめる（工程9）。聴いてほしい時刻に BGM を止めた所を入れる（工程11）
    observed: "23回（33分で）。長さの中央値2.1秒・最長12.2秒。SE の系統別の停止率は 03 の family_bgm_rule"
    observed_2: "2本目 26回（28.6分で）。長さの中央値2.8秒・最長5.6秒。止めた所の多くはシュール＋引き（31行中23行が引き）"
    why: 完成版の観測。代弁で止めないのは 2026-09-26 ユーザー指示（2本目に合わせる）。「核心だから止める」ではなく「オチで止める」は上司の仮ルールとも整合（00）

