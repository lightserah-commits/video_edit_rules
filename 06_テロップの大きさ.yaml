# テロップの大きさ（文字の大きさと、1行か2行か）
#
# 根拠: みかみさんCH0726_最終.prproj / AI使いこなす習慣7選 の強調テロップ（強調赤黄24・金17・青13・シュール45・
#       ヒラギノ白シャドウ9・ツッコミ8・白テキ7・基本テロップ赤14）の実測。横幅はフォントの寸法から計算した値で、数%の誤差がある。
#       位置は変えていない（同じスタイルなら位置は同じ）。編集者は1本ずつ「文字の大きさ」だけを変えていた。
# 確かめたこと: この決まりで完成版の大きさを計算し直すと、強調赤黄は24本中20本、金は17本中12本が元と±10%以内。
#   1行か2行かの決まり（縮みが75%未満なら2行）は、完成版の1行／2行の選び方と123本中118本が一致（基本テロップ赤を除く。前の「12文字を超えたら2行」は98本）。
# 決めた日: 2026-09-26（ユーザー確認。短い一言は画面いっぱいにはせず、上限で止める。2行の決まりは同日に「縮み75%」へ差し替え）
#
# 大きさ ＝ 文字の大きさ（px）× テロップ全体の拡大率。テロップ全体を拡大している見本（ベクトルモーションのスケールなど）は、
#          その分を割り引いて文字の大きさを決める。縁取りの太さ・行間は変えない（行間は文字の大きさに合わせて自動で決まる）。
#
# ツール（tools/telop_size.py）がこのファイルの common と by_style を読む。
# common は「名前: 数」、by_style は「スタイル名: {基本: 数, 短い一言の倍率: 数, 上限: 数}」を1行に1つで書く。書き方を崩さない。

version: 0.2
status: 確定（2026-09-26 ユーザー確認。数字は1本目の完成版の実測）
# 並べる座布団（P11）の位置・大きさは 02 の P11 の layout、右上タイトルの大きさ（70%）は 02 の titles、反応の声の明朝1文字（320）は 08 の captions.reaction_voice。

principle:
  - 強調テロップは、スタイルごとの「基本の大きさ」で置く（通常字幕の約1.8倍）
  - 横幅は画面の90%まで。はみ出すなら、収まるまで小さくする
  - 1行のまま画面の90%に収めると、基本の大きさの75%より小さくなる時だけ2行にする。改行の位置は上司のルール（定義/30_文節と言葉.md）の文節に従う
  - 逆に、2行にしてあっても、1行にまとめて基本の大きさの75%以上で収まるなら1行にする
  - ツールはどちらの場合も知らせる（改行そのものは入れない）
  - 基本テロップ赤は通常字幕と同じ大きさなので、改行は通常字幕と同じく上司の30の文節で決める（この判定の対象外）
  - 5文字以下の短い一言は、スタイルごとの倍率まで大きくする。画面いっぱいまでは大きくしない（完成版の「全然違う」は画面の42%）
  - 基本テロップ赤は大きくしない（字幕の位置で目立たせる用途。通常字幕と同じ90）
  - シュールは、代弁のアホなふり（P16：誰かになりきって言う）のときだけ小さくする
  - この表にないテロップ（通常字幕・ポイントボード・章見出し・項目名カード・並べる座布団）は、見本の大きさのまま置く（右上タイトルと反応の声は上の注のとおり、02・08）
  - 注意：tools/telop_size.py は項目名カード（T093・T018）の横幅を実際の約1.67倍に計算する（文字の層の拡大率の数え方）。完成版の画像で測った見本の幅（T093「タスクファーストを習慣にする」＝1538px）との比で判断する

common:
  横幅の上限: 0.90          # 画面の幅に対する割合
  画面の幅: 1920
  短い一言の文字数: 5       # 一番長い行がこの文字数以下なら「短い一言」
  2行にする縮み: 0.75       # 1行のまま横幅の上限に収めると、基本の大きさの何倍まで縮むか。これより小さくなるなら2行

by_style:
  強調赤黄: {基本: 160, 短い一言の倍率: 1.25, 上限: 230}
  ゴージャス金: {基本: 170, 短い一言の倍率: 1.25, 上限: 260}
  ツッコミ: {基本: 155, 短い一言の倍率: 2.0, 上限: 315}          # 2倍の実例は「いやー！」の1つだけ
  ゴージャス青: {基本: 200, 短い一言の倍率: 1.0, 上限: 200}
  シュールテロップ: {基本: 156, 短い一言の倍率: 1.0, 上限: 156}      # 本音・皮肉（P04）
  シュールテロップ/P16: {基本: 114, 短い一言の倍率: 1.0, 上限: 114}  # 再現シーン（P16）
  ヒラギノ白シャドウ: {基本: 156, 短い一言の倍率: 1.0, 上限: 156}
  白テキ: {基本: 135, 短い一言の倍率: 1.0, 上限: 135}
  基本テロップ赤: {基本: 90, 短い一言の倍率: 1.0, 上限: 90, 改行: 字幕}   # 改行は通常字幕と同じ決め方

observed:   # 完成版の実測（参考。ツールは読まない）
  通常字幕: "みかみテロップ・質問者テロップとも大きさ90で固定。横幅は文字数しだい（画面の33〜84%）"
  強調赤黄の例: "全然違う 200（画面の42%）／絶対自動化する 159（58%）／意地でも適応した方がいい 144（90%）／2行 AIがアクセスできないところに・情報を置かない 120（90%）"
  横幅の上限の実際: "多くは90〜94%で止めている。シュールの再現シーンは長いセリフで画面の約100%まで使っていた"
