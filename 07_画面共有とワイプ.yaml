# 画面共有とワイプ（画面を見せながら話す動画。工程2 同期・工程3 画面の選び方・工程5 赤枠）
#
# 根拠：ユーザー指示（2026-09-26〜28）。完成版の観測からではなく、指示から作った決まり。
#   「普段はカメラの方。画面を見せているところは前後の文脈から判断して画面に切り替える」
#   「その前に、画面共有の映像と音声を合わせる」「ワイプは右上に、テロップと被らないように」
# 上司の方法セットとの関係（00 の対応表）：
#   91_タイムラインの棚配置 … このチャンネルでは画面をいつも V2 に置くので、ワイプは V11（02 の output_tracks）
#   72_画像差し込みのレイアウト … 「話者を残す理由がないのに常にワイプ表示する」はNG。このチャンネルでは「画面の説明中も話者の顔を残す」を理由に、画面の間はワイプを出す（ユーザー確認）
#   71_画面録画のシームレスズーム … 画面の拡大は、画面録画のクリップ自体で行う（下の zoom）
# 書き方：rule＝すること／how＝やり方／check＝確かめ方／why＝根拠。経緯・例・数字は 実例/根拠と実例.md、変えた記録は 変更履歴.md。
# トラック（どの段に置くか）は 02 の output_tracks、右上タイトルを出さない所は 02 の titles、SE の音量は 03 に1か所ずつ。

version: 0.6
status: 確定（2026-09-29。未確認はポインターの位置の記録が使えるかだけ＝pointer_zoom）

materials:   # 素材
  例: "Screen Studio の録画フォルダ（画面 channel-1-display-*.mp4、マイク channel-2-microphone-*.m4a、Webカメラ channel-3-webcam-*.mp4）＋ メインのカメラ IMG_*.MOV"
  webカメラ: ワイプの素材（顔）
  メモ: 画面・Webカメラ・マイクは同じ録画なので、互いには最初から合っている
  細切れの録画: 録画が細切れ（recording/channel-*-0000.mp4 と .m4s が数千個）の時は、ffmpeg でつなげた作業用の1本を edit/media/ に作る（元は触らない）。画面・マイク・Webカメラは同じ長さになるはず

sync:   # 音と映像を合わせる（工程2。最初に1回、編集の前に）
  rule: 画面の録画とWebカメラを、メインの音声（カメラの音）に合わせる。音はメインの音声だけを使う（画面録画・Webカメラ・Screen Studio のマイクの音は使わない）
  how: |
    Screen Studio のマイクの音とカメラの音の波形を比べて、ずれを測る。録画が複数に分かれていれば（display-0・display-1…）、それぞれ測る。
    長い録画は最初・真ん中・最後で測る。途中でずれが1フレームより大きく変わるなら、区間ごとに合わせ直す
  check: 測ったずれと、どこで測ったかを 00_案件メモ.md に記録する
  why: 2026-09-26 ユーザー指示「その前に、画面共有の映像と音声を合わせる」

switching:   # カメラと画面のどちらを映すか（工程3）
  rule: 基本はカメラ（話者）。画面の録画が回っていても、下の to_screen に当たる時だけ画面にする。前後の文脈で、字幕ごとに決める
  to_screen:
    - 操作・実演を見せている：画面が動いている（クリック・入力・スクロール・ページの切り替え）間に、その操作や結果の話をしている
    - 画面の中を指して話している：「この画面」「ここ」「これを見ると」「こうやって」「ここを押すと」など
    - 画面の中身が話の根拠：画面の文字・数字・結果を読み上げている、説明している
  stay_camera:   # 画面の録画が回っていても、次の時はカメラ
    - 感想・意見・結論・例え話・経験談・雑談・話のつなぎ
    - 聞き手とのやりとり（質問・相づち・反応）
    - 画面が止まっていて、話が画面の中身から離れている
  back_to_camera: 画面の話が終わったら、次の字幕の区切りでカメラに戻す。画面が止まったまま、画面に触れない字幕が2つ続いたら戻す
  cut_point: 切り替えは字幕の区切り（カット点）で行い、カットの切れ目にそろえる（切れ端を作らない。08 の no_slivers）
  min_seconds: 2      # これより短い切り替えはしない
  merge_seconds: 3    # 画面→カメラ→画面で、間のカメラが3秒未満なら画面のままにする（行ったり来たりしない）
  screen_fit: 画面の録画は高さに合わせて全体を入れる（Mac の画面は16:9より縦長なので、左右に黒い帯が出る）
  check: 画面にした区間ごとに、どの条件（操作・指す言葉・中身の説明）に当たったかを記録する（例 gamen_kaisetsu_20260926/analysis/画面とカメラ_決定.csv）
  why: 2026-09-26 ユーザー指示「画面共有のパートが多すぎて冗長。画面か話者かの選び方をもっと厳しく」（v0.2）

both_tracks:   # カメラと画面を両方置く
  rule: 画面の録画がある所は、カメラと画面を両方いつもタイムラインに置き、使わない方を無効にする
  how: |
    カメラ（V1）は全部置いて有効。画面（V2）は全部置き、映す所だけ有効、ほかは無効。カットの切れ目ごとに両方とも分ける（有効／無効を切れ目で切り替えられるように）。
    画面の上に画像などを重ねている所（小川さんの画像が V2 にある所など）は、画面を V1 に残してよい。段の決まりは 02 の output_tracks
  why: 2026-09-28 ユーザー指示「画面共有をちょっと伸ばしたい時があるので、使っていなかったら無効にすればいい。採用するやつだけしか置かれていないから直して」

wipe:   # ワイプ（画面を映している間）
  rule: 画面を映している間は、右上にワイプ（Webカメラの顔）をずっと出す（画面の説明中も話者の顔を残すため）
  how: |
    素材は Webカメラ。右上・画面幅の17.5%（336×189）・右上の角から画面の3%（横58px・縦32px）。
    V11 に画面と同じ所に全部置き、画面と一緒に有効／無効にする（出入りは画面の切り替えと同じフレーム。0.2秒未満だけ出る・消える所を作らない）。
    字幕（下）・強調テロップと重ならないこと。重なるなら重ならない配置を検討してユーザーに確認する
  check: 工程9 でワイプの位置、工程10 で画面とワイプの画像
  why: 2026-09-26 ユーザー指示（大きさは「ワイプの存在感が強すぎる。70%ぐらいに小さく」で 25% から 17.5% へ）。段は 2026-09-29 小川さん（V11）

demo_label:   # 実演の札
  rule: 画面で実演している（アプリを動かして見せている）間は、左上に何をしているかの札をずっと出す。カメラに戻ったら消す
  how: |
    文言は、何をしているかがどこから見ても分かる短い言葉を AI が決める（「ChatGPT Workの実演」「（普通の）ChatGPT での実演」「Codexの実演」、2つを見比べる所は「ChatGPT Work と Codex の比較」）。やっていることが変わったら札も変える。
    見た目は左上に青い背景・白い文字。見本集の T203（区画H）を複製して文字を変える。
    分け方：画面の文字認識で、左上のアプリ名（ChatGPT／Codex）と入力欄（「Work モードで作成」＝ワーク、「ChatGPT に聞く」＝チャット）を見る。設定画面はそのアプリの実演に入れる。
    Addness・ブラウザの画面が2秒未満はさまるだけなら、前後の札をつなぐ。2秒未満の札は出さない
    （作り方の例：~/Desktop/みかみ案件依頼書/0927 claude cowork/edit/v003/_work/app_spans_v003.py と make_v003.py の ②）
  why: 2026-09-28 ユーザー指示「実演パートの時は左上に青の座布団。何をやっているか分からないから。コピーはお任せ」

read_frame:   # 話している所の赤枠（工程5）
  rule: |
    画面を映している間は、話している中身が画面のどこかを赤枠で囲む（2026-10-04 から。読み上げに限らない）。
    話者が画面の文字（生成された文・資料・クイズの問題・入力した文など）を読み上げている所、図の箱・ボタン・行など「ここの話」の所。
    同じ所の話が続く間は枠を出したまま、話が別の所へ移ったら枠も移る。話している物が画面に映っていない・画面全体の話・切り替え中（読み込み・描いている途中）は枠なし。
    ボタンの文字にたまたま当たっただけの所は除く
  how: |
    見つけ方：画面を映している字幕ごとに、その時の画面の画像（字幕の頭と途中）を Mac の文字認識（tools/screen_ocr.swift）で読み、
    字幕の文字の6割以上（5文字以上）が画面の1行の中に出ていれば「読んでいる」。1文字違い（意思／意志）は許す。ブラウザの上の帯は除く。
    行の一部だけを読んでいる時は、その部分に枠を絞る。続けて同じ場所を読む字幕はまとめて1つの枠にする。道具：tools/screen_reading.py（frames → ocr → read。外すものは --exclude）
    話している所（2026-10-04 から）：字幕ごとに、その時の画面の画像と文字認識の結果を AI が見て、話している要素の四角を決め、
    枠を描いた確かめの画像を作って見直し、別の AI が反証する（tools/red_frames/：prep.py → 決める → render.py → 反証 → place.py。手順は tools/red_frames/README.md。元は環境設定 v004）。
    見た目：赤（255,30,30）の角丸の枠、線の太さ 8px、余白 10px。
    音：小さいクリック（音量は 03 の rules）。枠が別の場所に移った時だけ鳴らす（同じ枠が続く時は鳴らさない）
  check: 見つけた枠は一覧にして、読み上げでないもの（ボタン・進み具合の表示など）を外す。工程10 で読み上げている文字を囲んでいるか画像で見る
  why: 2026-09-26 ユーザー指示（v0.4）。2026-10-04 小川さん「画面共有のところ全体的に、どこの話してるかっていうのは全部赤枠で囲ってください。そうしないと分からないです。例えばエージェント層の話というところを俺見てるんだけど、ここの話っていうのは赤枠で」→ 変更を OK

zoom:   # 画面の間の拡大
  rule: 画面を映している間は、強調の寄り・引き（04 の zoom。V5 の調整レイヤー）を使わない。画面の一部を大きく見せたい時は、画面録画のクリップ自体を拡大する
  why: V5 の調整レイヤーは V1〜V4 に効くので、画面（V2）まで拡大されてしまう。画面録画のクリップ自体の拡大は、1本目の完成版の画面操作（P12）と同じやり方
  pointer_zoom:   # ポインターで指した所の拡大
    rule: スライドなどを画面共有で見せ、みかみさんがポインター（カーソル）で指しながらその中身を話している時は、画面の録画のクリップ自体を、指している所を中心に 1.5倍くらいに拡大する
    how: |
      ワイプ・字幕・左上の札は拡大しない。指している所について話している間だけ拡大し、話が移ったら元に戻す。拡大と戻しは 0.3秒ほどでなめらかに。
      ポインターの位置は Screen Studio の録画の記録を使う。無い時は画面の画像からポインターを探す
    check: 【未確認】Screen Studio のポインターの位置の記録が使えるかは、最初の案件で確かめる
    why: 2026-09-28 ユーザー指示（おすすめどおりで OK）

blur:   # ぼかし（パソコンの中身）
  rule: AI は自分でぼかしを入れない。ぼかすのは、Finder などパソコンの中身（個人のファイル名・フォルダ）が見える瞬間だけで、場所はユーザーが指定する。AI は候補を一覧にして見せるだけ
  how: |
    候補の探し方：画面の文字認識で「よく使う項目・デスクトップ・アプリケーション」（Finder）や「マイドライブ・共有アイテム・アイテムを選択」（Google ドライブ）を探し（tools/screen_reading.py private）、1秒ごとの画像で出ている範囲を決める。
    置き方（指定された時）：ぼかすのは中身だけ（見出しやタブは残す）。画面の録画の写しに「ブラー（ガウス）40」と「クロップ」を掛けて V4 に重ねる。ワイプ（V11）は動かさない。
    数百か所あるような時は、画面の作業用コピー（edit/media/）にぼかしを焼き込む（ワークの完全解説 v002 の screen_blur_v002d.mp4）
  not_this: ChatGPT・Codex・Claude などのアプリの画面・履歴、画面に出る会社名・人名は、AI の判断ではぼかさない
  check: 工程10 で、指定された所の中身がぼけていて字幕が隠れていないかを画像で見る
  why: 2026-09-28 ユーザー指示「ぼかしが入りすぎ。Codex や ChatGPT の画面を全部ぼかすのはよくない。Finder とか具体的なパソコンの中身を見せる瞬間だけでいい。ぼかしは俺が指定したほうがいいので、一旦なくていい」（ワークの完全解説の確認①の「左の履歴・アカウント・会社名をずっとぼかす」は取り消し）。置く段は 2026-09-29 小川さん（V4）
