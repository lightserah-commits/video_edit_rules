# 画面共有とワイプ（画面を見せながら話す動画）
#
# 根拠: ユーザー指示（2026-09-26）。完成版の観測からではなく、この指示から作った決まり。
#   「普段はカメラの方。画面を見せているところは前後の文脈から判断して画面に切り替える」
#   「その前に、画面共有の映像と音声を合わせる」「ワイプは右上に、テロップと被らないように」
# 参考（採用しない形）: 2本目の完成版（AI時代に消える仕事残る仕事）は、スクリーンショットを見せる所で
#   カメラを52%に縮小して右下に重ねていた（冒頭25〜27分・4か所）。今回の決まり（右上・25%）とは違う。
# 上司の方法セットとの関係:
#   91_タイムラインの棚配置 … V1＝メイン映像、V2＝サブ映像（画面録画・顔のワイプ）、A1＝メイン音声。この配置に従う
#   72_画像差し込みのレイアウト … 「話者を残す理由がないのに常にワイプ表示する」はNG。
#     このチャンネルでは「画面の説明中も話者の顔を残す」を理由として、画面を映している間はワイプを出す（ユーザー確認）
#   71_画面録画のシームレスズーム … 画面の拡大はするが、下の「ズーム」の決まりどおり画面録画のクリップ自体で行う

version: 0.5   # 0.2：カメラと画面の選び方を厳しくした／0.3：ワイプを小さくした／0.4：タイトル・赤枠・ブラー（すべて 2026-09-26 ユーザー指示）
               # 0.5：カメラと画面を両方置く・実演の札・ぼかしはユーザーが指定した所だけ（2026-09-28 ユーザー指示。ワークの完全解説 v003）
status: 暫定（ユーザー指示から作成。最初の案件で見た目を確かめて更新する）

materials:
  例: "Screen Studio の録画フォルダ（画面 channel-1-display-*.mp4、マイク channel-2-microphone-*.m4a、Webカメラ channel-3-webcam-*.mp4）＋ メインのカメラ IMG_*.MOV"
  webカメラ: ワイプの素材（顔）
  メモ: 画面・Webカメラ・マイクは同じ録画なので、互いには最初から合っている

sync:   # 最初に1回、編集の前に行う
  - 画面の録画とWebカメラを、メインの音声（カメラの音）に合わせる。Screen Studio のマイクの音とカメラの音の波形を比べて、ずれを測る
  - 録画が複数に分かれていれば（display-0・display-1…）、それぞれ測る
  - 長い録画は最初・真ん中・最後で測る。途中でずれが1フレームより大きく変わるなら、区間ごとに合わせ直す
  - 音はメインの音声だけを使う（画面録画・Webカメラ・Screen Studio のマイクの音は使わない）
  - 測ったずれと、どこで測ったかを案件フォルダに記録する

switching:   # カメラと画面のどちらを映すか（v0.2：2026-09-26 ユーザー指示「画面共有のパートが多すぎて冗長。画面か話者かの選び方をもっと厳しく」）
  default: カメラ（話者）。画面の録画が回っていても、基本はカメラ
  to_screen:   # 次のどれかに当たる時だけ、画面にする。前後の文脈で判断する
    - 操作・実演を見せている：画面が動いている（クリック・入力・スクロール・ページの切り替え）間に、その操作や結果の話をしている
    - 画面の中を指して話している：「この画面」「ここ」「これを見ると」「こうやって」「ここを押すと」など
    - 画面の中身が話の根拠：画面の文字・数字・結果を読み上げている、説明している
  stay_camera:   # 画面の録画が回っていても、次の時はカメラ
    - 感想・意見・結論・例え話・経験談・雑談・話のつなぎ
    - 聞き手とのやりとり（質問・相づち・反応）
    - 画面が止まっていて、話が画面の中身から離れている
  back_to_camera: 画面の話が終わったら、次の字幕の区切りでカメラに戻す。画面が止まったまま、画面に触れない字幕が2つ続いたら戻す
  cut_point: 切り替えは字幕の区切り（カット点）で行う。カットの切れ目から5フレーム以内なら切れ目にそろえ、0.2秒未満の切れ端（画面・カメラ・ワイプ）を残さない（08 の no_slivers。2026-09-27 ユーザー指示）
  min_seconds: 2      # これより短い切り替えはしない
  merge_seconds: 3    # 画面→カメラ→画面で、間のカメラが3秒未満なら画面のままにする（行ったり来たりしない）
  record: 画面にした区間ごとに、どの条件（操作・指す言葉・中身の説明）に当たったかを記録する
  reference: "Codex の画面解説 v004 は、画面共有中ずっと画面を映していた（60.6分中45.8分・76%、4区間。最長28.5分）。その間の字幕995本のうち、画面を指す言葉・操作の言葉があるのは88本（9%）で、冗長だった"
  screen_fit: 画面の録画は高さに合わせて全体を入れる（Mac の画面は16:9より縦長なので、左右に黒い帯が出る）

wipe:   # 画面を映している間
  show: 画面を映している間はずっと出す（画面の説明中も話者の顔を残すため）。出入りは画面の切り替えと同じフレームにし、0.2秒未満だけ出る・消える所を作らない（08 の no_slivers）
  source: Webカメラ
  position: 右上
  size: 画面幅の17.5%（336×189）   # 2026-09-26 ユーザー指示「ワイプの存在感が強すぎる。70%ぐらいに小さく」で 25%（480×270）から縮めた
  margin: 右上の角から画面の3%（横58px・縦32px）
  avoid: 字幕（下）・強調テロップと重ならないこと。重なるなら重ならない配置を検討してユーザーに確認する
  titles: 右上のシリーズ名・話題タイトル（02 の titles）はワイプと重なるので、画面を映している間は出さない（ユーザー確認）

tracks:   # 上司の 91_タイムラインの棚配置 に従う（V1＝メイン映像、V2＝サブ映像）
  both: |
    画面の録画がある所は、カメラと画面を**両方いつもタイムラインに置く**（2026-09-28 ユーザー指示「画面共有をちょっと伸ばしたい時があるので、
    使っていなかったら無効にすればいい。採用するやつだけしか置かれていないから直して」）。
    V1＝カメラ（全部。有効）、V2＝画面の録画（全部。映す所だけ有効、ほかは無効）。カットの切れ目ごとに両方とも分ける（有効／無効を切れ目で切り替えられるように）
  wipe: ワイプ（Webカメラ）は画面より上の段に、画面と同じ所に全部置き、画面と一緒に有効／無効にする（ワークの完全解説は V9）
  A1: メイン音声
  note: 画面の上に画像などを重ねている所（小川さんの画像が V2 にある所など）は、画面を V1 に残してよい

read_frame:   # 画面の中を読み上げている所に赤枠（v0.4）
  when: 話者が画面の文字（生成された文・資料・クイズの問題・入力した文など）を読み上げている時。ボタンの文字にたまたま当たっただけの所は除く
  find: |
    画面を映している字幕ごとに、その時の画面の画像（字幕の頭と途中）を Mac の文字認識（tools/screen_ocr.swift）で読み、
    字幕の文字の6割以上（5文字以上）が画面の1行の中に出ていれば「読んでいる」。1文字違い（意思／意志）は許す。ブラウザの上の帯は除く。
    行の一部だけを読んでいる時は、その部分に枠を絞る。続けて同じ場所を読む字幕はまとめて1つの枠にする
    道具：tools/screen_reading.py（frames → ocr → read。外すものは --exclude）
  look: 赤（255,30,30）の角丸の枠、線の太さ 8px、余白 10px。字幕を読んでいる間だけ出す
  se: クリックを小さく（03）。強調の SE と同じ瞬間なら強調の方だけ鳴らす
  check: 見つけた枠は一覧にして、読み上げでないもの（ボタン・進み具合の表示など）を外す

blur:   # 個人のパソコンの中身（v0.4。v0.5 で「ユーザーが指定した所だけ」に）
  rule: |
    AI は自分でぼかしを入れない。ぼかすのは、Finder などパソコンの中身（ファイル名・フォルダ）が見える瞬間だけで、場所はユーザーが指定する
    （2026-09-28 ユーザー指示「ぼかしが入りすぎ。Codex や ChatGPT の画面を全部ぼかすのはよくない。Finder とか具体的なパソコンの中身を見せる瞬間だけでいい。
    ぼかしは俺が指定したほうがいいので、一旦なくていい」）。AI は下の find で候補を一覧にして見せるだけ
  what: Finder のファイル選択・Google ドライブのファイル一覧など、個人のファイル名やフォルダが見える所（ユーザー指示「全部ブラー」）
  find: 画面の文字認識で「よく使う項目・デスクトップ・アプリケーション」（Finder）や「マイドライブ・共有アイテム・アイテムを選択」（ドライブ）を探し（tools/screen_reading.py private）、1秒ごとの画像で出ている範囲を決める
  how: |
    ぼかすのは中身だけ（見出しやタブは残す）。画面の録画の写しに「ブラー（ガウス）40」と「クロップ」を掛けて字幕より下の段（V2）に重ね、
    その間だけワイプを一番上の段に移す（字幕を隠さないため）
  not_this: ChatGPT・Codex・Claude などのアプリの画面・履歴は、AI の判断ではぼかさない。画面に出る会社名・人名も、ぼかすのはユーザーが指定した所だけ（2026-09-28 決定。ワークの完全解説の確認①で「左の履歴・アカウント・会社名をずっとぼかす」にしていたのを取り消し）

demo_label:   # 実演の札（2026-09-28 ユーザー指示「実演パートの時は左上に青の座布団。何をやっているか分からないから。コピーはお任せ」）
  when: 画面で実演している（アプリを動かして見せている）間は、ずっと出す。カメラに戻ったら消す
  text: |
    何をしているかが、どこから見ても分かる短い言葉。AI が決める（「ChatGPT Workの実演」「（普通の）ChatGPT での実演」「Codexの実演」、
    2つを見比べる所は「ChatGPT Work と Codex の比較」）。やっていることが変わったら札も変える
  look: 左上に、青い背景・白い文字の札。見本集の T203（区画H。ワークの完全解説で小川さんが作った札）を複製して文字を変える
  find: |
    画面の文字認識で、左上のアプリ名（ChatGPT／Codex）と入力欄（「Work モードで作成」＝ワーク、「ChatGPT に聞く」＝チャット）を見て分ける。
    設定画面はそのアプリの実演に入れる。Addness・ブラウザの画面が2秒未満はさまるだけなら、前後の札をつなぐ。2秒未満の札は出さない
    （作り方の例：~/Desktop/みかみ案件依頼書/0927 claude cowork/edit/v003/_work/app_spans_v003.py と make_v003.py の ②）
  with: 右上のタイトルは画面を映している間は出さない（wipe.titles）ので、左上の札と重ならない

zoom:
  - 画面を映している間は、強調の寄り・引き（V5 の仮想カメラ＝調整レイヤー）を使わない。V1〜V4 に効くので、ワイプ（V2）まで拡大されてしまう
  - 画面の一部を大きく見せたいときは、画面録画のクリップ自体を拡大する（1本目の完成版の画面操作 P12 と同じやり方）
  - pointer_zoom:   # ポインターで指した所の拡大（2026-09-28 ユーザー指示・おすすめどおりで OK）
      when: スライドなどを画面共有で見せ、みかみさんがポインター（カーソル）で指しながら、その中身を話している時
      how: |
        画面の録画のクリップ自体を、指している所を中心に 1.5倍くらいに拡大する（ワイプ・字幕・左上の札は拡大しない）。
        指している所について話している間だけ拡大し、話が移ったら元に戻す。拡大と戻しは 0.3秒ほどでなめらかに
      find: Screen Studio の録画はポインターの位置を記録しているはず（使えるか最初の案件で確かめる）。無い時は画面の画像からポインターを探す
