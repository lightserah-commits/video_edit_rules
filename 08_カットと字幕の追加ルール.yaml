# カットと字幕の追加ルール（工程3 カット・工程4 字幕）
#
# カット・文字起こし・通常テロップ・話者は、上司の方法セット（10_カットと構成・20_間・30_文節と言葉・話者の決まり）が正。
# ここは、その上にこのチャンネルで足す決まり。上司の決まりと食い違って見える時は、推測で決めずにユーザーに確認する（00 の最初の表）。
#
# 書き方：rule＝すること／how＝やり方／check＝確かめ方（道具。コマンドは 編集の依頼文.md の工程9）／why＝根拠（いつ・誰の指示）
#   長い経緯・観測の数字・例は 実例/根拠と実例.md の「08」、変えた記録は 変更履歴.md。
# 並び：品質の基準 → カット（動画の型 → 考え方 → 2段階 → 切るもの → 残すもの → つなぎ目 → 話のつながり → 間 → 切れ端 → 並べ替え → 尺の変更）→ 字幕

