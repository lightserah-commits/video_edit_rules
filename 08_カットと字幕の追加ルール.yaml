cut:
  video_type:   # 動画の型
    rule: 動画の型は 動画の土台.md の4（今は実践・レビュー解説型だけ。話し手の反応・評価・ツッコミ・つまずきへの反応を一律に切らない）
    why: 2026-09-27 ユーザー指示（画面解説 v009 の直しから）。型を1つにしたのは 2026-10-02 小川さん「ぶっちゃけ実践レビュー系しかない」（前の「対談・解説型」の本題から外れた話を塊で切る決まりは、下の remove の「脱線」にある）

  principle:   # カットの考え方
    rule: |
      話者は、伝わりやすいように多めに話してくれている。テロップで補えるなら短く伝え直してよい。
      カットを決める時は「テロップで補えば、ここは無くても伝わるか」を考える。要点と最初の例は残し、同じことの言い直し・例えの続き・脱線を切って、話の密度を上げる。
    how: カットはリズム（緊張と緩和）の土台。強調テロップ・SE で緊張は作れるが、冗長な話が長く続くとリズムが消える
    why: 2026-09-27 ユーザー指示・完成版2本
    not_by_time: 話す速さ・長さだけで切らない。「1秒に1文字より遅いなら切る」のような機械の判定はしない。ゆっくり話す・間を取る・強調は、それだけでは切る理由にならない（切るかは中身で決める。間の詰め方は pauses）
    why_not_by_time: 上司の10 のドラフト（時間による機械の判定は本人が否定）から移した（2026-10-19 小川さん OK）

  stages:   # 切る順番
    rule: ① 無音を詰める → ② 中身で切る、の2段階で切る
    how: |
      ① 声の大きさで間の候補を出し、下の pauses の数字まで詰める（溜め・画面の結果が出る所は残す）
      ② 字幕を頭から読み、下の remove に当たる所を切る。
         中身は大きい物から3回に分けて読む（remove もこの順に並べた）。区切りごとに分けて読むだけだと、塊を丸ごと切るかと、区切りをまたぐくり返しが問われない：
         (1) 話の塊：頭から最後まで1人で読み、話のまとまりごとに要るかを決める。脱線・段取り・長い例。長い例は remove の「脱線・例えの続き・くどい補足」の判断シートの候補の出し方
         (2) くり返し：話題ごと。読む前に、話のまとまりごとに要点の言い切りの文（「〜なのよ」「〜が基本なのね」「〜がポイント」「〜が鉄則」「だから売れん」）に印を付け、言い切りの文の前後を先に見る（同じ要点の言い直し・まとめの後に足した例・強調の足し・言いかけ）。
             同じ要点の言い切りが2つ以上ある時は1つを残す（どれを残すかは remove の「同じ話のくり返し」）。言い切りの前の振り（keep の「見せ場・要点の前の振り」）は残す
             言い切りの文のすぐ後の1〜3文は、付け足し（同じ中身の言い直し・力の無い一言・同じ操作の補足・次の話の前置き・言いかけ・念押し）でないかを読み、付け足しなら切る。数行にまたがる付け足しは、区切りごとに分けず1つの候補として出す。言い切りを受けて新しい中身（時・範囲・条件・理由）を足す文（「今までは」「基本的に」）は残す
         (3) 細かい中身：言い直し・言いかけ・つなぎの言葉・相づち・掛け合い。区切りごと
      切った所は一覧（時刻・切った中身・理由・前の一文 → 後の一文）に残し、ユーザーが「戻して」と言えるようにする
    why: 完成版は ①→② の2段階（2本目に途中の段階が残っていた）
    record: カットの一覧には、元の素材の時刻 → 残した区間 → 編集後の時刻の対応も残す。字幕・音・装飾はこの対応で置く
    why_record: 上司の10 ルール1・カットテロップ基礎工程から移した（2026-10-19 小川さん OK）
    why_iikiri: 2026-10-21 小川さん（1018 v002 の前半の手のカット・判断シート Q9）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    why_order: 2026-10-21 小川さん（判断の種類で分ける案に「OK」。1018 v002 の前半の手のカット）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    why_tsuketashi: 2026-10-28 小川さん（1025 v002 の前半で7か所・1026 v004 の前半で1か所を手で切った）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）

  remove:   # 切るもの（中身）。stages の②の3回の順に並べた：(1) 話の塊 → (2) くり返し → (3) 細かい中身
    # ── (1) 話の塊（stages の②の(1)）──
    - what: 脱線・例えの続き・くどい補足
      how: |
        要点を言い切った後に同じことを言い直す所、2つ目・3つ目の例え、例えの細かい続き、本題から外れた話（完成版は1分以上でも塊ごと切っていた）。話者自身が「この話長いな」と言った所も切る。人や物を短く並べる列挙（1つ1〜3秒の「ザッカーバーグが Facebook」「ジョブズが iPhone」）は、例えの続きに入れずに残す。
        ただし並べた例のうち、見る人が知らない専門の言葉が要る物（「裸でミラボレアスとかってやる」「タイムアタック」）は切り、誰でも分かる例（「一番難しい難易度のクエストを裸で狩る」「笛でやる」）を残す【試し中：1026 の1か所】。
        要点と最初の例は残す。切った後に「誰が・何をした結果この発言か」が通じるか確かめる（上司の10）。
        判断シートの候補の出し方：
         ・要点を言い切った後に30秒以上（目安）【試し中：AI が決めた数字】続く例は、1つ目の例でも、塊の候補として判断シートに出す。対象は、例の中で前の要点を言い直している例か、見る人が知らない物の説明から入る例（「Lステップとかわかるかな」）。
           切る時は、例の前の要点の言い直しも一緒に切り、要点の文が語尾まで残っているかと、次の問いが要点を受けているかを読む。例の中に置いた板・強調は、残す要点の文へ移すか外す
         ・聞き手が自分から持ち込んだ話題の掛け合い（「YouTube や情報商材の月100万」）も候補に出す
         ・人や物を短く並べる列挙は、まとめて1つの候補にせず、まとめの言葉（「そんなもんだったわけ」）の後に足した分を分けて出す
         推奨：
          ①例の中で前の要点を言い直していて、見る人が知らない物の説明から入る例は、1つ目でも「切る」（どちらか1つだけなら候補に出し、中身で決める）
          ②まとめの言葉の後に足した例と2回目のまとめは「切る」
          ③聞き手が自分から持ち込んだ話題の掛け合いは「切る」（本題へ戻る所まで塊で。入りの同意と終わりの相づちも一緒に）
          話し手の実績・数字が出る話は keep の「権威になる脱線」で決める
        実践・レビュー型は、先に video_type を見る（話し手の反応・評価・権威になる話は脱線でも中身）。自慢話・冗談は中身では切らない（no_chop.flow）
        仕組みの細かい説明は、その動画の本質（主題）に関わるかで決める。比べる相手や脇の道具の仕組みを長く説明して、そちらが中心になってしまっている所は、切るか結論の一言だけ残す（例 1017 の Obsidian の仕組み 1120〜1124）。本質そのものの仕組みなら、細かくても残す
      why_mechanism: 2026-10-19 小川さん（1017 の シーケンス 01 で Obsidian の仕組みの説明 19秒を切った件）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
      why_sheet: 2026-10-21 小川さん（1018 v002 の前半の手のカット・判断シート Q3・Q4・Q6）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: 撮影・構成の段取りの会話
      how: |
        「録画する?」「話戻してもらって具体で言ってもらえたらOK」「まとめすぎ?」「ここでCTA入れていいかも」など、視聴者に向けていない会話は必ず切る（完成版2本とも全部切っていた）。
        段取りではないもの：AI への声の頼み・読み上げ（実演の中身。02 の P17 で見せる。頼みの締めの言葉だけを残さない）、本編の頭の挨拶（名前・会社名。02 の P15）
        AI への声の頼みのうち、三上さんがプロンプトを入力して見せている所（実演の見せ場）は残す。ちょっとした頼みで、すぐ後の画面で何を頼んだか分かる所・頼みの中身がどうでもいい所は切ってよい。
        台本では AI が勝手に切らず、一旦残して「切る候補」として出し、判断する（例 1017 の「ビジュアルにまとめて アーティファクト使って」は切った）
        AI に作らせている途中の場面のうち、「〜ができました」の直前（間に別の話が無い）で選択肢を読み上げて中身を決めるやり取りと声の頼みは「切る」推奨、作り方を見せるために頼みの文を打って開くまでと、後ろに出来上がりが無い頼みは「残す」推奨。どちらも自動では切らず、判断シートで聞く【試し中：1025 の1か所】
      why_making: 2026-10-28 小川さん（1025 v002 の 8:56〜9:39 の 43秒を手で切った。指示の整理 A-4）
      why_ai_request: 2026-10-19 小川さん（1017 の シーケンス 01 で AI への頼みを切った件）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: 自社のサービスの宣伝
      how: 認定パートナーの仕組み・説明会の案内などは、本題から外れていれば塊で切ってよい（下の keep の CTA とは別）
      why: 2026-09-28 小川さんの直し（ワークの完全解説で、前半の認定パートナーの宣伝と説明会の案内 2分46秒、締めの認定パートナーの話を切った）。小川さん「消さないで入れておいていい」で確定

    # ── (2) くり返し（stages の②の(2)）：同じ物が2回以上ある所。何が重なっているかで項目を決める（残す方は各項目）──
    #   ・同じ結論・同じ説明・同じ例を2回以上言う（間に別の話が挟まっても、数分以内なら同じ話）→「同じ話のくり返し」
    #   ・迷いながら話して、前後で言っていることが違う →「迷いながら話して、答えが変わった所」
    #   ・問いへの答えや言い切りで、同じ強調の言葉・同じ意味の言い切りを重ねる →「強調のくり返し」
    #   ・章の入りを何度も言い直す →「章・話題の入りの言い直し」
    #   ・言いかけて、後ろで言い直す（1〜2音の言いかけ・行の頭の数語も）→ (3) の「言い直し・同じ言葉のくり返し」
    #   ・聞き手の2文以上の問いの中で、同じ前提を2通りに言う・「〜と思うんですけど」の前置きが2回ある → (3) の「聞き手の長い問いの中の言い直し・重なった前置き」
    #   ・話し癖の語の重なり（「まあまあまあ」）→ (3) の「フィラー（言いよどみ）」
    - what: 同じ話のくり返し（重複）
      how: |
        話者は多めに話してくれているので、全部載せるとくどくなる。同じ結論・同じ説明・同じ例を2回以上言っている所は、
        一番伝わる1回だけ残し、ほかは切る。最初か最後かでは決めず、ちゃんと言えていて分かりやすい方（言いよどみ・言い直しが少なく、その1回で何の話か分かる方）を残す。迷ったら、前の文が待っている物（理由・問いへの答え）として読める方を残し、残した方から次の文へつなげて読んで通じるかを確かめる【試し中：1025 の1か所】。言い終わった文（「〜わけ」）は言いかけとして扱わない。間に別の話が挟まっていても、近く（数分以内）なら同じ話として見る。
        聞き手の同意・言い換えのくり返し（「確かに それはそうかも」「ほんまにそうやと思うわ」）も一緒に切る。
        パッパッパと進むように。くり返しかどうか迷ったら切る側にして、カットの一覧に残す（「戻して」と言えるように）。
        ただし、条件・否定・問いと答え・人物の登場・因果（誰が・何をした結果この発言か）を担う所は、くり返しに見えても残す（切りすぎて、わけの分からない動画にしない）。
        脱線・自慢話・冗談そのものは残してよい（no_chop.flow）が、その中のくり返しは切る。
        一度先へ進んだ話の後に、前の時点へ戻って、前後で分かる中身をもう一度言う文も切る（昔と今を比べる組の片方は残す）【試し中：1025 の1か所】
      not_this: 見せ場の前の振り（keep）は重複ではない。振り → 伸びのリズムは残す
      check: 近くで同じ言葉・同じ結論が2回以上出る所の一覧（tools/find_repeats.py。コマンドは工程9）を読み、残したものには理由を書く。find_repeats は文字の一致で拾うので、言い方を変えたくり返し（「いかに競争しないか」と「いかに競争から逃げるか」）は拾えない。言い方を変えたくり返しは stages の②（言い切りの文に印を付けて前後を見る）で探す
      why: 2026-10-02 小川さん（astra v006）。話の筋を担う所を残すのは上司の10・G-02（2026-10-02 小川さん）。どれを残すかは 2026-10-19 小川さん（1017）。言い方を変えたくり返しは 2026-10-21 小川さん（1018 v002 の前半の手のカット）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: 迷いながら話して、答えが変わった所
      how: 前後で言っていることが違う所は、最後の確定版だけ残す。言い直す前の版と、それへの聞き手の反応も切る（例 astra「どうやってやろう→Fable」→「いや違うな もっと上かな」→「ゴールすら曖昧だったら Fable」は最後だけ残し、聞き手の「違いわかんないです」も切る）
      why: 2026-09-29 小川さん（astra v002 の修正指示）
    - what: 強調のくり返し
      how: |
        問いへの答えや言い切りで、同じ強調の言葉（「めっちゃ大事」）や同じ意味の言い切り（「これ鉄則なのよ」「これもう絶対」）を重ねている所は、一番伝わる1回を残し、ほかは間のつなぎ（あのね・なんかね）ごと声も切って、次の中身へつなぐ。
        どれを残すかは「同じ話のくり返し」のとおり分かりやすい方。同じ言葉で差が無い時は、最初のひと息（間を空けずに続けて言った分）を残す。
        三上さんがひと息で重ねる言い方（「一緒一緒一緒一緒」「めちゃめちゃそう」）は話し方の特徴なので残す。ひと息かどうかは声の谷で見る（目安：−50dB 未満が 0.2秒以上続いた後は別の言い出し【試し中：1018 の2か所から AI が決めた数字】。迷ったら残して判断シートに出す）。
        1回目で止めて2回目で言い切る溜め（keep_as_tame の「見え始める…見え始めるんだよ」）は、強調のくり返しとしては切らない。強調テロップは残した1回に置く。
        見つけ方：tools/find_repeats.py は「めっちゃ」を口癖として外し、8字未満の字幕は比べないので、強調のくり返しを拾えない。問いのすぐ後の答えと、言い切りの文のすぐ後を、stages の②で読んで探す
      why: 2026-10-21 小川さん（1018 v002 の前半の手のカット）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: 章・話題の入りの言い直し
      how: 章の入りを何度も言い直した所は、最後のきれいな1回だけ残す

    # ── (3) 細かい中身（stages の②の(3)）──
    - what: 言い直し・同じ言葉のくり返し
      how: |
        後ろの言い方だけ残す（例「で大体さなんかさ なんだろうな 大体なんか テキストっていっぱいあるじゃん」→「大体なんか テキストっていっぱいあるじゃん」）。
        1〜2音の言いかけ（「クロ…」→「Claude Code」）も、前後の言葉から「言い直した」と判断したら、言い直しとして前を切る（音の短さだけで機械的に切らない）。
        区切り（units）の1行や、台本で2つの区切りを1枚の字幕にまとめた行の頭に、言いかけが入っていることがある。行の頭の数語も、前の文と並べて読む【試し中：下の1つ目と3つ目は 1018 のそれぞれ1か所から。2つ目は 1025 でも切ったので印を外した】：
         ・同じ語の言いかけ（「この夢。（はい。）この夢が大事なの」）は、後ろの1回にする。区切りの中にある時は素材の秒で切る（cuts_plan の EXTRA_CUTS）。台本のメモに言いかけと書いたら、声も切る
         ・直前の文で言った物をもう一度指すだけの言葉（「これを一緒に見てくれる奴らが現れる。そういう奴ら、まあ、ユーザーさんとかかもしれない」の「そういう奴ら」）は切って、説明へつなぐ
         ・話題の頭だけ言って、途中に前置き（「これ、経済学の話なんだけど」）を入れ、言い直さずに続ける所は、直前の文で何の話か分かるなら、話題の頭（「結局、その、利益って、その、まあ、」）を切って前置きからつなぐ。前置きは残す
        切った後の文に主語・述語がそろっているか、直前の文で補えるかを読んで確かめる。強調のためのくり返し（めっちゃ大事 めっちゃ大事）は remove の「強調のくり返し」で決める
      why: 言いかけは 2026-10-05 小川さん「言いかけも切るというよりかは、前後を判断して何か言い直したんだなんですよね、あれは」（環境設定 v003 の 2:58「クロ」）
      why_head: 2026-10-21 小川さん（1018 v002 の前半の手のカット）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: 聞き手の長い問いの中の言い直し・重なった前置き
      how: |
        【試し中：1018 の1か所から】聞き手（創太くん）の2文以上の問いは、字幕（captions.long_question）だけでなく声も整える。問いそのものと、問いの主語・条件・問いの形（「三上さん的に」「マーケの目線で言うと」「Addnessとかアプリでも一緒なんですか」）は残す。
        同じ前提を2通りに言っている所と、「〜と思うんですけど」の前置きが2回ある所は、「同じ話のくり返し」のとおり分かりやすい方を残す。切った後の問いを読み、問いの意味が変わる時は残す。
        切った所のすぐ後の「あの」も一緒に切る。文の中の「その」「あの」「そう」は残す（remove の「フィラー」）
        問いの札（座布団）に入れた問いの後に、聞き手が足した一言で、札の問いに入っている物（「働き方とか含めて」）は切る【試し中：1026 の1か所】
      why: 2026-10-21 小川さん（1018 v002 の前半の手のカット）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: 言いかけて完結しなかった話
      how: 話が終わりきらないまま別の話に移った所はカットして、自然につながる所へつなぐ（例「だから当時もいろいろ使ってた…そこで出てきたテキストっていうのを」→「てかさ俺のチャッピーやばくて」）
    - what: 迷っている・準備している所
      how: 声が小さい、画面の中を探している、「うーん」「なんか〜ないかな」が続く所、画面を見ての独り言（字幕が無く前後とつながらない物）。声の大きさと前後の文脈で判断して、話の続きにそのままつなぐ。わざと迷っている所が面白い時は残す
    - what: 思い出せない・探している所
      how: 「なんだっけ…パッと出てこない」、画面でボタンやファイルを探している所は切り、見つかった所・思い出した所へつなぐ
    - what: 打ちかけてやめた入力
      how: 画面で何かを入力しかけてやめ、別のものを入力し直した所は、やめた方をカットする（例 アドネスの情報を打ちかけた所）
    - what: つなぎの決まり文句・前置き
      how: |
        無くても意味が通る話の頭のつなぎや前置きは、字幕にせず声も切る（例「というところで」「ということでなんですが」「てかもっと言うと」、話の頭の「確かに」「そういう」）。
        後ろに区切りの言葉が続く時（「というところで じゃあ」の「じゃあ」）は、前のつなぎは要らない。
        ただし、話の区切りを知らせる一言だけの所（keep の「ということで これで…」）と、問いへの答えの「確かに」は残す。迷ったら切る候補として出す
      why: 2026-10-19 小川さん OK（1017 v008 の手のカット）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: フィラー（言いよどみ）
      how: |
        フィラーは「言いよどみ（声も切る）」と「話し癖（声は残す）」に分ける。語の種類と、文のどこにあるか（文の頭・文の中・カットのつなぎ目）で決める。全部・1分に何回のような数では切らない。字幕からは、どちらも抜く（captions.base.filler）。
        声も切る：
          ・えー・えっと・えーと・あのー（伸ばす）・うーん・あー（問いのすぐ後の考える声「うーんと」は残す）
          ・三上さんの「あの」のうち、文の頭の物と、カットのつなぎ目に接する物（文の中の「あの」は残す）
          ・言葉を探す決まり文句（「なんていうんですかね」）【試し中：1026 の1か所】
          ・文の頭の「だから」で、省いても前の文とのつながりが分かる物（「正味。（なんか だから、）多分OpenAIとかも」）【試し中：1026 の1か所】
          ・中身（問い・前の話・掛け合い）を切って、受けていた文が消えたつなぎ目に接する「やっぱ（り）」「まあ」（切った所のすぐ後の文の頭・すぐ前の文の終わり。例 掛け合いを切った後の「やっぱだって」）。言いよどみ・言い直し・相づち・間だけを切ったつなぎ目では声を残す（例「えー」を切った後の「まあ、やっぱり売れないアプリ」）。言い切りをやわらげる「まあ」（「まあ、ユーザーさんとかかもしれない」）もつなぎ目で残す。find_fillers はつなぎ目の種類を分けずに「声も切る」に出すので、候補を読んで決める
          ・言いかけ・言い直しの一部になっている話し癖（「まあ いゆ…」の「まあ」・「なんか なんか呪文が」の1回目）と、同じ語の重なり（「まあまあまあ」）
          ・話し癖が間をはさんで続き、中身の語へ行く前に止まっている所の話し癖（「ここにさ、じゃあ、（間）まあ、こういうコップ」の「じゃあ」「まあ」）【試し中：1018 の1か所から】
          前後の言葉は残したまま、そのフィラーだけを切る。切る位置は声の谷（no_chop.sound）。谷が無く前後の語と続いている所は切らない（字幕から抜くだけ）
        声は残す：なんか・やっぱ（り）・まあ・ですね・ちなみに・その・ちょっと・結構・なので・だから（前の文を受けていて、省くとつながりが分からなくなる時。受けていた文を切った時は no_chop.flow の「切った後のつなぎ目を読んで確かめる」）・文の中の「あの」・話す人の「はい」。話す人の調子とリズムを作っているので切らない（聞き手の相づちの「はい」は下の「聞き手の相づち」）。
        三上さんの「なんか」が別のつなぎの言葉と重なった物（「なんかこう」「なんかもう」）は、切る候補として一覧に出す【試し中：1025 の指示 A-3】
        見つけ方：今の文字起こしにはフィラーがほとんど出ない。工程3 で tools/find_fillers.py を動かし（フィラーも書き起こす文字起こしと、残している所のフィラーの一覧）、切る候補を全部読んで決め、EXTRA_CUTS に理由つきで書く。書き出した後も同じ道具（--mp4）で、声も切る種類が残っていないか確かめる。
        find_fillers の120秒ずつの文字起こしには、伸ばす言いよどみ（えー・あのー）・つなぎ目の話し癖（じゃあ・まあ）は出ないことが多い。50msごとの声の大きさが −43〜−49dB ほど（目安）【試し中：1018 の2か所から AI が決めた数字】のまま 0.2秒以上平らに続く所は、no_chop.flow のつなぎ目の音の確かめと同じやり方（前後2〜4秒の文字起こし）で確かめる。
        聞き手の話し癖の後に0.5秒以上の間があり、間の後で言い出し直している所（「マーケの目線で言うと、なんか、（0.9秒の間）そう、とにかく」の「なんか」）は、切る候補として一覧に出して決める（1018・1025 で1か所ずつ切った。間の長さは、AI が詰める前の素材で測る）
      why: 2026-10-20 小川さん（AI動画編集 v006・v008 と判断シート。材料は小川さんの v007 の手の直しと完成版2本）・2026-10-21 小川さん（1018 v002 の前半の手のカット・判断シート Q1・Q8）（言葉と数字は 実例/根拠と実例.md の「フィラー」）
      why_dakara: 2026-10-28 小川さん（1026 v004 の 11:44「なんか だから」を手で切った・指示「文の頭の『だから』は、省略しても意味が通じる場合だけ省く」・判断シートの答え。「なんかこう」は 1025 の指示 A-3）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: 聞き手の相づち・細かいやりとり
      how: |
        「確かに」「はい」「わかりました」「ヤバイっすね」だけの所、話の流れに関係ない聞き返しは切る。聞き手の質問・話を進める一言・大事な発言は残す。
        区切りに出ない短い相づち・返事（はい・うん・はいはい・あ、そう・あ、そうなんですよ）は、置き場所で決める（短い声は、文字起こしと声の大きさでは誰の声か決められない）：
         ・切る：言いかけの後に入った物は、言いかけと一緒に切る（「この夢｜はい｜この夢が大事なの」）
         ・切る：切る中身（問い・聞き返し・掛け合い・言い直し・足した例）とつながっている物。残す文の後の「はい」も、すぐ後ろの中身を切る時は一緒に切る（「そんなもんだったわけ。｜はい。ジェフ・ベゾスが…」「儲かんなくなる。｜はい。結局、その、利益って…」、切った掛け合いの入りの「あ、そうなんですよ」）
         ・切る：三上さんの声と重ならずに単体で出ている物は、三上さんが並べている途中（「欲しいとか。はい。なんか」）・三上さんの文の途中（「椅子作るんっていう｜はいはい｜思わん?」）・言い切りの後（文と文の間）でも切る。聞き手の文の途中に三上さんが入れた「うん」も切る
         ・残す：三上さんの声と重なっている物と、切ると次の声が急に始まって聞こえる物（1026 の 10:12「はいはい」）。迷ったら残して一覧に出す
         ・前後のどちらかに、部屋の音の高さまで下がる谷が無く、三上さんの声とくっついている所は切らない（字幕から抜くだけ）
        切る端は no_chop.sound で決める（相づちと一緒に三上さんの小さい語尾を切らない）。切ると決めた区切りの返事の声が残っていないかは captions.base.check の⑦（tools/check_stray_words.py）で確かめる。
        見つけ方は no_chop.flow の「切った後のつなぎ目を読んで確かめる」の、つなぎ目の音の確かめ。フィラーも書く設定は促す言葉に「はい。」が入っているので、0.2秒より短い音の「はい」は、言いかけの1音や息の見込みもあるとして声の大きさと並べて読む
      why: 2026-10-21 小川さん（1018 v002 の前半の手のカット）・2026-10-28 小川さん（1025 の判断 E-1・1026 の判断シート Q2 A で「文と文の間・並べている途中でも切る」に変えた）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    - what: うまく機能していない掛け合い
      how: |
        聞き手の問いとその答え（掛け合い）は、機械的に切らない。掛け合いがうまく機能しているか（話が前に進むか・三上さんの考えやキャラが出るか）で決める。
        切る例：聞き手が見当違いの質問をして、三上さんがすぐ否定している所。言い換えて確かめるだけの問いも、それだけでは切る理由にしない。
        ただし、聞き手が言い換えて確かめる問いに、三上さんが問いの言葉をくり返すだけで新しい中身が無い時（「世界に行きたいって感じですか」→「世界に行きたい」）は、確かめの問い・くり返し・聞き手の「なるほど」・つなぎの「やっぱだって」ごと切り、元の問いから本当の答えへつなぐ。三上さんが新しい中身を足して返す時と、新しい対象を持ち込む問い（「Addnessとかアプリでも一緒なんですか」→「一緒一緒一緒一緒」）は残す
        聞き手の確かめの問いに三上さんが答えても、その答えの中身をすぐ後の三上さんの文がもう一度言う時（「Addnessは目的を持ってるんですか？」「そうだよ」…の後に「Addnessを使えば 全人類が幸福になる方向に」）は、問いと答えを丸ごと切り、元の話からすぐ後の文へつなぐ【試し中：1026 の1か所】。
        聞き手が持ち込んだ仮の話や評価・感想への答えは、三上さんが中身を足していても、話が先へ進まなければ問いと答えごと切る（「一歩間違えて世界を滅ぼすっていう方に行ってたら…ってこと？」、画面で始めた物の使い方の途中に挟まった評価のやり取り）【試し中：1025・1026 の1か所ずつ】
        切る時は問いと答えを丸ごと切る（片方だけ残さない。no_chop.flow）
      why_kakeai_2: 2026-10-28 小川さん（1026 v004 の 9:15・14:15、1025 v002 の 9:50〜10:06 を手で切った・判断シートの答え）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
      why: 2026-10-19 小川さん（1017 の シーケンス 01 で掛け合いを切った件）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
      why_oumu: 2026-10-21 小川さん（1018 v002 の前半の手のカット・判断シート Q2）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）

  keep:   # 切らないもの
    - what: 事実と違う説明
      rule: 説明が事実と違うかどうかを理由に切らない。間違いに気づいたら、切らずに報告で聞く。話者の言い間違い（言い直しが無い所）も、字幕だけを正しい言葉に書き換えて直したことにしない（報告で聞く。上司の10 ルール1）
      why: 2026-09-27 小川さん「間違ったかどうかは人間が見ないと分からないので、入れない方がいい」（一度入れた wrong_info を取り消した。Addness の記録）
    - what: CTA（特典・概要欄・公式LINE・1on1 の案内）
      rule: 上の remove に当たっても切らない。特典の受け取り方は必ず板（CTA のボード。02 の P14）でも出す
      why: Codex からの引き継ぎ「CTA は絶対にカットしない」。自社のサービスの宣伝は別（remove）
    - what: 話の区切りを知らせる一言
      rule: 「1つ目はここで終わり」「次へ行く」が分かる締めや入りは残す（「ということで これでもう結局クロードコード」「ということで はい よいしょ」「これいいよ」）。切ると次の話へいきなり飛ぶ
      why: 2026-09-27 画面解説 v009 で小川さんが戻した所
    - what: 最後の挨拶（「バイバイ」・手を振る）
      rule: |
        本編の頭の挨拶（02 の P15）と同じく、最後の挨拶も切らない。手を振り終わる所まで残す。
        声が小さいと間・無音と見なされて落ちやすい（1015 v006 の「バイバイ」は −49dB で切れていた）。最後の30秒は、字幕とカメラのコマで挨拶が残っているかを必ず見る。小さすぎる時は、そのクリップだけ音を上げる（1015 v007 は +8dB。耳で確かめてもらう）
      why: 2026-10-16 小川さん（1015claude project開設 v006 の 26:07）「バイバイが無い。あると思うので、うまく追加して」
    - what: 見せ場・要点の前の振り
      rule: 振りがあって次で伸びるリズムを残す（「そうなんだよね 知識ってやっぱりいろいろマルチだからさ」）。要点だけをつないで「ドドドドドン」と続けない。テロップも含めた話全体で同じ
      why: 2026-09-27 同上
    - what: 権威になる脱線
      rule: 話し手・聞き手の実力や実績が具体的に伝わる話（数字・結果・比べた話）は、本題から外れていても残してよい（どこまで残すかは程度の問題。例 Google 社員の話）
      why: 2026-09-27 同上

  no_chop:   # ブツッとさせない（2026-09-28 小川さん。言葉は 実例/根拠と実例.md の「08 の cut の経緯」）
    sound:   # ① 音のブツッ＝つなぎ目（声の途中で切れる・声の途中から始まる）
      rule: 声の途中で切らない。前の声は言い終わってから切り、次の声は出だしの少し前から入れる
      how: |
        切る位置は字幕の境目ではなく、声の大きさ（波形）で決める。音声認識の字幕の境目は声とずれていることがある（数フレーム早いことが多い）ので、字幕の境目が音とずれている所は、先に字幕の境目を音に合わせてから切る。
        波形の見方：ffmpeg で 16kHz に書き出し、50ms ごとの大きさを見る。
        決まった音量の線（−45dB など）や秒数では決めない。その録音の部屋の音の高さ（声の無い所の音。録音ごとに測る。1025 は約 −84dB・1026 は約 −74dB で、1本ごとに違う）を基準に、波形の形で決める。
        切り終わり（前の声）：声の山が、部屋の音の高さまで下がりきった所（語尾・息の抜けまで）で切る。下がる途中（坂の途中）で切らない。小さい語尾・伸ばした語尾（「持ってきたんでー」）も、部屋の音より高い間は声として残す。
          中身（言い直し・くり返し）・笑い・間を切る時の切り始めも同じ（1025 v002 は「やりましょう〜」「っていうと」「いけなかったり」の坂の途中から切っていて、小川さんが戻した）。
          残す語の文字起こしの終わり（区切りの文字起こしとフィラーも書く文字起こしの遅い方。cuts_plan の TAIL）より前も切らない。声が小さくても、文字起こしに語がある時刻の中は切らない
          言い終わらない（下がりきらないまま次の語へ続いている）所では切らない。そこでは切らず、前の語の切れ目（下がりきる所）まで戻すか、文の終わりまで残す。
          笑い声や相手の声が重なって波形が揺れている所は、波形では語尾の終わりが分からない（1026 の「あって」の「て」・4:47 の詰めすぎ）。語の時刻で決め、聴いてもらう一覧に出す
        入り（次の声）：声が上がり始める所の手前から入れ、上がり始め（言い出しの坂）を欠かない。前の語から続いている（下がりきっていない）所から入らない。
          伸ばした言いよどみ（えー・あのー）の後から入る時は、言いよどみの平らな声（部屋の音より高い）が終わり、次の語の声が上がり始める所から入る。文字起こしの語の頭の時刻は、言いよどみの頭の方へ 0.14〜0.19秒早く出ていた【試し中：1018 の3か所】
        語頭・語尾を欠けさせない（上司の10）。
      check: tools/check_chops.py で「前が切れている」「後ろが途中から」が0件（声の WAV は tools/audible_onset.py extract で作る）。1件でもあれば直してから次へ
      why: 2026-09-28 小川さん（ワークの完全解説 v003 の直し）・2026-09-29 小川さん（入りと切り終わりの数字を1本化）（数と実測は 実例/根拠と実例.md の「ブツッ（no_chop）の経緯」「つなぎ目の実測」「08 の cut の経緯」）
      why_shape: 2026-10-28 小川さん（1025 v002 で 9か所・1026 v004 で 4か所の語尾を手で戻した「切りすぎ問題、なんとかしたい」。「秒数で定義するのが良くない。俺は波形を見て、耳で聞いて切っている」→ 波形の形で決める案に「合ってる」。前の「−45dB より下がり切ってから 0.1秒弱」「2〜3フレーム前」から変えた）
      listen: 切った所の音のつながり（プツッという音・息の不自然さ・語の頭と終わりの欠け）は、AI は波形で見る（AI は音を出さない）。耳での確認は小川さんに頼み、聴いてもらうまでは「未聴取」と書く
      why_listen: 上司の G-02「カット後のつながりを実際に聞く」を、AI が音を出さない決まり（CLAUDE.md）に合わせて移した（2026-10-19 小川さん OK）
    flow:   # ② 話のブツッ（つながりが唐突）
      - what: 塊の途中だけを抜かない
        rule: |
          話は「フリ → 本題 → 反応・オチ」の塊でできている。くり返しや長い話を切る時は、塊ごと切るか、塊ごと残す。
          塊の中で抜いてよいのは、言い直し・言いよどみ・同じ語の重なりのように、抜いてもその文がそのままつながるものだけ
        why: v003 で AI が比べる場面・締めの話から一言ずつ抜き、小川さんが塊で切り直した（例は 実例/根拠と実例.md）
      - what: フリと反応・オチを離さない
        rule: 反応（「一緒やん」「ほらね」「すごい」）を残すなら、その対象（前の発言・画面）も残す。オチを残すならフリも残す。どちらかを切るなら両方切る
      - what: 切った後のつなぎ目を読んで確かめる
        rule: 切った所ごとに「前に残した一文 → 後に残した一文」を続けて読む
        check: |
          ・接続の言葉（だから・だって・でも・なんだけど・そうすると）が、前の文をちゃんと受けているか。判断シートや塊で切ったつなぎ目にも当てる。受けていた文が切った中にある時は、接続の言葉も声ごと切る（例「3年ずっと赤字だった。（だから、）例えばさ、椅子を」「（やっぱだって、）せっかく作るならさ」）。前の文を受けている「だから」は残す
          ・指す言葉（それ・これ・こっち・そこ）が指すものが残っているか
          ・話題がいきなり変わっていないか（変わるなら、区切りの一言が残っているか。keep）
          ・初めて出る人や物の紹介、問いへの答え、「〜するつもり」の後の「どうなったか」が切れていないか（上司の10「誰が、何をした結果この発言か」）
          1つでも引っかかったら、塊ごと切るか戻す。カットの一覧の「前の一文 → 後の一文」の列で、ユーザーも読んで確かめられるようにする
          読むだけでなく、音でも確かめる。組み立てた後、つなぎ目の一覧（_work/joins_vNNN.tsv）に、つなぎ目ごとの前後2〜4秒をフィラーも書く設定で文字起こしし直した文字と、50msごとの声の大きさの列を足し、つなぎ目の前後0.5秒に残っている物を全部読む（区切りの文字起こしと find_fillers の120秒ずつの文字起こしには、短い相づちと言いよどみがほとんど出ない）：
           ・台本に無い短い声（相づち・言いよどみ・切った語の頭や終わり）→ remove の「フィラー」「聞き手の相づち」で決める。切ると決めた区切りの声の残りは captions.base.check の⑦でも出る
           ・つなぎ目で聞こえる無音（両側を足した長さ）→ pauses の rule のとおり、平らな所を切る。溜め（keep_as_tame）として残した所は分けて示す
           ・欠けた語尾（字幕の語尾「〜てる」「〜のよ」が聞こえない）→ 戻す。全部のつなぎ目で、字幕の最後の語と書き起こし直しの最後の語を比べ、聞こえない所を一覧にする。字幕と書き起こしで語尾が違うだけの所は、耳で確かめる候補にする（欠けているか分からないまま自動で延ばさない）
           ・台本に無いのに残した声 → 切るか、残すなら字幕を付ける（字幕の無い声を残さない。1025「いや あのね」・1026「わかんないけど」）
           ・切った中身とひと続きだった物の残り（言いかけを切ったつなぎ目に残った吸う息・前の言い足し・後ろの「で」「じゃあ」）→ 次の中身の語の頭の手前まで一緒に切る。残した前の文を受けている接続の語（「で、市場選びが」「だから」）は残す【試し中：1025 の3か所】
        why_sound: 2026-10-21 小川さん（1018 v002 の前半の手のカット）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
      - what: 自慢話・冗談・脱線は、中身では切らない
        rule: 切るのは、残すと前後のつながりが悪くなる時だけ（本題の説明の途中に挟まっていて、戻る所でブツッとなる時。例 v003 の「詳しいでしょ／しかも俺って実は記憶力めっちゃ良くて」）
        why: 小川さん「自慢話とかも、自慢話として入っていてもよかった」
      - what: 板・テロップで見せているものを、声でくり返さない
        rule: 合言葉（「導入支援0927」「セットアップ0927」）の読み上げ・別の動画の案内は、板（CTA のボード）やサムネイルで見せ、声は切ってよい（別の動画の案内は、字幕を板にしてサムネイルを添える）
        why: v003 で小川さんが切った
      - what: 文を言い終わるまで入れる
        rule: |
          残す文は語尾（「〜らしい」「〜です」「〜なのよ」）まで入れる。声の途中で切れていなくても（check_chops が0件でも）、文が途中で終わって聞こえる所はカットの終わりを延ばし、次の文へのつなぎ目を読み直す。
          区切り（units）に語が抜けていると、語尾がカットに巻き込まれる（1015 v007 は区切りの補いの表＝units_patch で補った）
        why: 2026-10-16 小川さん（1015claude project開設 v006 の 24:29。「でこれを17言語作った」の「らしい」が切れていた）「急に切れてる。文章が突如切れてる。カットを延ばして見直して」
      - what: 締めの長い話
        rule: 締めのメッセージは、核の一言（例「その先に誰かに何かを与えられる人間になってほしい」）と、それにつながる1〜2文だけ残し、長い前振りと宣伝は塊で切る
        why: v003 で小川さんが33秒切った

  pauses:   # 間（切らずに残す部分の中の間）
    rule: |
      間は秒数ではなく波形の形で決める。前の声の語尾が下がりきる坂と、次の声の言い出しの坂は残し、その間の平らな所（部屋の音の高さだけが続く所。no_chop.sound）を切る。文と文・問いと答え・強調の前後・カットのつなぎ目のどこでも同じ。
      平らな所でも残すのは、中身で決めた所だけ：下の溜め・顔の演技・問いの札を読む間・最後の挨拶。
      文の途中（1つの字幕の中）の平らな所は、その話し手のふつうの息継ぎより目立って長い所だけ切る【試し中：1026 では文の途中を1か所詰め、1025 では文の途中の短い息継ぎを残していた】。
      笑い声や相手の声が重なって波形が揺れている所は、平らな所ではない。切らずに、聴いてもらう一覧に出す（1026 の 4:47 は三上さんの笑いが重なって詰めすぎていた）
    measure: 部屋の音の高さと坂は、道具が録音ごとに測る。道具の中の数字は、それを見つけるためにだけ使い、ルールでは間と語尾を秒数で決めない
    why_rule: 2026-10-28 小川さん（1025 の指示 A-2・1026 の判断シート Q3 A。「秒数で定義するのが良くない。俺は波形を見て、耳で聞いて切っている」→ 波形の形で決める案に「合ってる」。前は「0.5秒以上の間は詰める。つなぎ目で聞こえる間は 0.1秒前後、長くても 0.3秒」）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    keep_as_tame: |
      0.5〜1.0秒残してよいのは「溜め」だけ：オチ・言い切りの前（「見え始める…見え始めるんだよ」）、例え話・再現の中の擬音の後（「ピュッてな」「えぇって」「パンって」）
    after_punchline: オチのあとの平らな所も、ほかの間と同じに切る（前は「言い終わりから 0.4秒ほど残して詰める（例「寂しい」のあと）」）【試し中：1026 の1か所】
    why_after_punchline: 2026-10-28 小川さん（1026 v004 の 3:06「ママやばい」の後に AI がオチの後として残した 0.5秒を手で切った「なんでこれ残したの」・判断シートの答え）
    keep_face: |
      話の途中で2秒以上声が無い所は、間を詰める前にカメラのコマ（0.5秒ごと）を見る。とくに言葉が途中で抜けている所（「〜は」の後に「って」で受ける中身が無い、「〜ってなる」の中身が無い）は必ず見る。
      顔や手（身振り）で何かを表現している（顔まね・表情のボケ・手で形を見せる）なら切らず、表情・動きが一番出ている所を溜めとして残す（目安 1.5〜2秒。字幕ごとに秒を決める）。迷ったら残し、カットの一覧に「戻せる」と書く。見せ方は 02 の P18。
      候補の一覧は tools/find_silent_acts.py（字幕の間の声の無い2秒以上を出し、言葉が抜けている所を上に並べ、カメラのコマを並べた画像を作る）。カット（工程3）の前に見て決める
    why_keep_face: 2026-10-04・10-05 小川さん（環境設定 v001）（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    odd_silence: 言い出す前や言い終わった後の長い無音（変な間）は、この数字まで詰め、詰めた所は一覧に残す（2026-09-27 ユーザー指示で「確認してから」から変更）
    screen: 画面共有で黙って操作している間は、画面で結果が出る所（話し出す直前）だけ短く残して詰める（完成版は画面を探す52秒を切っていた）
    laugh_gaps: |
      笑い声・咳・言葉の途中の間も詰める：文字起こし2つ（区切りを作った物と、別のモデルの物）のどちらにも言葉が無い 0.5秒以上の所は、音があっても（笑い・息・相づち）無音の間と同じように詰める。
      切る点は 10ms の大きさの谷（言葉の終わり＋0.04秒・次の言葉の頭−0.06秒の近く）。谷が無く、音が次の言葉までつながっている所は切らない（声の途中で切れる＝no_chop）。
      残す：オチ・言い切りの強調の前の溜め 0.5秒（keep_as_tame）・顔や手で演じている所（keep_face）・問いの札を読む間。
      図解（09）にする区間の中も、工程3 でほかの所と同じに詰める。図解は詰めた後の声に合わせて組む（工程6）。図解を組んだ後に詰める時は、部品の出るコマを付け替えて描き直す（1018 v004 の _work/remap_zukai_v004.py の形）（2026-10-21 小川さん・判断シート Q5）。
      候補の一覧は tools/find_laugh_gaps.py。決めた物は cuts_plan の EXTRA_CUTS に、理由（笑い・間・どの字幕の後か）をつけて書く
      区切りの文字起こしに1〜2字（「で」）しか無い所も、0.5秒以上あれば、no_chop.flow のつなぎ目の音の確かめと同じやり方（前後2〜4秒の文字起こし）で見る。相づちや崩れた言葉（「あ、そう」「でーん」「はいはい」「いーん」）しか出ないなら、言葉の無い間の候補にする（find_laugh_gaps は、語が1つでもあると候補にしない）。溜め・再現の擬音（keep_as_tame）か、相づちの混ざった音の塊かは判断シートで聞く。台本で字幕を出さずに声だけ残す形（「289-|」）は、残す理由を台本の行のメモに書いた時だけ使う
      **工程3（カット）で毎回動かし、候補を全部読んで、切るか残すか（残すなら理由）を決める。動かしていない版は基礎品質の合格にしない**（2026-10-19 小川さん OK。1017 v008 の手のカット）
      find_laugh_gaps は文字起こしに語が無い所しか拾わない（無音に文字起こしが語を書くと見落とす）。組み立てた版ごとに tools/find_silence.py（声の大きさだけで見る）を流し、声の無い所 1.0秒以上の「切る候補」を0にしてから渡す（図解の中も詰める。残してよいのは最後の挨拶だけ）（2026-10-21 1018 v007：画面で Claude Code の処理を黙って待つ 14.7秒が v001 から残り、公開の直前に小川さんが見つけた「２度と起きない様にしろ」「図解も詰めるよ」）
    laugh_no_change: |
      笑っている間に画面が何も変わらない（同じ顔のまま笑い声だけが続く）のは冗長。笑いは切るか、残すなら「www」のテロップ（01 の笑い＝ヒラギノ白シャドウ）を起こして画面を変える。冒頭（最初の数分）は離脱されやすいので切る寄り
    why_laugh: 2026-10-17 小川さん（セキュリティについて v003 の Loom）。ルールに足すのは 2026-10-17 小川さん OK（言葉と経緯は 実例/根拠と実例.md の「08 の cut の経緯」）
    why: 完成版2本の実測（聞こえる間は完成版の90%が 0.30秒以内・2本目は 0.25秒以内。0.5秒以上の間は33分で16か所・2本目は2か所）。実例/カット調査/カット調査.md
    kinds: 声の無い所は「音が抜けている（音声の欠落）」「自然な間」「録画の待ち」に分けて扱う。秒数だけで切らず、その間に画面で何が起きているかを見る（上の screen・keep_face）
    why_kinds: 上司の10（2026-09-12）から移した（2026-10-19 小川さん OK）

  no_slivers:   # 切れ端を作らない
    rule: 映像（カメラ・画面・ワイプ）にも声にも、0.2秒（30fps で6フレーム・60fps で12フレーム）より短い切れ端を作らない。素材がそのまま続いている所でも、タイムラインに 0.2秒未満のクリップとして分かれていれば数える（手で直す時に切れ端に見え、別のトラックの絵がその分け目で替わると一瞬前の絵が残る）
    how: |
      カメラ↔画面の切り替え・ワイプの出入りは、カットの切れ目にそろえる（07 の switching）。切れ目から5フレーム以内に切り替えが来たら、切れ目のほうへ寄せる。
      カットで残る部分が 0.2秒未満になる時は、その部分ごと切るか、隣のカットと合わせて残す（話がつながる方を選ぶ）。2つのカットの間に、言葉の無い短い区間（平らな所か、切った語の端の音だけ）が残ったら、1つのカットにまとめる【試し中：1025 の1か所】
      字幕・SE・BGM・右上の話題の札・ロゴの札のトラックにも、数コマの切れ端と穴を作らない。カットで声を戻した・詰めた所（手の直しを含む）は、その上の札と BGM を切れ目なく置き直す
    check: 組み立てた後に tools/check_slivers.py（2026-10-28 から、素材の続く所の分け目・上に重ねた絵の頭と終わりのずれ・声と BGM のトラックも数える）で0件（1件でもあれば直してから次へ）
    why_2: 2026-10-28 小川さん（1026 v004 に2〜3コマの切れ端が3つあったのに検査が0件と出ていた「検査が本当に働いてるのかな」・1025 の指示 A-5・どちらも手で詰めた所で BGM と右上の札が切れた）
    why: 2026-09-27 ユーザー指示「1フレームだけあるのは絶対やらない。画面共有をまたぐ所ですごく多く、カクッとして気持ち悪い」。お手本2本は2フレーム以下が0件（実例/根拠と実例.md）

  edit_points:   # 編集点（素材を切らない所の分け目）
    rule: 素材を切らない所でも、字幕の区切りに映像と音声の編集点を置く（captions.timing）。編集点を入れたこと自体で、ズーム・位置を変えない（編集点のたびに100%へ戻さない・音のフェードを足さない。強調のズームの出入りは 04 のとおり）。字幕だけ区切って、本編のクリップを長い1本のまま残す形は不合格
    why: 上司の10（2026-09-12 AV_EDIT_POINTS）から移した（2026-10-19 小川さん OK）

  reorder:   # 並べ替え
    rule: 前提の説明が後から出てくる時は、前へ移してよい。本人が言っていない問いと答え・因果は作らない（上司の10）
    why: 完成版 12:09（撮影中の聞き手の指摘どおりに移していた）
    logic_check: |
      カット（工程3）の段階で、元の順番のまま並べると話の論理の展開がおかしくなる所を先に探して直す（並べ替える・どちらかを切る）。
      例：離れた所で同じ具体の話をもう一度していて「さっきの話をもう一回話した」ように見える所、前提や結論が後から出てくる所、説明より先にその言葉を使っている所。
      確かめ方：組み立ての前に、残す区間の流れ（tools/flow_table.py の表）を頭から読み、「初めて見る人がこの順番で通じるか」を見て、おかしい所を一覧にして直す（工程9 の「考えずに分かるか」より前に）
    why_logic_check: 2026-10-05 小川さん「そもそも論理の展開として、絶対これって元の状態だとおかしいと思う。そういうのをまずちゃんと事前に見つけ入れることが大事」（環境設定 v003 で、離れた後ろのサッカーのたとえを 1:50 の皿の話の後ろへ移した件）
    spoiler: |
      答えを先に見せない（ネタバレしない）。元の順番で、答え・オチ（数字・結論）が説明やフリより先に出ている所は、説明・問いを先に、答えを後ろへ並べ替える（例 1015 のモノポリーGO：ゲームの説明 →「いくらだと思う？」→「月300億」）。
      同じ結論を後でもう一度、説明つきで言う時は、先に言った一言を切る（例 1015 の 14:51「AIをマネジメントできるやつの2人しかない」を切り、15:08 の説明で初めて出す）。
      冒頭ハイライト（02 の P15）・強調の出る瞬間（01 の「出す時刻」）・座布団の答え（02 の P11 の text）と同じ考え：答えは、話す人が言った瞬間に初めて見せる。並べ替えるのは言った言葉だけ（上の rule：言っていない問いと答えは作らない）
    why_spoiler: 2026-10-16 小川さん（1015claude project開設 v006 の 8:21・14:51）「『このゲーム何かっていうと』の方がいい。ここでネタバレしちゃってて面白くない」「ここはカット。ネタバレになっている。後でもう1回言うんだよね」
    review_big_moves: 後ろの話を前へ移す所・同じ所を2回使う所・長く省いた所は、ふつうの間詰めと分けて一覧にし、「前に残した一文・切った（移した）中身・後に残した一文」を並べて読んで確かめる
    why_review_big_moves: 上司の10（2026-09-25 の改善候補）から移した（2026-10-19 小川さん OK）

  after_change:   # 尺が変わった時
    rule: 尺が変わったら、後ろの字幕・SE・ズーム・図解・BGM・マーカー・トランジション（ClipTrack/TransitionItems）を全部ずらし、全部を再検査する
    why: トランジションを残すと、別のクリップが写り込んだりクリップが消えたりする（画面共有装飾で分かったこと）
    no_move_in_decoration: 装飾（工程5〜8）では、字幕の時刻やカットを動かさない。動かす必要が出たら工程3・4 に戻り、字幕と後ろの装飾を合わせ直す
    recheck_scope: 一度確かめた所は、同じ入力なら確かめ直さない。直した所と、その影響が及ぶ所（後ろの字幕・音のつなぎ目・装飾の位置）だけ確かめ直す。尺が変わった時は、その後ろが全部「影響が及ぶ所」（上の rule）
    why_decoration: 上司のカットテロップ基礎工程（2026-09-25 本人指示の順番・確認の絞り方）から移した（2026-10-19 小川さん OK）

captions:   # 字幕（工程4）
  base:
    rule: 通常字幕は、このファイルの captions が正。フィラーは表示しない
    filler: |
      フィラー（えー・あの・まあ・うーん・えっと）は字幕に書かず、フィラーだけの字幕も作らない。その間は前の字幕を出したまま（timing）。
      冒頭など前に字幕が無い所は、本文の最初の語が聞こえるまで出さない。
      フィラーかどうかは中身で決める（答えの「はい」・気持ちを表す相づちは残す）。字幕からフィラーを抜くことと声を切ることは別で、声を切るのは cut に当たる時だけ（言いよどみは cut.remove の「フィラー（言いよどみ）」で声も切る。話し癖は声を残す）
    check: |
      基礎品質に合格するまで、工程5 に進まない。AI が自分で確かめる所で、毎回ユーザーの OK を待つ所ではない。基礎品質は次の7つ：
      ① 声の途中で切れていない・切れ端が無い（check_chops・check_slivers が0件）
      ② 切った所の前後が通じる（cut.no_chop.flow）
      ③ 全字幕の頭が聞こえ始め（timing。「要確認」は合格に数えない）
      ④ 話者が全部決まっている（speaker）
      ⑤ 誤字・固有名詞・句読点・フィラー・1行17字（この captions）
      ⑥ 字幕にも「切る」にも入っていない言葉の声が残っていない（話し癖のフィラーは除く。言いよどみが残っていたら切る。例 1017 の「今」「だね」）
      ⑦ 「切る」と決めた言葉の頭や終わりの声が残っていない（例 1017 の「7」「と」「という風に 押して」「して」）
      ⑥⑦は tools/check_stray_words.py の一覧を全部読み、残っている声は切る（台本・EXTRA_CUTS）。聞こえない・表記の違い・わざと残す物は、台本の行のメモに理由を書く（メモにその語を書くと次から数えない）。
      道具は大きさと文字起こしで見るので、0件にすることより、一覧を全部読んで決めたことが合格
    why: 上司の30 ルール3（2026-09-17 本人）・90・カットテロップ基礎工程から移した（2026-10-17 小川さん OK）。⑥⑦は 2026-10-19 小川さん OK（1017 v008 で小川さんが手で切った23か所のうち、「今」「だね」は台本が字幕にも「切る」にもしなかった語、「7」「今回」「と」「して」「という風に 押して」は切ると決めた語の端だった。tools/compare_user_cuts.py で測った）
    spoken_form: 字幕の表記（Addness）とは別に、実際に言った言葉と読み（アドネス）を持っておく。数字・英語・固有名詞の読みを、文字の置き換えだけで決めない。表記を直して字数が変わっても、その字数で声の時刻を割り振り直さない（時刻は言った言葉の声で決める。timing）
    meaning: 通常字幕で言葉を省く時も、意味を変えない。否定・条件・数字・誰の話かを落とさず、推測・条件・疑問（「〜と思う」「〜なら」「？」）を言い切りに変えない
    why_spoken_form: spoken_form は上司の30 ルール2、meaning は上司の G-04 から移した（2026-10-19 小川さん OK）

  punctuation:   # 句読点
    rule: 字幕・強調・話題・図解の文に「、」「。」を出さない。？！は使ってよい。小数点・URL・公式の名前の中の記号は消さない
    how: 句点を消した分、2つの文を1枚にまとめない（文の終わりでは分ける。segmentation の R1）。消すのは表示する字幕だけで、元の文字起こし（音声認識の結果・台本の元）は書き換えない
    why: 上司の30（2026-09-12 本人「句読点と丸はいらない。今後も絶対的なルール」）。2026-10-17 にここへ移した。元の文字起こしを書き換えないのは 2026-10-19

  numbers:   # 数字の書き方
    rule: 数字に桁区切りのカンマを付けない（「10000」。「10,000」にしない）
    why: 上司の02（みかみチャンネルの案件で「カンマなし」を採用）から移した（2026-10-19 小川さん OK）

  segmentation:   # 字幕の分け方（どこで次の字幕に替えるか）
    rule: 字幕は声のまとまり（息・間）と意味のまとまりで分ける。先に分け目を決め、その後で 1行17字・2行（layout）に合わせる。17字に収めるために、間をまたいで次の句を一緒に出さない
    how: |
      R1 文の終わりでは必ず分ける（短くてもまとめない）。例「以上です｜やっぱ強くなりたい」
      R2 述語のまとまり（を・に・と＋動詞、かかる言葉とかかられる言葉）は割らない。×「攻撃のやり方を｜知っておかないと」
      R3 条件・因果・引用は、その結果まで1つに
      R4 て形・「〜し」の切れ目で分ける
      R5 文の頭の「だから・それで・で」は次の字幕の頭へ。「けど・ので」は前の字幕に付ける。例「応援してくれるのよ｜だからありがたい」
      R6 長い主語は「が・は」までを1つに
      R7 「なんか」は後ろの言葉に付ける
      R8 「〜の」で終わらせない（かかる名詞と一緒に。R2 が先）
      R9 相づち・「はい」「さあ」「じゃあ」は、後ろに間がある時だけ1枚にする
      話す人が替わったら必ず分ける。問いと答えを1枚（上下2行）にしない。例「年商は下がった？｜下がりましたね」
      語の途中・数と単位・固有名詞は、分け目でも改行でも割らない。×「働｜いてて」「4分の↵1」「ClaudeCod↵e」
      付属語・補助動詞（〜ている・〜てしまう）・形式名詞（こと・もの・ところ）・否定・修飾の中心の語も、分け目でも改行でも割らない
      分け目の強さ（目安）：文の終わり ＞ 0.6秒以上の間 ＞ 0.3〜0.6秒の間 ＞ 文節 ＞ 文字数（相づち・「さあ」「じゃあ」の後は 0.3秒でも文の終わりと同じ）
    gap_source: 分け目に使う「間」は、声の大きさ（波形）で測った無音を使う。音声認識の語と語の隙間は目安だけ
    check: 字幕を頭から読み、R1〜R9 に外れる分け目を直す（台本係の検査係も同じ問い）
    why: 上司の30 の R1〜R9（本人の手直しから。2026-09-11・12）と 20 の間の改行（2026-06-13）から移した（2026-10-17）。完成版2本もほぼこのとおり（実例/文字組み/文字組み.md）。付属語などを割らない行は上司の30（2026-09-12）、gap_source は上司の20 のドラフトから（2026-10-19 小川さん OK）

  layout:   # 字幕の文字組み（1行の長さ・1行か2行か・改行の位置）
    rule: |
      1行は17字まで（18字以上を作らない。上司の30のまま）。全角1・半角0.5で数える。
      字幕全体が17字までは1行。17字を超えたら2行にするか、節の切れ目で字幕を分ける。3行にしない。
      改行は節の切れ目（たら・から・けど・て形）か、助詞（は・が・を・に）の後ろ。「〜の」を行末に残さない（segmentation の R2〜R8 を改行にも当てはめる）。
      引用の「って言う／ってなる／っていう」は、引用の中身を上の行にまとめ、「って」から下の行にする（例「YouTubeのサムネイル作ろう／ってなった時に」）
      前置き・呼びかけ（「今日はですね」）は1行にする。主語のまとまりは、並べた物も含めて1行にし、述語の前で改行する（例「今日はですね／色と形 そして配置が」。上司の30 の改行ルール R1・R2。2026-10-19 小川さん OK）
    check: 読む速さは1秒8字が目安。1秒12字を超える字幕は、分けすぎ・詰めすぎでないか見る。表示が0.8秒未満の字幕は、前後とまとめられないか見る
    stop_long_line: 17字を超える行は、captions_align（字幕の時刻と台本の検査）を注意ではなくエラーで止める。（ ）の補いを足すと行が長くなりやすいので、補いを足したら行の長さも見る（2026-10-17 セキュリティについて v004 で、注意だけだった29字の行「（ここでメアド言ったら）またイカれる（やられる）んですけど」が画面の両端からはみ出した。小川さん「テロップはみ出てる」）
    why: |
      完成版2本の通常字幕（752枚・541枚）の実測（実例/文字組み/文字組み.md）。1行は中央11〜12字、17字を超える行は 5.6〜10.7%、20字を超える行は 2%弱。
      字幕全体が17〜20字なら2行が 40〜87%、20字を超えるとほぼ2行。「〜の」で終わる上の行は 1〜3%。下の行が「って」で始まる2行が約1割。表示の中央 1.8〜2.1秒、1秒 7.8〜8.3字。
      上限は完成版（17〜20字の行もある）ではなく上司の17字に合わせた（2026-10-02 小川さん「イ」）

  timing:   # 字幕の時刻（発音同期）
    rule: 字幕の開始は、表示する本文の先頭の語が実際に聞こえ始めるフレーム（上司の20：TIMING_ACOUSTIC_REQUIRED・TIMING_HOLD・TIMING_FILLER_HOLD）。ASR の時刻や、一律に数フレームずらす補正は使わない
    how: |
      聞こえ始めは音の波形から測る（tools/audible_onset.py）。波形で決まるのは、候補の時刻が本当の聞こえ始めから ±0.15秒以内にあり、直前に小さな間がある場合。
      候補が粗い所・続けて話している所の開始は「要確認」として記録し、発音同期の合格にしない。
      字幕と声が合わない時は、開始の時刻だけを前後に動かす前に、字幕の分け方（segmentation）と、どの声に当てたかを見直す（上司の30 ルール2）。
      字幕は次の字幕の開始まで出し続け、空白を作らない。フィラーの間は前の字幕を保持する。字幕の区切りに映像と音声の編集点を置く。
      発音と字幕の一致の基準も、完成版2本（quality_reference）
      出だしが無音の中にある字幕は、声が聞こえ始める0.03秒前へ動かす。聞き手や語の頭の小さい声も、聞こえる音として扱う（astra v006 で251枚）
    check: 全字幕について、開始と「聞こえ始め」の差をフレームで出す。0フレームが原則で、差があるものは全部記録して直す（工程9）
    note: |
      素材から作る時は、候補を音声認識の語の時刻から取る：python3 tools/audible_onset.py transcribe 声.wav 認識.json（whisper の small を3分ずつ -dtw にかける）。
      字幕を置くスクリプトでは audible_onset.load_whisper_tokens(認識.json) → asr_candidate2（字幕の文字と語を、ずれ・抜けを許して並べ合わせる。prev_text に同じトラックで1つ前の字幕の文字）→ best_onset を使う（DTW の語の時刻は load_whisper_tokens の中で 0.10秒前にして候補にする＝道具の DTW_LEAD。字幕の時刻は波形で決める）。置いた後の確かめは check-prproj --asr 認識.json。check_kyocho_timing.py の --asr は別の形（words の一覧）なので、この JSON は渡せない。
      声の途中から始まる字幕（1本目 330本）で ±1フレーム以内は、small のまま 28% → DTW 39% → 並べ合わせの候補 44%（±2 は 59%、候補が作れない字幕 71→21本）。正しい候補（編集者の時刻）を渡した時の上限の目安は 68%。
      音素単位で合わせる道具（MFA など）は今は入れない（2026-10-03 小川さん。残りの外れは波形で決める所と編集者の置き方のばらつきが多く、効くのは声の途中から始まる字幕だけ）。案件で字幕の出だしの直しが多いと分かったら試す（Addness 子ゴール 2b96b12c-7ace-4dfc-8be4-f9c3a5bcab6d）。決められなかった開始は今までどおり「要確認」
    why: 道具の精度は 実例/根拠と実例.md（完成版956本で試した結果）。無音の中の出だしを直すのは 2026-10-01 小川さん「テロップは可聴音に合わせて」
    speaker_change: |
      話す人が替わるカットで、カットの直後から次の人の声がもう聞こえている時は、次の人の字幕をカットのコマから出す。前の人の字幕を、次の人が話している絵と声の上に残さない（no_chop.sound の「声の2〜3コマ前から入れる」の分も残さない）。息だけ・無音の所は今までどおり聞こえ始めから。
      検査の目安（AI が決めた数字）：替わった人の字幕の頭がカットの3〜20コマ後ろにあり、その間に −38dB 以上の声がある所を出して直す（工程9：話す人が替わるカットの後に前の人の字幕が3コマ以上残る所 0件）
    why_speaker_change: 2026-10-04 小川さん（環境設定 v003 の 3:10）「三上さんが発話してる瞬間に、前の颯太さんのテロップが残ってしまってるから変です」→ 同じ形の所に当てはめる案に「G4合ってます」、2026-10-05 ルールに足すのを OK。v004 で9か所。画角が変わるコマにそろえる 04 の G1 と同じ考え
    hold: |
      前の字幕は、次の字幕が出るコマまで出したまま（言い終わった瞬間・最低の表示秒数・1コマ前で消さない）。空白を埋めるために次の字幕を早く出さない。
      字幕を出さない区間を作る時は、範囲と理由を書く（書いていない空白は直す）。字幕を出し続けるために声を切らない。章のタイトル・補足はこの決まりの外。話す人が替わるカットは上の speaker_change
    why_hold: 上司の20（2026-09-12 TIMING_HOLD）の細部を移した（2026-10-19 小川さん OK）

  after_cut:
    rule: カットで 0.5秒未満しか残らない字幕は消して、前の字幕を次の字幕の開始まで延ばす

  supplement:   # 省略された言葉の補い
    rule: 通常字幕の中に（ ）で補う。強調にはしない（例「人によって（AIの）頭の良さって違いますか?」）。主語・目的語が抜けて、初心者に何の話か分からない字幕は、必ず探して補う（01 の手順3）
    unfinished: 述語が無いまま止まる字幕（「〜みたいな雰囲気で」で終わり、次の字幕も続きを言っていない）も、言いたいことを（ ）で補う（「みたいな雰囲気で（やってもらってる）」）。聞き取りにくい言いさしは切る
    why: 2026-09-26 ユーザー指示。「必ず探す」は 2026-10-02（お手本1本目は30分で13か所、astra v006 は0か所）。unfinished は 2026-10-16 小川さん（1015claude project開設 v006 の 12:48）「『みたいな雰囲気で』で字幕が止まるのはおかしい。補完して（〜やってもらってます、など）」

  this_that:   # 「これ」「ここ」の中身
    rule: 画面が映っていなくて何を指すか分からない時だけ、（ ）で補う（「（チャットもワークも）これ 同じ見た目じゃん？」）。みかみさんの言葉は、ほかは言ったとおり
    why: 2026-09-28 小川さんの直し（ワークの完全解説）

  proper_nouns:   # 固有名詞の書き方
    rule: |
      サービス名・製品名・会社名・人の名前は、公式の書き方と一字一句同じにする（下の表）。表に無い名前は勝手に決めず、案件メモの「聞き違いの疑い」に「要確認」で書いて報告で聞く。
      表に足すのは2本以上の案件で出た物だけ（その案件だけの物は案件メモと台本係のプロンプトに）
    table:   # 書き方 … 聞き違い・言い方の例（備考）
      - Addness … アドネス・アドレス・アドニス（サービスの時。会社の時は「アドネス株式会社」。挨拶「どうも アドネスの三上です」はカタカナのまま）
      - アドネス株式会社 … アドレスカブ・（株）アドネス
      - Addness 認定パートナー … アドネス認定パートナー
      - 三上さん … 住上さん・ピカメさん
      - 創太くん … ソータ君・ソウタ君・SOTA君・ゾウタ君
      - Claude … クロード
      - Claude Code … クロードコード・Cloud Code（「ClaudeCode」「Claude code」にしない）
      - Codex … コーデックス・コデックス・コーテックス
      - ChatGPT
      - OpenAI … オープンAI
      - Anthropic … アンストロピック
      - Opus … オーパス・大パス（モデル名は「Opus 5.5」）
      - Fable … フェイブル
      - エフォート（考える量。低・中・高）
      - Grok Bot … グロックボット・Glockbot・ロックボット（半角スペースあり）
      - Dots … ドッツ・DOTS
      - Astra／GPT Astra／GPT-6 Astra … アストラ（スペースで区切る）
      - Obsidian … オブシディアン・オブシリアン
      - Premiere Pro … プレミアプロ（略す時は「Premiere」）
      - Screen Studio … スクリーンスタジオ
      - YouTube … ユーチューブ・Youtube
      - X … ツイッター（「X（旧Twitter）」も可）
      - TikTok … ティックトック
      - Instagram … インスタ（略してよいかは案件で）
      - 公式LINE … 公式ライン
      - 概要欄 … 動画下の概要欄
    why: 上司の30 ルール1・31（2026-09-09 本人）から移した（2026-10-17）。足した物は 1003・1015・AI動画編集・grok・セキュリティ・1017 の台本係の表で2本以上に出た物

  asr_errors:   # 音声認識の誤り
    rule: 気づいたら直す（例「上限足した」→「上限達した」、「Zoom積んだ」→「Zoom詰んだ」）。強調テロップの中でも直す。直したものは記録してユーザーに伝える
    why: 2026-09-26 ユーザー指示

  speaker:   # 話者
    rule: 話者不明（白いだけのテロップ）を残さない。必ずどちらかの話者に決めて、その話者のスタイルにする（みかみさん＝みかみテロップ、聞き手＝質問者テロップ。02 の base_subtitles）
    how: |
      声の高さと声色を、話者の分かっている字幕と比べて判別し（tools/speaker_id.py。声の特徴は tools/voice_features.swift。インストール不要）、
      自信が低いものは前後のやりとり（丁寧語か、相手への返事か、呼びかけか）で決める。それでも決めきれないものは一覧にして確認をもらう。仮に決めたものは記録する
    why: 2026-09-26 ユーザー指示。判別の正解率は約96%（実例/根拠と実例.md）
    overlap: 2人が同時に話している所は、それぞれの話者の字幕に分ける（1枚にまとめない）
    why_overlap: 上司の30（2026-09-12）から移した（2026-10-19 小川さん OK）

  long_question:   # 聞き手の長い質問
    rule: 言ったとおりには書かず、フィラー・言い直しだけ削る。条件と主語は残す（要約して名詞句にしない）。問いの札では先頭に「Q:」・2行に収めて1枚（02 の P11「問い」）。2〜3枚に分かれた長い質問・続けて2〜3個問う所は、1つの問いにまとめる
    how: |
      例「そこから そんな抽象的な指示でいいみたいな感じですか」→「そんな抽象的な指示でいいんですか？」、「三上さんが使ってみて Astra何がすごいなみたいなのあったりしますか」→「三上さんが使ってみて Astraの何がすごいと思いますか？」（「Astraの何がすごい？」にしない）。
      聞き手が話を正しい方向へ誘導する問いは、字幕ではなく青の座布団1枚で出す（02 の P11「問い」）。短い確認（「それCodex？」）は字幕のまま
    why: 2026-09-28 小川さんの直し（ワークの完全解説 0:00〜11:54）。2〜3個続く問いを1つにまとめるのは 2026-09-29 小川さん。要約しない（条件と主語を残す）は 2026-09-29 小川さん「質問を要約しないで」、Q:・2行は 2026-10-02 小川さん

  reaction_voice:   # 反応の声（「ん」など）
    rule: 字幕は残し、その声を明朝（シュール T010）の1文字で、真ん中（字幕より上）に大きく（大きさ 320 程度）、長め（2秒）に重ねる
    why: 2026-09-26 ユーザー指示。反応・感情は共感の要素なので残す
