cut:
  video_type:   # 動画の型
    rule: 動画の型は 動画の土台.md の4（今は実践・レビュー解説型だけ。話し手の反応・評価・ツッコミ・つまずきへの反応を一律に切らない）
    why: 2026-09-27 ユーザー指示（画面解説 v009 の直しから）。型を1つにしたのは 2026-10-02 小川さん「ぶっちゃけ実践レビュー系しかない」（前の「対談・解説型」の本題から外れた話を塊で切る決まりは、下の remove の「脱線」にある）

  principle:   # カットの考え方
    rule: |
      話者は、伝わりやすいように多めに話してくれている。テロップで補えるなら短く伝え直してよい。
      カットを決める時は「テロップで補えば、ここは無くても伝わるか」を考える。要点と最初の例は残し、同じことの言い直し・例えの続き・脱線を切って、話の密度を上げる。
    how: カットはリズム（緊張と緩和）の土台。強調テロップ・SE で緊張は作れるが、冗長な話が長く続くとリズムが消える
    why: 2026-09-27 ユーザー指示・完成版2本

  stages:   # 切る順番
    rule: ① 無音を詰める → ② 中身で切る、の2段階で切る
    how: |
      ① 声の大きさで間の候補を出し、下の pauses の数字まで詰める（溜め・画面の結果が出る所は残す）
      ② 字幕を頭から読み、下の remove に当たる所を切る
      切った所は一覧（時刻・切った中身・理由・前の一文 → 後の一文）に残し、ユーザーが「戻して」と言えるようにする
    why: 完成版は ①→② の2段階（2本目に途中の段階が残っていた）

  remove:   # 切るもの（中身）
    - what: 同じ話のくり返し（重複）
      how: |
        話者は多めに話してくれているので、全部載せるとくどくなる。同じ結論・同じ説明・同じ例を2回以上言っている所は、
        一番伝わる1回（多くは一番具体的な1回か、最後の言い切り）だけ残し、ほかは切る。間に別の話が挟まっていても、近く（数分以内）なら同じ話として見る。
        聞き手の同意・言い換えのくり返し（「確かに それはそうかも」「ほんまにそうやと思うわ」）も一緒に切る。
        パッパッパと進むように。くり返しかどうか迷ったら切る側にして、カットの一覧に残す（「戻して」と言えるように）。
        ただし、条件・否定・問いと答え・人物の登場・因果（誰が・何をした結果この発言か）を担う所は、くり返しに見えても残す（切りすぎて、わけの分からない動画にしない）。
        脱線・自慢話・冗談そのものは残してよい（no_chop.flow）が、その中のくり返しは切る
      not_this: 見せ場の前の振り（keep）は重複ではない。振り → 伸びのリズムは残す
      check: 近くで同じ言葉・同じ結論が2回以上出る所の一覧（tools/find_repeats.py。コマンドは工程9）を読み、残したものには理由を書く
      why: |
        2026-10-02 小川さん「本人はめちゃくちゃ多めに喋ってくれてるので、全部乗せるとくどくなる。重複している話はめちゃくちゃカットしている。パッパッパといくように」。
        astra v006 で小川さんが切った1分55秒の大半がくり返し（パワープレイの話 約1分・ロボット語の言い直し・「生きろ 増えろ」の説明・「AIからの連絡」）。
        素材から残した声はお手本 35%・26%、ワークの完全解説の公開版 34%、astra v006 63%。
        話の筋を担う所を残すのは、上司の10（ルール1・2026-09-12 追記「変な部分カットしすぎて、わけわかんない動画になってる」、G-02「条件・否定・答えを失うなら残す」）に合わせた（2026-10-02 小川さん「これ足したい」）。お手本の3〜60秒の切った所も、言い直しと「弾道計算のくり返し50秒」などのくどい補足が多い（実例/カット調査/カット調査.md）
    - what: 迷いながら話して、答えが変わった所
      how: 前後で言っていることが違う所は、最後の確定版だけ残す。言い直す前の版と、それへの聞き手の反応も切る（例 astra「どうやってやろう→Fable」→「いや違うな もっと上かな」→「ゴールすら曖昧だったら Fable」は最後だけ残し、聞き手の「違いわかんないです」も切る）
      why: 2026-09-29 小川さん（astra v002 の修正指示）
    - what: 言い直し・同じ言葉のくり返し
      how: |
        後ろの言い方だけ残す（例「で大体さなんかさ なんだろうな 大体なんか テキストっていっぱいあるじゃん」→「大体なんか テキストっていっぱいあるじゃん」）。
        1〜2音の言いかけ（「クロ…」→「Claude Code」）も、前後の言葉から「言い直した」と判断したら、言い直しとして前を切る（音の短さだけで機械的に切らない）
      why: 言いかけは 2026-10-05 小川さん「言いかけも切るというよりかは、前後を判断して何か言い直したんだなんですよね、あれは」（環境設定 v003 の 2:58「クロ」）
    - what: 迷っている・準備している所
      how: 声が小さい、画面の中を探している、「うーん」「なんか〜ないかな」が続く所。声の大きさと前後の文脈で判断して、話の続きにそのままつなぐ。わざと迷っている所が面白い時は残す
    - what: 言いかけて完結しなかった話
      how: 話が終わりきらないまま別の話に移った所はカットして、自然につながる所へつなぐ（例「だから当時もいろいろ使ってた…そこで出てきたテキストっていうのを」→「てかさ俺のチャッピーやばくて」）
    - what: 打ちかけてやめた入力
      how: 画面で何かを入力しかけてやめ、別のものを入力し直した所は、やめた方をカットする（例 アドネスの情報を打ちかけた所）
    - what: 撮影・構成の段取りの会話
      how: |
        「録画する?」「話戻してもらって具体で言ってもらえたらOK」「まとめすぎ?」「ここでCTA入れていいかも」など、視聴者に向けていない会話は必ず切る（完成版2本とも全部切っていた）。
        段取りではないもの：AI への声の頼み・読み上げ（実演の中身。02 の P17 で見せる。頼みの締めの言葉だけを残さない）、本編の頭の挨拶（名前・会社名。02 の P15）
    - what: 聞き手の相づち・細かいやりとり
      how: 「確かに」「はい」「わかりました」「ヤバイっすね」だけの所、話の流れに関係ない聞き返しは切る。聞き手の質問・話を進める一言・大事な発言は残す
    - what: 脱線・例えの続き・くどい補足
      how: |
        要点を言い切った後に同じことを言い直す所、2つ目・3つ目の例え、例えの細かい続き、本題から外れた話（完成版は1分以上でも塊ごと切っていた）。話者自身が「この話長いな」と言った所も切る。
        要点と最初の例は残す。切った後に「誰が・何をした結果この発言か」が通じるか確かめる（上司の10）。
        実践・レビュー型は、先に video_type を見る（話し手の反応・評価・権威になる話は脱線でも中身）。自慢話・冗談は中身では切らない（no_chop.flow）
    - what: 思い出せない・探している所
      how: 「なんだっけ…パッと出てこない」、画面でボタンやファイルを探している所は切り、見つかった所・思い出した所へつなぐ
    - what: 章・話題の入りの言い直し
      how: 章の入りを何度も言い直した所は、最後のきれいな1回だけ残す
    - what: 自社のサービスの宣伝
      how: 認定パートナーの仕組み・説明会の案内などは、本題から外れていれば塊で切ってよい（下の keep の CTA とは別）
      why: 2026-09-28 小川さんの直し（ワークの完全解説で、前半の認定パートナーの宣伝と説明会の案内 2分46秒、締めの認定パートナーの話を切った）。小川さん「消さないで入れておいていい」で確定

  keep:   # 切らないもの
    - what: 事実と違う説明
      rule: 説明が事実と違うかどうかを理由に切らない。間違いに気づいたら、切らずに報告で聞く
      why: 2026-09-27 小川さん「間違ったかどうかは人間が見ないと分からないので、入れない方がいい」（一度入れた wrong_info を取り消した。Addness の記録）
    - what: CTA（特典・概要欄・公式LINE・1on1 の案内）
      rule: 上の remove に当たっても切らない。特典の受け取り方は必ず板（CTA のボード。02 の P14）でも出す
      why: Codex からの引き継ぎ「CTA は絶対にカットしない」。自社のサービスの宣伝は別（remove）
    - what: 話の区切りを知らせる一言
      rule: 「1つ目はここで終わり」「次へ行く」が分かる締めや入りは残す（「ということで これでもう結局クロードコード」「ということで はい よいしょ」「これいいよ」）。切ると次の話へいきなり飛ぶ
      why: 2026-09-27 画面解説 v009 で小川さんが戻した所
    - what: 見せ場・要点の前の振り
      rule: 振りがあって次で伸びるリズムを残す（「そうなんだよね 知識ってやっぱりいろいろマルチだからさ」）。要点だけをつないで「ドドドドドン」と続けない。テロップも含めた話全体で同じ
      why: 2026-09-27 同上
    - what: 権威になる脱線
      rule: 話し手・聞き手の実力や実績が具体的に伝わる話（数字・結果・比べた話）は、本題から外れていても残してよい（どこまで残すかは程度の問題。例 Google 社員の話）
      why: 2026-09-27 同上

  no_chop:   # ブツッとさせない（2026-09-28 小川さん「音声の途中なのに切っている時がある。それは NG。ちゃんと終わってから切るっていうのを徹底」「自慢話とかも、自慢話として入っていてもよかった。前後の接続とブツッとなってしまったりというところが一番多かった」「理想はテロップやアニメーションの直しが無いこと」）
    sound:   # ① 音のブツッ＝つなぎ目（声の途中で切れる・声の途中から始まる）
      rule: 声の途中で切らない。前の声は言い終わってから切り、次の声は出だしの少し前から入れる
      how: |
        切る位置は字幕の境目ではなく、声の大きさ（波形）で決める。音声認識の字幕の境目は声とずれていることがある（数フレーム早いことが多い）ので、字幕の境目が音とずれている所は、先に字幕の境目を音に合わせてから切る。
        波形の見方：ffmpeg で 16kHz に書き出し、50ms ごとの大きさを見る。
        切り終わり（前の声）：声の大きさが -45dB より下がり切った所（＝言い終わり。語尾・息の抜けまで）から、0.1秒弱残して切る。息まじりの小さい語尾は大きさでは「無音」に見えるので、少し余分に残す。
          言い終わらない（語と語がつながっていて間が無い）所では切らない。0.4秒待っても下がらない時は、そこでは切らず、前の語の切れ目（声が下がる所）まで戻すか、文の終わりまで残す。
        入り（次の声）：声の大きさが上がり始める 2〜3フレーム前から入れる。前に間が無い（前の語から続いている）所から入らない。
        語頭・語尾を欠けさせない（上司の10）。
      check: tools/check_chops.py で「前が切れている」「後ろが途中から」が0件（声の WAV は tools/audible_onset.py extract で作る）。1件でもあれば直してから次へ
      why: |
        2026-09-28 小川さん（ワークの完全解説 v003 の直し。AI の v002 で40か所・v003 で36か所あった）。
        2026-09-29 小川さん：入りは「2〜3フレーム前」にそろえ、切り終わりは「-45dB より下がり切ってから 0.1秒弱」に1本化（お手本の実測は、入り 0〜0.05秒前・切り終わり 0.07〜0.08秒。実例/根拠と実例.md）
    flow:   # ② 話のブツッ（つながりが唐突）
      - what: 塊の途中だけを抜かない
        rule: |
          話は「フリ → 本題 → 反応・オチ」の塊でできている。くり返しや長い話を切る時は、塊ごと切るか、塊ごと残す。
          塊の中で抜いてよいのは、言い直し・言いよどみ・同じ語の重なりのように、抜いてもその文がそのままつながるものだけ
        why: v003 で AI が比べる場面・締めの話から一言ずつ抜き、小川さんが塊で切り直した（例は 実例/根拠と実例.md）
      - what: フリと反応・オチを離さない
        rule: 反応（「一緒やん」「ほらね」「すごい」）を残すなら、その対象（前の発言・画面）も残す。オチを残すならフリも残す。どちらかを切るなら両方切る
      - what: 切った後のつなぎ目を読んで確かめる
        rule: 切った所ごとに「前に残した一文 → 後に残した一文」を続けて読む
        check: |
          ・接続の言葉（だから・でも・なんだけど・そうすると）が、前の文をちゃんと受けているか
          ・指す言葉（それ・これ・こっち・そこ）が指すものが残っているか
          ・話題がいきなり変わっていないか（変わるなら、区切りの一言が残っているか。keep）
          1つでも引っかかったら、塊ごと切るか戻す。カットの一覧の「前の一文 → 後の一文」の列で、ユーザーも読んで確かめられるようにする
      - what: 自慢話・冗談・脱線は、中身では切らない
        rule: 切るのは、残すと前後のつながりが悪くなる時だけ（本題の説明の途中に挟まっていて、戻る所でブツッとなる時。例 v003 の「詳しいでしょ／しかも俺って実は記憶力めっちゃ良くて」）
        why: 小川さん「自慢話とかも、自慢話として入っていてもよかった」
      - what: 板・テロップで見せているものを、声でくり返さない
        rule: 合言葉（「導入支援0927」「セットアップ0927」）の読み上げ・別の動画の案内は、板（CTA のボード）やサムネイルで見せ、声は切ってよい（別の動画の案内は、字幕を板にしてサムネイルを添える）
        why: v003 で小川さんが切った
      - what: 締めの長い話
        rule: 締めのメッセージは、核の一言（例「その先に誰かに何かを与えられる人間になってほしい」）と、それにつながる1〜2文だけ残し、長い前振りと宣伝は塊で切る
        why: v003 で小川さんが33秒切った

  pauses:   # 間（切らずに残す部分の中の間）
    rule: 0.5秒以上の間は詰める。つなぎ目で聞こえる間は 0.1秒前後、長くても 0.3秒
    keep_as_tame: |
      0.5〜1.0秒残してよいのは「溜め」だけ：オチ・言い切りの前（「見え始める…見え始めるんだよ」）、例え話・再現の中の擬音の後（「ピュッてな」「えぇって」「パンって」）
    after_punchline: オチのあとの長い間は、言い終わりから 0.4秒ほど残して詰める（例「寂しい」のあと）
    keep_face: |
      話の途中で2秒以上声が無い所は、間を詰める前にカメラのコマ（0.5秒ごと）を見る。とくに言葉が途中で抜けている所（「〜は」の後に「って」で受ける中身が無い、「〜ってなる」の中身が無い）は必ず見る。
      顔や手（身振り）で何かを表現している（顔まね・表情のボケ・手で形を見せる）なら切らず、表情・動きが一番出ている所を溜めとして残す（目安 1.5〜2秒。字幕ごとに秒を決める）。迷ったら残し、カットの一覧に「戻せる」と書く。見せ方は 02 の P18。
      候補の一覧は tools/find_silent_acts.py（字幕の間の声の無い2秒以上を出し、言葉が抜けている所を上に並べ、カメラのコマを並べた画像を作る）。カット（工程3）の前に見て決める
    why_keep_face: 2026-10-04 小川さん「顔まねしてるところをカットしないで置いてけたんだよね…音声しか見てなかったらカットしてしまうかもしれなかった」→「完成できたらルールに足そう」（2026-10-05 OK）。環境設定 v001 の台本係が自分でコマを見て残した（1100「多分Obsidianの開発者は」と1101「ってなると思う」の間 3.08秒は −70dB 前後）。手も同じは 2026-10-05 小川さん
    odd_silence: 言い出す前や言い終わった後の長い無音（変な間）は、この数字まで詰め、詰めた所は一覧に残す（2026-09-27 ユーザー指示で「確認してから」から変更）
    screen: 画面共有で黙って操作している間は、画面で結果が出る所（話し出す直前）だけ短く残して詰める（完成版は画面を探す52秒を切っていた）
    why: 完成版2本の実測（聞こえる間は完成版の90%が 0.30秒以内・2本目は 0.25秒以内。0.5秒以上の間は33分で16か所・2本目は2か所）。実例/カット調査/カット調査.md

  no_slivers:   # 切れ端を作らない
    rule: 映像（カメラ・画面・ワイプ）にも声にも、0.2秒（30fps で6フレーム・60fps で12フレーム）より短い切れ端を作らない。素材がそのまま続いている分け目は切れ端に数えない（見た目も音も変わらないため）
    how: |
      カメラ↔画面の切り替え・ワイプの出入りは、カットの切れ目にそろえる（07 の switching）。切れ目から5フレーム以内に切り替えが来たら、切れ目のほうへ寄せる。
      カットで残る部分が 0.2秒未満になる時は、その部分ごと切るか、隣のカットと合わせて残す（話がつながる方を選ぶ）
    check: 組み立てた後に tools/check_slivers.py で 0.2秒未満の切れ端が0件（1件でもあれば直してから次へ）
    why: 2026-09-27 ユーザー指示「1フレームだけあるのは絶対やらない。画面共有をまたぐ所ですごく多く、カクッとして気持ち悪い」。お手本2本は2フレーム以下が0件（実例/根拠と実例.md）

  reorder:   # 並べ替え
    rule: 前提の説明が後から出てくる時は、前へ移してよい。本人が言っていない問いと答え・因果は作らない（上司の10）
    why: 完成版 12:09（撮影中の聞き手の指摘どおりに移していた）
    logic_check: |
      カット（工程3）の段階で、元の順番のまま並べると話の論理の展開がおかしくなる所を先に探して直す（並べ替える・どちらかを切る）。
      例：離れた所で同じ具体の話をもう一度していて「さっきの話をもう一回話した」ように見える所、前提や結論が後から出てくる所、説明より先にその言葉を使っている所。
      確かめ方：組み立ての前に、残す区間の流れ（tools/flow_table.py の表）を頭から読み、「初めて見る人がこの順番で通じるか」を見て、おかしい所を一覧にして直す（工程9 の「考えずに分かるか」より前に）
    why_logic_check: 2026-10-05 小川さん「そもそも論理の展開として、絶対これって元の状態だとおかしいと思う。そういうのをまずちゃんと事前に見つけ入れることが大事」（環境設定 v003 で、離れた後ろのサッカーのたとえを 1:50 の皿の話の後ろへ移した件）

  after_change:   # 尺が変わった時
    rule: 尺が変わったら、後ろの字幕・SE・ズーム・図解・BGM・マーカー・トランジション（ClipTrack/TransitionItems）を全部ずらし、全部を再検査する
    why: トランジションを残すと、別のクリップが写り込んだりクリップが消えたりする（画面共有装飾で分かったこと）

captions:   # 字幕（工程4）
  base:
    rule: 通常字幕は上司のルールが正（30 文節と言葉・31 固有名詞辞書・20 間・定義/data/字幕と話者の品質規則.json）。フィラーは表示しない
    check: 基礎品質（上司の90）に合格するまで、工程5に進まない

  layout:   # 字幕の文字組み（1行の長さ・1行か2行か・改行の位置）
    rule: |
      1行は17字まで（18字以上を作らない。上司の30のまま）。全角1・半角0.5で数える。
      字幕全体が17字までは1行。17字を超えたら2行にするか、節の切れ目で字幕を分ける。3行にしない。
      改行は節の切れ目（たら・から・けど・て形）か、助詞（は・が・を・に）の後ろ。「〜の」を行末に残さない（上司の30 R3〜R8）。
      引用の「って言う／ってなる／っていう」は、引用の中身を上の行にまとめ、「って」から下の行にする（例「YouTubeのサムネイル作ろう／ってなった時に」）
    check: 読む速さは1秒8字が目安。1秒12字を超える字幕は、分けすぎ・詰めすぎでないか見る。表示が0.8秒未満の字幕は、前後とまとめられないか見る
    why: |
      完成版2本の通常字幕（752枚・541枚）の実測（実例/文字組み/文字組み.md）。1行は中央11〜12字、17字を超える行は 5.6〜10.7%、20字を超える行は 2%弱。
      字幕全体が17〜20字なら2行が 40〜87%、20字を超えるとほぼ2行。「〜の」で終わる上の行は 1〜3%。下の行が「って」で始まる2行が約1割。表示の中央 1.8〜2.1秒、1秒 7.8〜8.3字。
      上限は完成版（17〜20字の行もある）ではなく上司の17字に合わせた（2026-10-02 小川さん「イ」）

  timing:   # 字幕の時刻（発音同期）
    rule: 字幕の開始は、表示する本文の先頭の語が実際に聞こえ始めるフレーム（上司の20：TIMING_ACOUSTIC_REQUIRED・TIMING_HOLD・TIMING_FILLER_HOLD）。ASR の時刻や、一律に数フレームずらす補正は使わない
    how: |
      聞こえ始めは音の波形から測る（tools/audible_onset.py）。波形で決まるのは、候補の時刻が本当の聞こえ始めから ±0.15秒以内にあり、直前に小さな間がある場合。
      候補が粗い所・続けて話している所の開始は「要確認」として記録し、発音同期の合格にしない。
      字幕は次の字幕の開始まで出し続け、空白を作らない。フィラーの間は前の字幕を保持する。字幕の区切りに映像と音声の編集点を置く。
      発音と字幕の一致の基準も、完成版2本（quality_reference）
      出だしが無音の中にある字幕は、声が聞こえ始める0.03秒前へ動かす。聞き手や語の頭の小さい声も、聞こえる音として扱う（astra v006 で251枚）
    check: 全字幕について、開始と「聞こえ始め」の差をフレームで出す。0フレームが原則で、差があるものは全部記録して直す（工程9）
    note: |
      素材から作る時は、候補を音声認識の語の時刻から取る：python3 tools/audible_onset.py transcribe 声.wav 認識.json（whisper の small を3分ずつ -dtw にかける）。
      字幕を置くスクリプトでは audible_onset.load_whisper_tokens(認識.json) → asr_candidate2（字幕の文字と語を、ずれ・抜けを許して並べ合わせる。prev_text に同じトラックで1つ前の字幕の文字）→ best_onset を使う（DTW の語の時刻は load_whisper_tokens の中で 0.10秒前にして候補にする＝道具の DTW_LEAD。字幕の時刻は波形で決める）。置いた後の確かめは check-prproj --asr 認識.json。check_kyocho_timing.py の --asr は別の形（words の一覧）なので、この JSON は渡せない。
      声の途中から始まる字幕（1本目 330本）で ±1フレーム以内は、small のまま 28% → DTW 39% → 並べ合わせの候補 44%（±2 は 59%、候補が作れない字幕 71→21本）。正しい候補（編集者の時刻）を渡した時の上限の目安は 68%。
      音素単位で合わせる道具（MFA など）は今は入れない（2026-10-03 小川さん。残りの外れは波形で決める所と編集者の置き方のばらつきが多く、効くのは声の途中から始まる字幕だけ）。案件で字幕の出だしの直しが多いと分かったら試す（Addness 子ゴール 2b96b12c-7ace-4dfc-8be4-f9c3a5bcab6d）。決められなかった開始は今までどおり「要確認」
    why: 道具の精度は 実例/根拠と実例.md（完成版956本で試した結果）。無音の中の出だしを直すのは 2026-10-01 小川さん「テロップは可聴音に合わせて」
    speaker_change: |
      話す人が替わるカットで、カットの直後から次の人の声がもう聞こえている時は、次の人の字幕をカットのコマから出す。前の人の字幕を、次の人が話している絵と声の上に残さない（no_chop.sound の「声の2〜3コマ前から入れる」の分も残さない）。息だけ・無音の所は今までどおり聞こえ始めから。
      検査の目安（AI が決めた数字）：替わった人の字幕の頭がカットの3〜20コマ後ろにあり、その間に −38dB 以上の声がある所を出して直す（工程9：話す人が替わるカットの後に前の人の字幕が3コマ以上残る所 0件）
    why_speaker_change: 2026-10-04 小川さん（環境設定 v003 の 3:10）「三上さんが発話してる瞬間に、前の颯太さんのテロップが残ってしまってるから変です」→ 同じ形の所に当てはめる案に「G4合ってます」、2026-10-05 ルールに足すのを OK。v004 で9か所。画角が変わるコマにそろえる 04 の G1 と同じ考え

  after_cut:
    rule: カットで 0.5秒未満しか残らない字幕は消して、前の字幕を次の字幕の開始まで延ばす

  supplement:   # 省略された言葉の補い
    rule: 通常字幕の中に（ ）で補う。強調にはしない（例「人によって（AIの）頭の良さって違いますか?」）。主語・目的語が抜けて、初心者に何の話か分からない字幕は、必ず探して補う（01 の手順3）
    why: 2026-09-26 ユーザー指示。「必ず探す」は 2026-10-02（お手本1本目は30分で13か所、astra v006 は0か所）

  this_that:   # 「これ」「ここ」の中身
    rule: 画面が映っていなくて何を指すか分からない時だけ、（ ）で補う（「（チャットもワークも）これ 同じ見た目じゃん？」）。みかみさんの言葉は、ほかは言ったとおり
    why: 2026-09-28 小川さんの直し（ワークの完全解説）

  asr_errors:   # 音声認識の誤り
    rule: 気づいたら直す（例「上限足した」→「上限達した」、「Zoom積んだ」→「Zoom詰んだ」）。強調テロップの中でも直す。直したものは記録してユーザーに伝える
    why: 2026-09-26 ユーザー指示

  speaker:   # 話者
    rule: 話者不明（白いだけのテロップ）を残さない。必ずどちらかの話者に決めて、その話者のスタイルにする（みかみさん＝みかみテロップ、聞き手＝質問者テロップ。02 の base_subtitles）
    how: |
      声の高さと声色を、話者の分かっている字幕と比べて判別し（tools/speaker_id.py。声の特徴は tools/voice_features.swift。インストール不要）、
      自信が低いものは前後のやりとり（丁寧語か、相手への返事か、呼びかけか）で決める。それでも決めきれないものは一覧にして確認をもらう。仮に決めたものは記録する
    why: 2026-09-26 ユーザー指示。判別の正解率は約96%（実例/根拠と実例.md）

  long_question:   # 聞き手の長い質問
    rule: 言ったとおりには書かず、フィラー・言い直しだけ削る。条件と主語は残す（要約して名詞句にしない）。問いの札では先頭に「Q:」・2行に収めて1枚（02 の P11「問い」）。2〜3枚に分かれた長い質問・続けて2〜3個問う所は、1つの問いにまとめる
    how: |
      例「そこから そんな抽象的な指示でいいみたいな感じですか」→「そんな抽象的な指示でいいんですか？」、「三上さんが使ってみて Astra何がすごいなみたいなのあったりしますか」→「三上さんが使ってみて Astraの何がすごいと思いますか？」（「Astraの何がすごい？」にしない）。
      聞き手が話を正しい方向へ誘導する問いは、字幕ではなく青の座布団1枚で出す（02 の P11「問い」）。短い確認（「それCodex？」）は字幕のまま
    why: 2026-09-28 小川さんの直し（ワークの完全解説 0:00〜11:54）。2〜3個続く問いを1つにまとめるのは 2026-09-29 小川さん。要約しない（条件と主語を残す）は 2026-09-29 小川さん「質問を要約しないで」、Q:・2行は 2026-10-02 小川さん

  reaction_voice:   # 反応の声（「ん」など）
    rule: 字幕は残し、その声を明朝（シュール T010）の1文字で、真ん中（字幕より上）に大きく（大きさ 320 程度）、長め（2秒）に重ねる
    why: 2026-09-26 ユーザー指示。反応・感情は共感の要素なので残す
