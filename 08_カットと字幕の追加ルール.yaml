# カットと字幕の追加ルール（このチャンネルで、上司の方法セットに加えるもの）
#
# 根拠: 画面解説の案件（work/gamen_kaisetsu_20260926/）で、2026-09-26 にユーザーが出した修正指示（v005・v006）。
# カット・文字起こし・通常テロップ・話者は上司の方法セット（10_カットと構成・20_間・30_文節と言葉）が正。ここはその上に足す決まり。
# 上司の方法セットと食い違って見える時は、推測で決めずにユーザーに確認する。

version: 0.3
status: 暫定（0.2 で品質の基準、0.3 で完成版2本のカット調査からカットの数字と切るものを追加。0.3 はユーザーの確認前に v007 で使っている：2026-09-27 ユーザー指示「朝に一緒に見る」）

quality_reference:   # 2026-09-27 ユーザー指示「すでに渡した完成動画のことです」
  what: |
    カット・テロップ（発音と字幕の一致・自然なカット感）の品質の基準（お手本）は、このチャンネルの完成版2本。
    上司の方法セットの「面談前動画v3を最低品質とする」（10_カットと構成 ルール2・カットテロップ基礎工程）は、このチャンネルでは基準の動画だけをこの2本に置き換える。
    上司のルールの考え方（内容の採否・語頭語尾を守る・秒数で機械的に切らない・切った後も話が通じる・発音同期）はそのまま使う。
  videos:
    - name: 完成版（みかみさんCH0726_最終）の本編「AI使いこなす習慣7選」（33分）
      project: ~/Downloads/コピー_みかみさんCH0726_1/みかみさんCH0726_最終.prproj
      note: 開く時はフォント名を置き換えたコピー work/gamen_kyoyu_20260926/analysis/ルール調査/ref1/mikami_final_ff.prproj
    - name: 2本目「AI時代に消える仕事残る仕事」
      project: ~/Downloads/コピー_AI時代に消える仕事残る仕事/AI時代に消える仕事残る仕事.prproj
      note: 開く時は …/ルール調査/ref2/ai_jidai_copy_ff.prproj（カメラは ~/Downloads の IMG_*.MOV につなぎ直す）
  how_to_use: |
    カットの量・残す間・つなぎ方で迷ったら、完成版の似た場面を探して合わせる。
    完成版のカットを調べた結果（切った部分の中身・残した間の長さ）は 実例/カット調査/カット調査.md。

cut:
  principle: |
    話者は、伝わりやすいように多めに話してくれている。編集では、テロップで補えるなら短く伝え直してよい。
    カットを決める時は「テロップで補えば、ここは無くても伝わるか」を考える。
    カットはリズム（緊張と緩和）の土台。強調テロップ・SE で緊張は作れるが、冗長な話が長く続くとリズムが消える。
    要点と最初の例は残し、同じことの言い直し・例えの続き・脱線を切って、話の密度を上げる（2026-09-27 ユーザー指示・完成版2本）。
  stages: |
    ① 無音を詰める：声の大きさで間の候補を出し、下の join・pauses の数字まで詰める（溜め・画面の結果が出る所は残す）
    ② 中身で切る：字幕を頭から読み、下の remove に当たる所を切る（完成版は ①→② の2段階。2本目に途中の段階が残っていた）
    切った所は一覧（時刻・切った中身・理由）に残し、ユーザーが「戻して」と言えるようにする
  join:        # つなぎ目（完成版2本の実測。実例/カット調査/カット調査.md）
    head: 次の声の出だしの真上から入れる（出だしの前に残すのは 0〜0.05秒。完成版の中央 0.01秒・2本目 0.00秒）
    tail: 前の声が終わってから 0.1秒弱だけ残す（完成版の中央 0.08秒・2本目 0.07秒）
    heard: つなぎ目で聞こえる間は 0.1秒前後、長くても 0.3秒（完成版の90%が 0.30秒以内、2本目は 0.25秒以内）
    safety: 語頭・語尾を欠けさせない（上司の10）。息まじりの小さい語尾は大きさでは「無音」に見えるので、語尾の後ろは少し余分に残す
  pauses:      # 切らずに残す部分の中の間
    rule: 0.5秒以上の間は詰める（完成版は33分で16か所、2本目は2か所しか残していない）
    keep_as_tame: |
      0.5〜1.0秒残してよいのは「溜め」だけ：オチ・言い切りの前（「見え始める…見え始めるんだよ」）、
      例え話・再現の中の擬音の後（「ピュッてな」「えぇって」「パンって」）
    screen: 画面共有で黙って操作している間は、画面で結果が出る所（話し出す直前）だけ短く残して詰める（完成版は画面を探す52秒を切っていた）
  reorder: 前提の説明が後から出てくる時は、前へ移してよい（完成版 12:09：撮影中の聞き手の指摘どおりに移していた）。本人が言っていない問いと答え・因果は作らない（上司の10）
  remove:
    - what: 言い直し・同じ言葉のくり返し
      how: 後ろの言い方だけ残す（例「で大体さなんかさ なんだろうな 大体なんか テキストっていっぱいあるじゃん」→「大体なんか テキストっていっぱいあるじゃん」）
    - what: 迷っている・準備している所
      how: 声が小さい、画面の中を探している、「うーん」「なんか〜ないかな」が続く所。声の大きさと前後の文脈で判断して、話の続きにそのままつなぐ
      note: わざと迷っている所が面白いこともある。その時は残す
    - what: 言いかけて完結しなかった話
      how: 話が終わりきらないまま別の話に移った所はカットして、自然につながる所へつなぐ（例「だから当時もいろいろ使ってた…そこで出てきたテキストっていうのを」→「てかさ俺のチャッピーやばくて」）
    - what: 打ちかけてやめた入力
      how: 画面で何かを入力しかけてやめ、別のものを入力し直した所は、やめた方をカットする（例 アドネスの情報を打ちかけた所）
    - what: オチのあとの長い間
      how: 言い終わりから 0.4秒ほど残して詰める（例「寂しい」のあと）
    - what: 変な間
      how: 言い出す前や言い終わった後の長い無音。上の join・pauses の数字まで詰め、詰めた所は一覧に残す（2026-09-27 ユーザー指示で「確認してから」から変更）
    - what: 撮影・構成の段取りの会話
      how: 「録画する?」「話戻してもらって具体で言ってもらえたらOK」「まとめすぎ?」「ここでCTA入れていいかも」など、視聴者に向けていない会話は必ず切る（完成版2本とも全部切っていた）
    - what: 聞き手の相づち・細かいやりとり
      how: 「確かに」「はい」「わかりました」「ヤバイっすね」だけの所、話の流れに関係ない聞き返しは切る。聞き手の質問・話を進める一言・大事な発言は残す
    - what: 脱線・例えの続き・くどい補足
      how: |
        要点を言い切った後に同じことを言い直す所、2つ目・3つ目の例え、例えの細かい続き、本題から外れた話（完成版は1分以上でも塊ごと切っていた：
        未来予測の話6分、Geminiの評判1分半、弾道計算のくり返し50秒）。話者自身が「この話長いな」と言った所も切る
        要点と最初の例は残す。切った後に「誰が・何をした結果この発言か」が通じるか確かめる（上司の10）
        実践・レビュー型の動画では、先に video_type を見る（話し手の反応・評価・権威になる話は脱線でも中身）
    - what: 思い出せない・探している所
      how: 「なんだっけ…パッと出てこない」、画面でボタンやファイルを探している所は切り、見つかった所・思い出した所へつなぐ
    - what: 章・話題の入りの言い直し
      how: 章の入りを何度も言い直した所は、最後のきれいな1回だけ残す
  where_to_cut: |
    切る位置は音の波形で決める（言い終わりの後・次の語頭の直前 2フレームほど）。字幕の境目が音とずれている所（音声認識の仮の時刻）は、
    先に字幕の境目を音に合わせてから切る。カットで 0.5秒未満しか残らない字幕は消して、前の字幕を次の字幕の開始まで延ばす。
  keep: |
    CTA（特典・概要欄・公式LINE・1on1 の案内）は、上の理由でも切らない（Codex からの引き継ぎ：CTA は絶対にカットしない）。特典の受け取り方は必ず板（CTA のボード）でも出す。
    ただし自社のサービスの宣伝（認定パートナーの仕組み・説明会の案内など）は、本題から外れていれば塊で切ってよい
    （2026-09-28 小川さんの直し：ワークの完全解説で、前半の認定パートナーの宣伝と説明会の案内 2分46秒、締めの認定パートナーの話を切った。合言葉の読み上げは板に任せて切った）
  video_type:   # 2026-09-27 ユーザー指示（画面解説 v009 の直しから）
    first: 切る前に、動画の型を決めてから物差しを当てる
    実践・レビュー型: |
      画面を触りながら試す動画（画面解説・ワークの完全解説）は、ノウハウの説明より
      「年商25億のAI会社の社長が試してみた・レビューしてみた」という見方が強い（ゲーム実況に近い）。
      その人の目からどう映るか（驚き・評価・ツッコミ・発見・感想）が中身なので、操作しながらの反応や
      独り言、つまずきへの反応を一律に切らない。切るとただのナレッジになり、動画の目的から外れる。
      切るのは、反応の無い待ち・探しもの・撮る側の段取りだけ
    対談・解説型: お手本2本（対談）。本題から外れた話は、1分以上でも塊ごと切っていた（remove の「脱線」）
  keep_for_flow:   # 話が飛ばないように残す（画面解説 v009 で小川さんが戻した所）
    - 話の区切りを知らせる一言。「1つ目はここで終わり」「次へ行く」が分かる締めや入り（「ということで これでもう結局クロードコード」「ということで はい よいしょ」「これいいよ」）。切ると次の話へいきなり飛ぶ
    - 見せ場・要点の前の振り（「そうなんだよね 知識ってやっぱりいろいろマルチだからさ」）。振りがあって次で伸びるリズムを作り、要点だけをつないで「ドドドドドン」と続けない。テロップも含めた話全体で同じ
    - 権威になる脱線。話し手・聞き手の実力や実績が具体的に伝わる話（数字・結果・比べた話）は、本題から外れていても残してよい（どこまで残すかは程度の問題。例：Google 社員の話）
  no_slivers:   # 2026-09-27 ユーザー指示「1フレームだけあるのは絶対やらない。画面共有をまたぐ所ですごく多く、カクッとして気持ち悪い」
    rule: |
      映像（カメラ・画面・ワイプ）にも声にも、0.2秒（30fps で6フレーム・60fps で12フレーム）より短い切れ端を作らない。
      素材がそのまま続いている分け目は切れ端に数えない（見た目も音も変わらないため）。
    why: |
      お手本2本は、映像のかたまりの最短が 0.23秒（1本目）・0.18秒（2本目。0.2秒未満はこの1か所だけ）で、2フレーム以下は0件。
      AI の版は、カットの位置と画面↔カメラの切り替えの位置を別々に決めていたため、1〜2フレームずれた所に切れ端が残っていた
      （画面解説 v009 で画面27・ワイプ10・声21、ワークの完全解説 v001 で画面51うち42がカメラ↔画面の切り替わり）。
    how: |
      カメラ↔画面の切り替え・ワイプの出入りは、カットの切れ目にそろえる（07 の switching.cut_point）。切れ目から5フレーム以内に切り替えが来たら、切れ目のほうへ寄せる。
      カットで残る部分が 0.2秒未満になる時は、その部分ごと切るか、隣のカットと合わせて残す（話がつながる方を選ぶ）。
    check: 組み立てた後に python3 tools/check_slivers.py 版.prproj --seq シーケンス名 で、0.2秒未満の切れ端が0件か見る（1件でもあれば直してから次へ）
  no_chop:   # 2026-09-28 ユーザー指示（ワークの完全解説 v003 の直しから）
    said: |
      「自慢話とかも、自慢話として入っていてもよかった。前後の接続とブツッとなってしまったりというところが一番多かった」
      「音声の途中なのに切っている時がある。それは NG。ちゃんと終わってから切るっていうのを徹底」
      「理想はテロップやアニメーションの直しが無いこと」
    why: |
      ワークの完全解説 v003（AI 27:59）を、小川さんは公開前にさらに 1分37秒切った（26:22）。切った31の塊は、中身（自慢話・冗談）が理由ではなく、
      AI の細かいカットで前後のつながりがブツッとなっていたのが一番多かった。ブツッには2種類ある：
      ① 音のブツッ … 声の途中で切れる・声の途中から始まる（AI の v002 で40か所、v003 で36か所あった）
      ② 話のブツッ … つながりが唐突（塊の途中だけを抜いた・フリと反応が離れた）
    sound:   # ① 音のブツッ（上の join の safety を、数えられる形にしたもの）
      rule: 声の途中で切らない。前の声は言い終わってから（語尾・息の抜けまで）切り、次の声は出だしの少し前から入れる
      how: |
        切る位置は字幕の境目ではなく、声の大きさで決める（字幕の境目は声より数フレーム早いことがある）。
        前の声：大きさが -45dB より下がり切った所まで残す。言い終わらない（語と語がつながっていて間が無い）所では切らない。
          0.4秒待っても下がらない時は、そこでは切らず、前の語の切れ目（声が下がる所）まで戻すか、文の終わりまで残す
        次の声：大きさが上がる 2〜3フレーム前から入れる。前に間が無い（前の語から続いている）所から入らない
      check: |
        組み立てた後に python3 tools/check_chops.py 版.prproj --seq シーケンス名 --track A1 --media 素材の名前=声.wav で、
        「前が切れている」「後ろが途中から」が0件か見る（声の WAV は tools/audible_onset.py extract で作る。1件でもあれば直してから次へ）
    flow:    # ② 話のブツッ
      - what: 塊の途中だけを抜かない
        how: |
          話は「フリ → 本題 → 反応・オチ」の塊でできている。塊の中からくり返しの一言だけを細かく抜くと、残りが切れ切れになる。
          くり返しや長い話を切る時は、塊ごと切るか、塊ごと残す。塊の中で抜いてよいのは、言い直し・言いよどみ・同じ語の重なりのように、
          抜いてもその文がそのままつながるものだけ
        example: |
          v003 で AI は、比べる場面から「一緒じゃないかい」だけ抜いて「完全に一緒じゃないかい」を残し、「右側にこれがあるかどうか」と「あ 間違いだ」の間も抜いた
          → 小川さんは比べる場面のくり返しを約13秒まとめて切った。
          締めの「100億→5億→4000万」の話から AI が一言ずつ抜いた → 小川さんは「そういう連中と戦うってきつい」「100億なら毎年5億・年利5%」を塊で切り、
          「2世でーす 相続で100億ですみたいな」→「ズルでしょそんな」に直接つないだ
      - what: フリと反応・オチを離さない
        how: 反応（「一緒やん」「ほらね」「すごい」）を残すなら、その対象（前の発言・画面）も残す。オチを残すならフリも残す。どちらかを切るなら両方切る
      - what: 切った後のつなぎ目を読んで確かめる
        how: |
          切った所ごとに「前に残した一文 → 後に残した一文」を続けて読み、次を確かめる：
          ・接続の言葉（だから・でも・なんだけど・そうすると）が、前の文をちゃんと受けているか
          ・指す言葉（それ・これ・こっち・そこ）が指すものが残っているか
          ・話題がいきなり変わっていないか（変わるなら、区切りの一言が残っているか。keep_for_flow）
          1つでも引っかかったら、塊ごと切るか戻す。カットの一覧に「前の一文 → 後の一文」の列を足して、ユーザーが読んで確かめられるようにする
      - what: 自慢話・冗談・脱線は、中身では切らない
        how: 切るのは、残すと前後のつながりが悪くなる時だけ（本題の説明の途中に挟まっていて、戻る所でブツッとなる時。例 v003 の「詳しいでしょ／しかも俺って実は記憶力めっちゃ良くて」）
      - what: 板・テロップで見せているものを、声でくり返さない
        how: 合言葉（「導入支援0927」「セットアップ0927」）の読み上げ・別の動画の案内は、板（CTA のボード）やサムネイルで見せ、声は切ってよい（v003 で小川さんが切った。別の動画の案内は、字幕を板にしてサムネイルを添えていた）
      - what: 締めの長い話
        how: 締めのメッセージは、核の一言（例「その先に誰かに何かを与えられる人間になってほしい」）と、それにつながる1〜2文だけ残し、長い前振りと宣伝は塊で切る（v003 で小川さんが33秒切った）

captions:
  - what: 省略された言葉の補い
    how: 通常字幕の中に（ ）で補う。強調にはしない（例「人によって（AIの）頭の良さって違いますか?」）
  - what: 音声認識の誤り
    how: 気づいたら直す（例「上限足した」→「上限達した」、「Zoom積んだ」→「Zoom詰んだ」）。直したものは記録してユーザーに伝える
  - what: 話者不明（白いだけのテロップ）を残さない
    how: |
      必ずどちらかの話者に決めて、その話者のスタイルにする（みかみさん＝青、聞き手＝黒白）。
      声の高さ（この案件ではみかみさん中央値162Hz・聞き手127Hz）と声色を、話者の分かっている字幕と比べて判別し（正解率 約96%）、
      自信が低いものは前後のやりとり（丁寧語か、相手への返事か、呼びかけか）で決める。それでも決めきれないものは一覧にして確認をもらう
      道具：tools/speaker_id.py（声の特徴は tools/voice_features.swift。インストール不要）
  - what: 聞き手の長い質問（2026-09-28 小川さんの直し：ワークの完全解説 0:00〜11:54）
    how: |
      言ったとおりに書かず、短い問いにする（「そこから そんな抽象的な指示でいいみたいな感じですか」→「そんな抽象的な指示でいいんですか？」、
      「ちょっと違いみたいな説明してもらっていいですか」→「ChatGPTのモデルの違いは？」）。2〜3枚に分かれた長い質問は1枚にまとめる。
      話の展開を作る問い（「〜って何？」「〜は何のために？」）は、字幕ではなく青の座布団で出す（02 の P11 の「問い」）。短い確認（「それCodex？」）は字幕のまま
  - what: 「これ」「ここ」の中身
    how: 画面が映っていなくて何を指すか分からない時だけ、（ ）で補う（「（チャットもワークも）これ 同じ見た目じゃん？」）。みかみさんの言葉は、ほかは言ったとおり
  - what: 反応の声（「ん」など）
    how: 字幕は残し、その声を明朝（シュール T010）の1文字で真ん中に大きく（大きさ320程度）、長め（2秒）に重ねる。反応・感情は共感の要素なので残す

requests:   # 修正指示の受け方
  - ユーザーは動画を10分ほどずつ見て、音声入力で修正指示を出す。聞き取りの誤りがある（例「民調」＝明朝、「サードトラップ」など）
  - 作業の前に、指示を言葉で整理して見せる（全体に効くもの／時刻ごと、私の理解、分からない所の質問、この後の区間にも当てはめる提案）。確認をもらってから直す
  - 時刻は、ユーザーが見ている版の時刻とは限らない（前の版の時刻のことがある）。字幕の中身で、どの字幕のことか確かめる
  - 修正は版ごとにフォルダを分けて作る。Premiere の上で直接直して保存すると、作り直した時に消えるので、手で直した所は時刻を教えてもらう
