<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>kasegu highlight</title>
<link rel="stylesheet" href="fonts.css">
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
canvas { position: absolute; left: 0; top: 0; }
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="hl.js"></script>
<script>
// ハイライト（文字PV風の切り抜き）の描画。window.HL（make_hl.py が書く）を、フレーム f ごとに決まった絵にする。
// 背景（カメラの1コマ）・カメラの寄り/揺れ・文字（声の1語ずつに合わせて出す）・図形・光/グリッチを1枚のキャンバスに描く。
// 動きの速い所は、1コマの中の時刻を少しずつずらして何回か描いて重ねる（モーションブラー）。
const HL = window.HL, FPS = HL.fps, W = 1920, H = 1080;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const mk = (w = W, h = H) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const sub = mk(), sctx = sub.getContext("2d");
const tmp = mk(), tctx = tmp.getContext("2d");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = (p) => 1 - Math.pow(1 - clamp(p), 3);
const eOut5 = (p) => 1 - Math.pow(1 - clamp(p), 5);
const eIn = (p) => Math.pow(clamp(p), 3);
const eIO = (p) => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const eBack = (p, c = 2.2) => { p = clamp(p); return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function rnd(s) { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------- 背景の画像（1コマずつ） ----------
const bgCache = new Map();
function loadBg(f) {
  const k = Math.max(0, Math.min(HL.N - 1, f));
  if (bgCache.has(k)) return bgCache.get(k);
  const p = new Promise((ok) => {
    const im = new Image();
    im.onload = () => ok(im); im.onerror = () => ok(null);
    im.src = HL.bgDir + "/" + String(k).padStart(5, "0") + ".jpg";
  });
  bgCache.set(k, p);
  if (bgCache.size > 6) bgCache.delete(bgCache.keys().next().value);
  return p;
}

// ---------- 粒子のノイズ（フィルムの粒） ----------
const grains = [0, 1, 2, 3].map((s) => {
  const c = mk(480, 270), g = c.getContext("2d"), d = g.createImageData(480, 270);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rnd(i * 0.37 + s * 91.3) - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
});

// ---------- カメラ（場面・寄り・揺れ・パンチ） ----------
function shotAt(t) {
  for (const s of HL.shots) if (t >= s.t0 && t < s.t1) return s;
  return t < HL.shots[0].t0 ? HL.shots[0] : HL.shots[HL.shots.length - 1];
}
function fxAmt(type, t) {
  let v = 0;
  for (const e of HL.fx) {
    if (e.type !== type || t < e.t || t >= e.t + e.d) continue;
    const p = (t - e.t) / e.d;
    if (type === "punch") v += e.amt * (p < 0.15 ? eOut(p / 0.15) : 1 - eIO((p - 0.15) / 0.85));
    else if (type === "settle") v += e.amt * (1 - eOut5(p));
    else v = Math.max(v, (e.amp || e.a || e.amt || 1) * (1 - p) * (1 - p));
  }
  return v;
}
function camera(t) {
  const s = shotAt(t), u = clamp((t - s.t0) / Math.max(0.001, s.t1 - s.t0));
  let z = lerp(s.z0, s.z1, eIO(u)) * (1 + fxAmt("punch", t) + fxAmt("settle", t));
  let cx = lerp(s.cx0, s.cx1, eIO(u)), cy = lerp(s.cy0, s.cy1, eIO(u));
  const sh = fxAmt("shake", t);
  const k = Math.floor(t * FPS * 2);
  const sx = (rnd(k * 1.7) - 0.5) * 2 * sh, sy = (rnd(k * 2.9 + 5) - 0.5) * 2 * sh * 0.7, sr = (rnd(k * 4.1 + 9) - 0.5) * sh * 0.0016;
  // はみ出さないように中心を寄せる
  cx = clamp(cx, W / 2 / z, 1920 - W / 2 / z); cy = clamp(cy, H / 2 / z, 1080 - H / 2 / z);
  return { s, z, cx, cy, sx, sy, sr };
}

// ---------- 文字 ----------
const measureCache = new Map();
function fontOf(it, size) { return `${it.weight || 400} ${size}px ${it.font}`; }
function charWidths(it) {
  const key = it.id;
  if (measureCache.has(key)) return measureCache.get(key);
  ctx.save(); ctx.font = fontOf(it, it.size);
  const tr = (it.track || 0) * it.size;
  const ws = [...it.text].map((ch, i) => ctx.measureText(ch).width * (it.cscale ? (it.cscale[i] || 1) : 1) + tr);
  ctx.restore();
  const tot = ws.reduce((a, b) => a + b, 0) - (it.track || 0) * it.size;
  const r = { ws, tot };
  measureCache.set(key, r);
  return r;
}
const itemById = new Map();
function itemX(it) {   // 横の基準（左端）
  const { tot } = charWidths(it);
  if (it.after) {
    const o = itemById.get(it.after);
    const ox = itemX(o) + charWidths(o).tot * (o.afterScale || 1);
    return ox + (it.gap || 0);
  }
  if (it.align === "c") return it.x - tot / 2;
  if (it.align === "r") return it.x - tot;
  return it.x;
}
function gradFor(g, it) {   // 文字の上から下へのグラデーション（it.grad＝色の並び。金色など）
  const gr = g.createLinearGradient(0, -it.size * 0.46, 0, it.size * 0.46);
  it.grad.forEach((c, i) => gr.addColorStop(i / (it.grad.length - 1), c));
  return gr;
}
function charStyle(it, i) {
  return (it.colors && it.colors[i]) || it.color || "#fff";
}
function drawText(g, it, t) {
  if (t < it.t0 - 0.0001 || t >= it.t1 + (it.ed || 0)) return;
  const chars = [...it.text];
  const { ws, tot } = charWidths(it);
  const x0 = itemX(it), y0 = it.y;
  // まとまりの動き
  let gs = 1, gdx = 0, gdy = 0, ga = 1, grot = it.rot || 0, gblur = 0;
  const age = t - it.t0;
  const A = it.anim || "pop";
  if (A === "slam") { const p = age / (it.ad || 0.10); gs = lerp(it.from || 2.6, 1, eOut(p)); ga = clamp(p * 2.5); }
  else if (A === "zoomin") { const p = age / (it.ad || 0.35); gs = lerp(0.7, 1, eOut5(p)); ga = eOut(p); }
  else if (A === "slideL" || A === "slideR") { const p = age / (it.ad || 0.14); gdx = (A === "slideL" ? -1 : 1) * (it.dist || 900) * (1 - eOut5(p)); ga = clamp(p * 3); }
  else if (A === "slideU") { const p = age / (it.ad || 0.16); gdy = (it.dist || 300) * (1 - eOut5(p)); ga = clamp(p * 3); }
  gs *= 1 + (it.drift == null ? 0.014 : it.drift) * Math.max(0, age);
  if (it.float) { gdx += it.float[0] * age; gdy += it.float[1] * age; }
  // 出口
  if (t >= it.t1) {
    const q = clamp((t - it.t1) / (it.ed || 0.12));
    const E = it.exit || "cut";
    if (E === "cut") return;
    if (E === "fade") ga *= 1 - q;
    if (E === "up") { gdy -= 220 * eIn(q); ga *= 1 - q; }
    if (E === "blur") { gs *= 1 + 0.5 * eIn(q); ga *= 1 - q; }
    if (E === "flyL") { gdx -= 2200 * eIn(q); grot -= 20 * q; }
    if (E === "flyR") { gdx += 2200 * eIn(q); grot += 20 * q; }
    if (E === "shrink") { gs *= 1 - 0.9 * eIn(q); ga *= 1 - q; }
    if (E === "drop") { gdy += 900 * eIn(q); grot += 12 * q; }
  }
  if (ga <= 0.003) return;
  // 揺れ（出た瞬間）
  if (it.jolt) { const k = clamp(1 - age / 0.25); const fr = Math.floor(t * FPS * 2); gdx += (rnd(fr * 3.3 + it.id.length) - 0.5) * it.jolt * k; gdy += (rnd(fr * 5.1 + 3) - 0.5) * it.jolt * k; }
  const cxg = x0 + tot / 2, cyg = y0;
  g.save();
  g.globalAlpha = ga;
  g.translate(cxg + gdx, cyg + gdy); g.rotate(grot * Math.PI / 180); g.scale(gs, gs); g.translate(-cxg, -cyg);
  if (it.skew) g.transform(1, 0, Math.tan(it.skew * Math.PI / 180), 1, 0, 0);
  // 下地の箱
  if (it.box) {
    const b = it.box, bp = clamp((t - (b.t != null ? b.t : it.t0)) / (b.d || 0.12));
    if (bp > 0) {
      const bx = x0 - (b.px || 0.18) * it.size, by = y0 - it.size * (0.5 + (b.py || 0.12)), bw = tot + 2 * (b.px || 0.18) * it.size, bh = it.size * (1 + 2 * (b.py || 0.12));
      g.fillStyle = b.color;
      const bwp = bw * eOut5(bp), sk = Math.tan((b.skew || 0) * Math.PI / 180) * bh;
      if (b.skew) { g.beginPath(); g.moveTo(bx + sk, by); g.lineTo(bx + sk + bwp, by); g.lineTo(bx + bwp, by + bh); g.lineTo(bx, by + bh); g.closePath(); g.fill(); }
      else g.fillRect(bx, by, bwp, bh);
    }
  }
  g.font = fontOf(it, it.size);
  g.textBaseline = "middle"; g.textAlign = "center";
  g.lineJoin = "round"; g.miterLimit = 2;
  let x = x0;
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i], cw = ws[i] - (it.track || 0) * it.size;
    const ct = it.ct ? it.ct[i] : it.t0;
    const cx = x + cw / 2;
    x += ws[i];
    if (t < ct - 0.0001) continue;
    if (ch === " " || ch === "　") continue;
    const ca = t - ct;
    let s = 1, dx = 0, dy = 0, a = 1, r = 0;
    const C = it.canim || (A === "slam" || A === "slideL" || A === "slideR" || A === "slideU" || A === "zoomin" ? "none" : A);
    if (C === "pop") { const p = ca / 0.13; s = lerp(1.9, 1, eBack(p, 1.6)); a = clamp(p * 3); dy = -it.size * 0.12 * (1 - eOut(p)); }
    else if (C === "rise") { const p = ca / 0.18; dy = it.size * 0.45 * (1 - eOut5(p)); a = clamp(p * 2); }
    else if (C === "drop") { const p = ca / 0.2; dy = -it.size * 0.8 * (1 - eBack(p, 1.2)); a = clamp(p * 3); }
    else if (C === "stamp") { const p = ca / 0.07; s = lerp(3.2, 1, eOut(p)); a = clamp(p * 2); r = (rnd(i * 7.7 + it.size) - 0.5) * 16 * (1 - clamp(p)); }
    else if (C === "type") { a = 1; }
    const cs = it.cscale ? (it.cscale[i] || 1) : 1;
    g.save();
    g.globalAlpha = ga * a;
    g.translate(cx + dx, y0 + dy); g.rotate(r * Math.PI / 180); g.scale(s * cs, s * cs);
    const col = charStyle(it, i);
    // 影（硬い影）
    if (it.hard !== false) {
      g.fillStyle = "rgba(0,0,0,0.55)";
      g.fillText(ch, it.size * 0.035, it.size * 0.05);
    }
    if (it.glow) { g.shadowColor = it.glow; g.shadowBlur = it.size * 0.35; }
    else if (it.soft !== false) { g.shadowColor = "rgba(0,0,0,0.65)"; g.shadowBlur = it.size * 0.18; }
    if (it.stroke) { g.strokeStyle = it.strokeColor || "#000"; g.lineWidth = it.stroke; g.strokeText(ch, 0, 0); g.shadowBlur = 0; g.shadowColor = "transparent"; }
    if (it.rgb && ca < it.rgb) {   // 色ずれ
      const o = it.size * 0.05 * (1 - ca / it.rgb);
      g.globalCompositeOperation = "lighter";
      g.fillStyle = "rgba(255,30,60,0.9)"; g.fillText(ch, -o, 0);
      g.fillStyle = "rgba(30,220,255,0.9)"; g.fillText(ch, o, 0);
      g.globalCompositeOperation = "source-over";
    }
    if (it.outline) { g.shadowBlur = 0; g.strokeStyle = col; g.lineWidth = it.outline; g.strokeText(ch, 0, 0); }

    g.restore();
  }
  // 残像
  if (it.echo && age >= 0 && age < 0.42) {
    const q = age / 0.42;
    g.font = fontOf(it, it.size); g.lineWidth = Math.max(2, it.size * 0.018);
    for (let k = 1; k <= it.echo; k++) {
      const es = 1 + eOut(q) * 0.22 * k;
      g.save(); g.globalAlpha = ga * (1 - q) * 0.6 / k;
      g.translate(cxg, cyg); g.scale(es, es); g.translate(-cxg, -cyg);
      g.strokeStyle = it.echoColor || charStyle(it, 0);
      let ex = x0; chars.forEach((ch, i) => { const cw = ws[i] - (it.track || 0) * it.size; g.strokeText(ch, ex + cw / 2, y0); ex += ws[i]; });
      g.restore();
    }
  }
  // 打ち消し線
  if (it.strike && t >= it.strike.t) {
    const p = eOut5((t - it.strike.t) / 0.12);
    const [i0, i1] = it.strike.range;
    let sx = x0; for (let i = 0; i < i0; i++) sx += ws[i];
    let ex = sx; for (let i = i0; i < i1; i++) ex += ws[i];
    g.save(); g.strokeStyle = it.strike.color || "#FF2D46"; g.lineWidth = it.size * 0.12; g.lineCap = "butt";
    g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = 12;
    g.beginPath(); g.moveTo(sx - 10, y0 + it.size * 0.05); g.lineTo(lerp(sx - 10, ex + 10, p), y0 - it.size * 0.05); g.stroke(); g.restore();
  }
  g.restore();
}

// ---------- 図形 ----------
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function glass(g, x, y, w, h, r, edge) {
  rr(g, x, y, w, h, r);
  g.fillStyle = "rgba(8,12,22,0.78)"; g.fill();
  g.lineWidth = 2; g.strokeStyle = edge || "rgba(120,170,255,0.55)"; g.stroke();
}
const DRAW = {};
DRAW.rec = (g, e, t) => {   // 撮影中の枠（四隅・REC・タイムコード）
  const m = 56, L = 70;
  g.save(); g.strokeStyle = "rgba(255,255,255,0.9)"; g.lineWidth = 5;
  const a = clamp((t - e.t0) / 0.15); g.globalAlpha = a;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    g.beginPath(); g.moveTo(x, y + sy * L); g.lineTo(x, y); g.lineTo(x + sx * L, y); g.stroke();
  }
  const blink = Math.floor((t - e.t0) * 2.4) % 2 === 0;
  g.font = "800 46px 'Avenir Next Condensed'"; g.textBaseline = "middle";
  if (blink) { g.fillStyle = "#FF2B3A"; g.beginPath(); g.arc(m + 46, m + 62, 15, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = "#fff"; g.fillText("REC", m + 74, m + 64);
  const tc = e.tc0 + (t - e.t0);
  const hh = Math.floor(tc / 3600), mm = Math.floor(tc / 60) % 60, ss = Math.floor(tc) % 60, ff = Math.floor((tc % 1) * 30);
  const s = [hh, mm, ss, ff].map((v) => String(v).padStart(2, "0")).join(":");
  g.textAlign = "right"; g.fillText(s, W - m - 20, m + 64);
  g.restore();
};
DRAW.threads = (g, e, t) => {   // 並列で動くスレッドの窓
  e.pos.forEach(([x, y], i) => {
    const ta = e.ts[i]; if (t < ta) return;
    const p = (t - ta) / 0.16, s = lerp(0.4, 1, eBack(p, 1.8)), a = clamp(p * 3);
    let ex = 1; if (t > e.t1) ex = 1 - clamp((t - e.t1) / 0.15);
    if (ex <= 0) return;
    const w = e.w, h = e.h;
    g.save(); g.globalAlpha = a * ex; g.translate(x + w / 2, y + h / 2); g.scale(s, s); g.translate(-w / 2, -h / 2);
    glass(g, 0, 0, w, h, 14, "rgba(120,190,255,0.6)");
    g.fillStyle = "rgba(120,190,255,0.18)"; rr(g, 0, 0, w, 40, 14); g.fill();
    g.font = "800 24px 'Avenir Next Condensed'"; g.fillStyle = "#cfe3ff"; g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText("THREAD " + String(i + 1).padStart(2, "0"), 16, 21);
    // 動いている印
    const spd = t > e.fast ? 3.2 : 1;
    const ang = (t - ta) * 6 * spd + i;
    g.strokeStyle = "#7CF7C1"; g.lineWidth = 4; g.beginPath(); g.arc(w - 26, 21, 9, ang, ang + 4.2); g.stroke();

    for (let k = 0; k < 3; k++) {
      const lw = (0.35 + 0.55 * rnd(i * 13 + k * 7 + Math.floor((t - ta) * 4 * spd))) * (w - 40);

    }

    g.fillStyle = "rgba(255,255,255,0.15)"; g.fillRect(16, h - 26, w - 32, 10);
    g.fillStyle = "#3D8BFF"; g.fillRect(16, h - 26, (w - 32) * pr, 10);
    g.restore();
  });
};
DRAW.warn = (g, e, t) => {   // 赤い警告の帯
  const p = eOut5((t - e.t0) / 0.14);

  const on = Math.floor((t - e.t0) * 8) % 2 === 0 || t - e.t0 < 0.25;
  g.save(); g.globalAlpha = a;
  const y = e.y, h = 92, x1 = W * p;
  g.beginPath(); g.rect(0, y, x1, h); g.clip();
  g.fillStyle = "#E3142B"; g.fillRect(0, y, W, h);
  g.fillStyle = "rgba(0,0,0,0.25)";
  for (let x = -200 + ((t * 300) % 80); x < W; x += 80) { g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + 40, y + h); g.lineTo(x + 80, y); g.lineTo(x + 40, y); g.closePath(); g.fill(); }
  if (on) {
    g.font = "800 64px 'Avenir Next Condensed'"; g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText("⚠  " + e.label, 60, y + h / 2 + 2);

};
DRAW.burst = (g, e, t) => {   // 爆発の線と輪
  const p = (t - e.t0) / (e.t1 - e.t0); if (p < 0 || p > 1) return;
  g.save(); g.translate(e.x, e.y);

  for (let i = 0; i < n; i++) {
    const an = (i / n) * Math.PI * 2 + rnd(i * 3.1) * 0.25;
    const r0 = lerp(e.r * 0.3, e.r * 1.9, eOut(p)), r1 = r0 + e.r * (0.9 - 0.8 * p) * (0.6 + rnd(i) * 0.8);

    g.globalAlpha = 1 - p;
    g.beginPath();
    g.moveTo(Math.cos(an - 0.02) * r0, Math.sin(an - 0.02) * r0);
    g.lineTo(Math.cos(an) * r1, Math.sin(an) * r1);
    g.lineTo(Math.cos(an + 0.02) * r0, Math.sin(an + 0.02) * r0);
    g.closePath(); g.fill();

DRAW.speed = (g, e, t) => {   // 集中線
  let a = clamp((t - e.t0) / 0.08); if (t > e.t1) a *= 1 - clamp((t - e.t1) / 0.12);
  if (a <= 0) return;
  const fr = Math.floor(t * FPS / 2);
  g.save(); g.globalAlpha = a * (e.a || 0.55); g.fillStyle = e.color || "#fff";
  const R = 1300;
  for (let i = 0; i < (e.n || 70); i++) {
    const an = rnd(i * 9.1 + fr * 1.3) * Math.PI * 2, r0 = (e.r0 || 380) + rnd(i * 4.7 + fr) * 260, wd = 0.004 + rnd(i * 2.2 + fr) * 0.01;
    g.beginPath();

DRAW.coin = (g, e, t) => {   // コイン（くるくる回る・✕がつく）
  const out = outAlpha(e, t); if (out <= 0) return;

  const xa = e.xAt != null && t >= e.xAt;

  let dx = 0, dy = 0;
  if (xa) { const k = clamp(1 - (t - e.xAt) / 0.3), fr = Math.floor(t * FPS * 2); dx = (rnd(fr * 1.3) - 0.5) * 36 * k; dy = (rnd(fr * 2.1) - 0.5) * 24 * k; }
  g.save(); g.globalAlpha = a * out; g.translate(e.x + dx, e.y + dy); g.scale(s, s);

    g.strokeStyle = "#FF2D46"; g.lineWidth = e.r * 0.24; g.lineCap = "round"; g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = 16;

    if (d2 > 0) { g.beginPath(); g.moveTo(m, -m); g.lineTo(lerp(m, -m, eOut(d2)), lerp(-m, m, eOut(d2))); g.stroke(); }

DRAW.coinrain = (g, e, t) => {   // コインが降ってくる
  if (t < e.t0 || t > e.t1 + 0.3) return;
  const dur = e.t1 - e.t0, a = t > e.t1 ? 1 - clamp((t - e.t1) / 0.25) : 1;
  for (let i = 0; i < e.n; i++) {
    const ts = e.t0 + rnd(i * 3.3 + 1) * dur * 0.7; if (t < ts) continue;
    const age = t - ts, x = lerp(e.x0, e.x1, rnd(i * 7.1 + 2)), sp = (e.v0 || 900) + rnd(i * 5.5) * ((e.v1 || 1500) - (e.v0 || 900)), r = e.r0 + rnd(i * 2.2) * (e.r1 - e.r0);
    const y = -r + age * sp; if (y > H + r) continue;
    g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate((rnd(i * 9.9) - 0.5) * 0.7 + age * (rnd(i) - 0.5) * 3);

DRAW.timer = (g, e, t) => {   // ストップウォッチ（輪が一周して 0 → 5）
  const out = outAlpha(e, t); if (out <= 0) return;
  const p = (t - e.t0) / 0.16, s = lerp(0.4, 1, eBack(p, 1.8)), a = clamp(p * 3), v = eOut(clamp((t - e.tick) / e.dur)), r = e.r;
  g.save(); g.globalAlpha = a * out; g.translate(e.x, e.y); g.scale(s, s);
  g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 28; g.shadowOffsetY = 12;
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fillStyle = "rgba(8,12,22,.88)"; g.fill(); g.shadowColor = "transparent";
  g.lineWidth = r * 0.06; g.strokeStyle = "rgba(255,255,255,.28)"; g.stroke();
  for (let k = 0; k < 60; k++) { const an = k / 60 * Math.PI * 2 - Math.PI / 2, big = k % 5 === 0, r0 = r * (big ? 0.82 : 0.88), r1 = r * 0.95; g.strokeStyle = big ? "#fff" : "rgba(255,255,255,.4)"; g.lineWidth = big ? 4 : 2; g.beginPath(); g.moveTo(Math.cos(an) * r0, Math.sin(an) * r0); g.lineTo(Math.cos(an) * r1, Math.sin(an) * r1); g.stroke(); }
  g.lineCap = "round"; g.lineWidth = r * 0.11; g.strokeStyle = "#FFD23F"; g.shadowColor = "rgba(255,210,63,.85)"; g.shadowBlur = 20;
  if (v > 0) { g.beginPath(); g.arc(0, 0, r * 0.66, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * v); g.stroke(); }

  g.font = `800 ${r * 0.95}px 'Avenir Next Condensed'`; g.fillText(String(Math.round(e.to * v)), 0, -r * 0.04);
  g.font = `800 ${r * 0.26}px 'Hiragino Sans'`; g.fillStyle = "rgba(255,255,255,.85)"; g.fillText("秒", 0, r * 0.52);

DRAW.students = (g, e, t) => {   // 大学生が並び、頭の上にコインが出る
  const out = outAlpha(e, t); if (out <= 0) return;
  const cols = ["#3D8BFF", "#FF5A6E", "#19D38A", "#FFB22E", "#9A6BFF"];
  for (let i = 0; i < e.n; i++) {
    const ti = e.ts[i]; if (t < ti) continue;

    g.save(); g.globalAlpha = a * out; g.translate(cx, cy + (1 - clamp(p)) * 30); g.scale(s, s);
    g.shadowColor = "rgba(0,0,0,.5)"; g.shadowBlur = 20; g.shadowOffsetY = 8; studentDraw(g, e.size * 0.8, cols[i % cols.length]); g.restore();

DRAW.sparkles = (g, e, t) => {   // きらきら
  if (t < e.t0 || t > e.t1 + 0.3) return;

// ---------- 1つの時刻の絵 ----------
function drawScene(g, t, img) {
  const c = camera(t), s = c.s;
  g.save();

  g.translate(W / 2 + c.sx, H / 2 + c.sy); g.rotate(c.sr);
  // 背景
  g.save();
  g.scale(c.z, c.z); g.translate(-c.cx, -c.cy);
  g.filter = s.filter || "contrast(1.2) saturate(0.78) brightness(0.86)";
  if (img) g.drawImage(img, 0, 0, 1920, 1080);
  g.filter = "none";
  g.restore();
  g.translate(-W / 2, -H / 2);
  // 色味・暗くする
  if (s.tint) { g.save(); g.globalCompositeOperation = s.tintBlend || "soft-light"; g.globalAlpha = s.tintA || 0.5; g.fillStyle = s.tint; g.fillRect(-50, -50, W + 100, H + 100); g.restore(); }
  for (const e of HL.fx) if (e.type === "tint" && t >= e.t0 && t < e.t1) { g.save(); g.globalCompositeOperation = e.blend || "soft-light"; g.globalAlpha = e.a; g.fillStyle = e.color; g.fillRect(-50, -50, W + 100, H + 100); g.restore(); }
  const sh = s.shade || "left";
  if (sh === "left" || sh === "both") { const gr = g.createLinearGradient(0, 0, W * 0.72, 0); gr.addColorStop(0, "rgba(0,0,0,0.72)"); gr.addColorStop(0.55, "rgba(0,0,0,0.38)"); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(-50, -50, W + 100, H + 100); }
  if (sh === "bottom" || sh === "both") { const gr = g.createLinearGradient(0, H * 0.45, 0, H); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,0.7)"); g.fillStyle = gr; g.fillRect(-50, -50, W + 100, H + 100); }

  }

  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.6)"); g.fillStyle = vg; g.fillRect(-50, -50, W + 100, H + 100);

    if (t >= e.t1 && HL.shots.some((x) => x.t0 > e.t1 - 1e-6 && x.t0 <= t)) continue;   // 終わった後にカットが変わったら、消えている途中でも消す
    if (e.type === "txt") drawText(g, e, t); else if (DRAW[e.type]) DRAW[e.type](g, e, t);

  for (const e of HL.fx) {

// ---------- 仕上げ（グリッチ・色の反転・横ぶれ・粒） ----------
function post(t, f) {
  for (const e of HL.fx) {
    if (t < e.t || t >= e.t + e.d) continue;
    const p = (t - e.t) / e.d;
    if (e.type === "glitch") {
      tctx.drawImage(cv, 0, 0);
      const amt = (e.amt || 1) * (1 - p * 0.6);
      // 横の帯をずらす

      for (let i = 0; i < n; i++) {

// ---------- 動きの速さ（重ねる回数） ----------

window.render = async function (f) {
  const t = f / FPS;
  const img = await loadBg(f);
  loadBg(f + 1);
  const S = subframes(t);
  if (S <= 1) drawScene(ctx, t, img);
  else {
    const sh = 0.5 / FPS;   // 180°のシャッター
    // カットの切り替わり（場面・色の板・パッと消える文字）をまたがない

      drawScene(sctx, tk, img);
      ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(sub, 0, 0); ctx.globalAlpha = 1;

HL.els.forEach((e, i) => { if (!e.id) e.id = "e" + i; itemById.set(e.id, e); });
Promise.all(HL.fontsToLoad.map((f) => document.fonts.load(f, "あA3"))).then(() => document.fonts.ready).then(() => { window.__ready = true; });
