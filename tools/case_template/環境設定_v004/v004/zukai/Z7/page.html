<script>
window.ZUKAI = { frames: 962 };
const $ = (id) => document.getElementById(id);
$('h_head').innerHTML = Z.plate('Addnessは なんで速い？', { size: 72, bg: '#fff', fg: '#000', pad: '4px 24px 12px' });
$('h_you').innerHTML = Z.img(Z.ILLUST + encodeURIComponent('パソコン業務.png'), { w: 207, h: 300 });
$('h_tag').innerHTML = Z.plate('あなた', { size: 50, bg: '#fff', fg: '#000', pad: '2px 18px 8px' });
$('h_think_tag').innerHTML = Z.plate('考えること', { size: 50, bg: '#1b5fd1' });
$('h_motsu').innerHTML = Z.stk('Addnessが\n持つ', { size: 48 });
$('h_tanomu').innerHTML = Z.bubble('頼む', { size: 54, tail: 'left', off: 24 });
$('h_close1').innerHTML = Z.stk('「頼む」だけで\n仕事が進む', { size: 70, fill: '#f5e63a', strokes: [['#000', 16]], font: 'Tsk' });
$('h_rarr').innerHTML = Z.arrow({ len: 350, dir: 'right', color: '#e60000' });
$('h_ai').innerHTML = Z.plate('AI', { size: 48, bg: '#fff', fg: '#000', pad: '0px 20px 6px' });
$('h_douji').innerHTML = Z.stk('同時に', { size: 90, fill: '#f5e63a', strokes: [['#000', 18]], font: 'Tsk', lh: 1.05 });
$('h_sou').innerHTML = Z.bubble('そういうこと', { size: 52, tail: 'right', off: 22 });
// ✓（dots と同じ緑の丸）
const CHK = '<svg width="64" height="64" viewBox="0 0 60 60" style="display:block"><circle cx="30" cy="30" r="27" fill="#1a9a0a" stroke="#fff" stroke-width="4"/>' +
  '<polyline points="17,31 26,40 44,21" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
for (const k of ['k1', 'k2', 'k3', 'k4']) $(k).firstElementChild.innerHTML = CHK;
// 点線の矢印（白。grow で伸びる。Z.arrow と同じ仕組みで軸だけ点線）
(function () {
  const len = 296, hl = 44, hw = 60, id = 'z7dash';
  $('h_darr').innerHTML = `<svg class="arr" data-len="${len}" data-hl="${hl}" data-v="0" width="${len}" height="${hw}" style="overflow:visible;display:block">` +
    `<defs><clipPath id="${id}"><rect class="clip" x="0" y="0" width="0" height="${hw}"/></clipPath></defs>` +
    `<g clip-path="url(#${id})"><line x1="0" y1="${hw / 2}" x2="${len - hl + 2}" y2="${hw / 2}" stroke="#fff" stroke-width="12" stroke-dasharray="22 14"/></g>` +
    `<g class="head"><polygon points="${len - hl},0 ${len},${hw / 2} ${len - hl},${hw}" fill="#fff"/></g></svg>`;
})();

// カードの動き：吹き出しの中（B）→「頼む」で点線に沿って箱へ飛ぶ（S。散らばったまま）→「整理整頓」で縦一列（C）
const CW = 130, CH = 80;
const B = [[135, 300, -6, 0.8], [245, 285, 5, 0.8], [355, 305, -4, 0.8], [465, 290, 7, 0.8]];
const S = [[950, 330, -8, 1], [1120, 352, 7, 1], [980, 470, 5, 1], [1140, 525, -6, 1]];
const C = [[1030, 300, 0, 1], [1030, 387, 0, 1], [1030, 474, 0, 1], [1030, 561, 0, 1]];
const FLY = 374, FLYD = 12, LINE = 435, LINED = 9;
const ease = (q) => q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
const lerp = (a, b, q) => a + (b - a) * q;
function cardAt(i, f) {
  const t1 = FLY + 2 * i;
  if (f < t1) return B[i];
  if (f < t1 + FLYD) {
    const q = ease((f - t1 + 1) / FLYD);
    const p = B[i].map((v, j) => lerp(v, S[i][j], q));
    p[1] -= 70 * Math.sin(Math.PI * q);             // 少し弧を描いて飛ぶ
    return p;
  }
  if (f < LINE) return S[i];
  if (f < LINE + LINED) { const q = ease((f - LINE + 1) / LINED); return S[i].map((v, j) => lerp(v, C[i][j], q)); }
  return C[i];
}
// 箱：「大きい目的」で右いっぱいに広がる
const BOX0 = [860, 175, 380, 475], BOX1 = [600, 180, 1260, 470], GROW_AT = 592, GROWD = 8;
function boxAt(f) {
  if (f < GROW_AT) return BOX0;
  const q = ease(Math.min(1, (f - GROW_AT + 1) / GROWD));
  return BOX0.map((v, j) => lerp(v, BOX1[j], q));
}
window.ZUKAI.custom = (f) => {
  const sig = [];
  for (let i = 0; i < 4; i++) {
    const [cx, cy, r, s] = cardAt(i, f);
    const e = $('c' + (i + 1));
    e.style.left = (cx - CW / 2).toFixed(1) + 'px'; e.style.top = (cy - CH / 2).toFixed(1) + 'px';
    $('c' + (i + 1) + 'b').style.transform = `rotate(${r.toFixed(2)}deg) scale(${s.toFixed(3)})`;
    sig.push(cx.toFixed(1), cy.toFixed(1), r.toFixed(2), s.toFixed(3));
  }
  const [x, y, w, h] = boxAt(f);
  $('box').style.left = x.toFixed(1) + 'px'; $('box').style.top = y.toFixed(1) + 'px';
  $('boxv').style.width = w.toFixed(1) + 'px'; $('boxv').style.height = h.toFixed(1) + 'px';
  sig.push(x.toFixed(1), y.toFixed(1), w.toFixed(1), h.toFixed(1));
  return sig.join('|');
};
