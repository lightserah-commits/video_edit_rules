# カットの追加ルール（工程3 カット）
#
# カットの決まりは、このファイルが正。文字起こし・通常テロップ・話者の決まりは ルール/08_字幕.yaml が正（2026-11-04 に 08 を2つに分けた）。
# 上司の方法セット（10 カットと構成・20 間・30 文節と言葉・31 固有名詞辞書）のうち今も使う所は、2026-10-17 にここへ移した。編集では上司の資料は読まない（原典として残し、上司から新しい版が来た時に見比べる）。
# 上司の決まりと食い違って見える時は、推測で決めずにユーザーに確認する（違って見える点は 上司の資料/README.md）。
#
# 書き方：rule＝すること／how＝やり方／check＝確かめ方（道具。コマンドは ルール/工程/09_検査.md）／why＝根拠（いつ・誰の指示）
#   長い経緯・観測の数字・例は 実例/根拠と実例.md の「08」（cut の案件の例と言葉は「08 の cut の経緯」）、変えた記録は 記録/変更履歴.md。
#   【試し中】＝1本の動画の少ない例から決めた所と、AI が決めた目安の数字。次の2本の案件でも使い、小川さんの直しと食い違わなければ印を外す。食い違ったら小川さんに見せて直す
# 並び：品質の基準 → カット（動画の型 → 考え方 → 2段階 → 切るもの（塊で切る → 1文だけ切る → 細かい中身）→ 残すもの → つなぎ目 → 話のつながり → 間 → 切れ端 → 並べ替え → 尺の変更）

