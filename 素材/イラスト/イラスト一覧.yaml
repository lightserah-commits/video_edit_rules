# イラストの一覧（役×気持ちで選ぶ）
#
# 根拠: 2本目（~/Downloads/コピー_AI時代に消える仕事残る仕事/）で実際に使われたイラスト（いらすとや）24枚をコピーしたもの。
#       その動画専用のもの（ニュースのスクショ・企業ロゴ・出どころの分からない写真風の画像）は入れていない。
# 決めた日: 2026-09-26（ユーザー確認。「イラストを1枚ずつ定義するのは大変なので、役と気持ちで選べるようにする」）
#
# 使い方:
#   1. 何を見せたいかを「役」と「気持ち」の2つで決める（例：会社員男性×疑問）
#   2. 下の表から一番近いものを選ぶ。役が合って気持ちが違うなら、気持ちの近いもの（疑問≒困り、喜び≒笑顔）で代える
#   3. 合うものが無い時は、いらすとやで探した候補（ファイル名・ページ・大きさ）をユーザーに見せ、ダウンロードの許可をもらってから
#      このフォルダに足し、この表に1行足す（CLAUDE.md：無断で外部から取らない）
#   使う所: 常識を引っ張る代弁（02 の P16）の役の絵、図解（09_図解.md）の人物・もの
#   置き方: 静止画として Premiere で読み込んで置く（テロップの中に埋め込まない。役ごとに替えられるように）

